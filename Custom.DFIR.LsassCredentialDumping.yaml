name: Custom.DFIR.LsassCredentialDumping
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects evidence of credential dumping via LSASS memory access using Sysmon event logs.
  
  Monitors Sysmon Event IDs 10 (ProcessAccess) for processes requesting suspicious access
  masks on lsass.exe, and Event ID 8 (CreateRemoteThread) targeting lsass.exe. Also checks
  for known credential dumping tool process names and command lines.

reference:
  - https://attack.mitre.org/techniques/T1003.001/

type: CLIENT

parameters:
  - name: SysmonEvtxGlob
    type: glob
    default: "C:/Windows/System32/winevt/Logs/Microsoft-Windows-Sysmon* Operational.evtx"
  - name: SuspiciousAccessMasks
    type: regex
    default: "0x1010|0x1410|0x143a|0x1f0fff|0x1f1fff|0x1f2fff|0x1f3fff|PROCESS_VM_READ|PROCESS_ALL_ACCESS"
  - name: CredentialDumpToolRegex
    type: regex
    default: "(?i)mimikatz|procdump|dumpert|rundll32.*comsvcs\\.dll|minidump|nanodump|pypykatz|sharpkatz|sekurlsa|lsadump|credential::"
  - name: SuspiciousProcessRegex
    type: regex
    default: "(?i)mimikatz|procdump|rundll32|taskmgr|lsassy|hack|crack|dump|pw|pass"
  - name: DateRegex
    type: regex
    default: "."

sources:
  - name: LsassProcessAccess
    description: |
      Sysmon Event ID 10 - ProcessAccess events where a source process accesses lsass.exe
      with suspicious access masks indicating potential credential dumping.
    query: |
      LET EvtxFiles <= SELECT OSPath FROM glob(globs=SysmonEvtxGlob)

      LET RawEvents <= SELECT * FROM foreach(
        row=EvtxFiles,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            System.EventID.Value AS EventID,
            EventData
          FROM parse_evtx(filename=OSPath)
          WHERE EventID = 10
            AND EventData.TargetImage =~ "(?i)lsass\\.exe$"
        })

      SELECT
        timestamp(epoch=EventTime) AS EventTime,
        EventData.SourceImage AS SourceImage,
        EventData.SourceProcessId AS SourceProcessId,
        EventData.TargetImage AS TargetImage,
        EventData.TargetProcessId AS TargetProcessId,
        EventData.GrantedAccess AS GrantedAccess,
        EventData.CallTrace AS CallTrace,
        if(condition=EventData.SourceImage =~ CredentialDumpToolRegex,
          then="CredentialDumpTool",
          else=if(condition=EventData.GrantedAccess =~ SuspiciousAccessMasks,
            then="SuspiciousAccessMask",
            else="ProcessAccess"))
          AS DetectionCategory,
        if(condition=EventData.SourceImage =~ SuspiciousProcessRegex,
          then="Yes", else="No") AS SourceProcessSuspicious
      FROM RawEvents
      WHERE EventData.SourceImage =~ SuspiciousProcessRegex
        OR EventData.GrantedAccess =~ SuspiciousAccessMasks
        OR EventData.SourceImage =~ CredentialDumpToolRegex

  - name: LsassRemoteThread
    description: |
      Sysmon Event ID 8 - CreateRemoteThread events targeting lsass.exe, indicating
      potential injection or credential dumping activity.
    query: |
      LET EvtxFiles <= SELECT OSPath FROM glob(globs=SysmonEvtxGlob)

      LET RawEvents <= SELECT * FROM foreach(
        row=EvtxFiles,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            System.EventID.Value AS EventID,
            EventData
          FROM parse_evtx(filename=OSPath)
          WHERE EventID = 8
            AND EventData.TargetImage =~ "(?i)lsass\\.exe$"
        })

      SELECT
        timestamp(epoch=EventTime) AS EventTime,
        EventData.SourceImage AS SourceImage,
        EventData.SourceProcessId AS SourceProcessId,
        EventData.TargetImage AS TargetImage,
        EventData.TargetProcessId AS TargetProcessId,
        EventData.NewThreadId AS NewThreadId,
        EventData.StartAddress AS StartAddress,
        "RemoteThreadIntoLsass" AS DetectionCategory
      FROM RawEvents

  - name: CredentialDumpProcessCreation
    description: |
      Sysmon Event ID 1 - Process creation events for known credential dumping tools
      or suspicious command lines targeting LSASS.
    query: |
      LET EvtxFiles <= SELECT OSPath FROM glob(globs=SysmonEvtxGlob)

      LET RawEvents <= SELECT * FROM foreach(
        row=EvtxFiles,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            System.EventID.Value AS EventID,
            EventData
          FROM parse_evtx(filename=OSPath)
          WHERE EventID = 1
        })

      SELECT
        timestamp(epoch=EventTime) AS EventTime,
        EventData.Image AS Image,
        EventData.ProcessId AS ProcessId,
        EventData.ParentImage AS ParentImage,
        EventData.ParentProcessId AS ParentProcessId,
        EventData.CommandLine AS CommandLine,
        EventData.User AS User,
        if(condition=EventData.Image =~ CredentialDumpToolRegex,
          then="KnownCredentialDumpTool",
          else=if(condition=EventData.CommandLine =~ CredentialDumpToolRegex,
            then="CredentialDumpCommandLine",
            else="SuspiciousProcess"))
          AS DetectionCategory
      FROM RawEvents
      WHERE EventData.Image =~ CredentialDumpToolRegex
        OR EventData.CommandLine =~ CredentialDumpToolRegex
        OR (EventData.CommandLine =~ "(?i)lsass"
              AND EventData.Image =~ "(?i)(procdump|rundll32|taskmgr)")
        OR EventData.CommandLine =~ "(?i)comsvcs\\.dll.*#\\d+.*lsass"

column_types:
  - name: EventTime
    type: timestamp
  - name: SourceImage
    type: path
  - name: TargetImage
    type: path
  - name: Image
    type: path
  - name: ParentImage
    type: path