name: Custom.DFIR.AWSCredentialAccessOutsideHours
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts for AWS credential and configuration files that were accessed outside
  normal working hours. Attackers and insider threats often access sensitive
  cloud credential files at unusual times to exfiltrate them for lateral movement
  into AWS environments.

  MITRE ATT&CK: T1552.001 - Unsecured Credentials: Credentials in Files

  Targets common AWS credential paths on Linux, macOS, and Windows.
  Access time (Atime) is evaluated in local time using a configurable UTC offset.
  UTC hour is derived via integer arithmetic (total hours minus total days * 24)
  to avoid the unsupported modulo operator in VQL.

reference:
  - https://attack.mitre.org/techniques/T1552.001/
  - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html

type: CLIENT

parameters:
  - name: LinuxMacGlob
    type: glob
    default: "/{home,root,Users}/*/.aws/{credentials,config}"
    description: Glob pattern for Linux/macOS AWS credential paths
  - name: WindowsGlob
    type: glob
    default: "C:/Users/*/.aws/{credentials,config}"
    description: Glob pattern for Windows AWS credential paths
  - name: FilterRegex
    type: regex
    default: "."
    description: Regex filter applied to matched file paths
  - name: WorkdayStartHour
    type: int
    default: 9
    description: "Start of normal working hours in local time (0-23)"
  - name: WorkdayEndHour
    type: int
    default: 18
    description: "End of normal working hours in local time (0-23)"
  - name: TZOffsetHours
    type: int
    default: 0
    description: "Local timezone offset from UTC in whole hours (e.g. 2 for UTC+2, -5 for EST)"
  - name: UploadFiles
    type: bool
    default: false
    description: Upload matching credential files as forensic evidence

sources:
  - name: AWSCredentialAccess
    description: AWS credential files with access times outside configured working hours
    query: |
      LET AllFiles <= SELECT OSPath, Size, Atime, Mtime, Ctime
        FROM glob(globs=[LinuxMacGlob, WindowsGlob])
        WHERE OSPath =~ FilterRegex AND Atime

      LET WithUTCHour <= SELECT OSPath, Size, Atime, Mtime, Ctime,
        int(int=Atime.Unix / 3600) - int(int=Atime.Unix / 86400) * 24 AS UTCHour
        FROM AllFiles

      LET WithLocal <= SELECT OSPath, Size, Atime, Mtime, Ctime, UTCHour,
        if(condition=UTCHour + TZOffsetHours < 0,
          then=UTCHour + TZOffsetHours + 24,
          else=if(condition=UTCHour + TZOffsetHours >= 24,
            then=UTCHour + TZOffsetHours - 24,
            else=UTCHour + TZOffsetHours)) AS AccessHourLocal
        FROM WithUTCHour

      SELECT * FROM if(
        condition=UploadFiles,
        then={
          SELECT OSPath, Size, Atime, Mtime, Ctime, AccessHourLocal,
            upload(file=OSPath) AS Upload
          FROM WithLocal
          WHERE AccessHourLocal < WorkdayStartHour OR AccessHourLocal >= WorkdayEndHour
        },
        else={
          SELECT OSPath, Size, Atime, Mtime, Ctime, AccessHourLocal
          FROM WithLocal
          WHERE AccessHourLocal < WorkdayStartHour OR AccessHourLocal >= WorkdayEndHour
        }
      )

column_types:
  - name: Atime
    type: timestamp
  - name: Mtime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: OSPath
    type: url
