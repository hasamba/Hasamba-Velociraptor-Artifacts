name: Custom.DFIR.AWSCredentialAfterHoursAccess
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for AWS credential files accessed outside normal working hours.

  Adversaries often steal cloud credentials by accessing AWS credential files
  (~/.aws/credentials, ~/.aws/config) during off-hours to blend in with legitimate
  activity. This artifact identifies AWS credential files that were recently
  accessed or modified outside configurable working hours, along with file hashes
  for triage.

  MITRE ATT&CK T1552.001 - Unsecured Credentials: Credentials In Files

reference:
  - https://attack.mitre.org/techniques/T1552.001/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: "C:/Users/**/.aws/credentials"
  - name: ConfigGlob
    type: glob
    default: "C:/Users/**/.aws/config"
  - name: FilterRegex
    type: regex
    default: "."
  - name: WorkStartHour
    type: int
    default: 8
  - name: WorkEndHour
    type: int
    default: 18
  - name: UploadFiles
    type: bool
    default: false

sources:
  - name: CredentialFiles
    description: AWS credential files accessed outside normal working hours
    query: |
      LET CredFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime
        FROM glob(globs=TargetGlob)
        WHERE OSPath =~ FilterRegex

      LET ConfigFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime
        FROM glob(globs=ConfigGlob)
        WHERE OSPath =~ FilterRegex

      LET AllFiles <= SELECT * FROM chain(
        a={ SELECT * FROM CredFiles },
        b={ SELECT * FROM ConfigFiles })

      LET WithHashes <= SELECT
          OSPath,
          Size,
          Mtime,
          Atime,
          Ctime,
          hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes,
          timestamp(epoch=Mtime) AS ModifiedTime,
          timestamp(epoch=Atime) AS AccessedTime,
          timestamp(epoch=Ctime) AS CreatedTime
        FROM AllFiles

      LET AfterHours <= SELECT
          OSPath,
          Size,
          ModifiedTime,
          AccessedTime,
          CreatedTime,
          Hashes.MD5 AS MD5,
          Hashes.SHA256 AS SHA256
        FROM WithHashes
        WHERE int(int=format(format="%H", args=[ModifiedTime])) < WorkStartHour
           OR int(int=format(format="%H", args=[ModifiedTime])) >= WorkEndHour

      SELECT * FROM if(condition=UploadFiles,
        then={
          SELECT OSPath, Size, ModifiedTime, AccessedTime, CreatedTime, MD5, SHA256, upload(file=OSPath) AS Upload
          FROM AfterHours
        },
        else={
          SELECT OSPath, Size, ModifiedTime, AccessedTime, CreatedTime, MD5, SHA256
          FROM AfterHours
        })

column_types:
  - name: ModifiedTime
    type: timestamp
  - name: AccessedTime
    type: timestamp
  - name: CreatedTime
    type: timestamp
  - name: OSPath
    type: tree