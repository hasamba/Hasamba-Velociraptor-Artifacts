name: Custom.DFIR.BrowserCredentialDbAccess
description: |
  Hunt for browser credential stores (Login Data, Login Data For Account,
  logins.json) on Windows endpoints.

  Credential theft tools dump or copy these SQLite / JSON files. Their
  presence under user profiles, access from uncommon processes, and unusual
  sizes are strong T1555.003 indicators. Hashes are collected to allow
  comparison against known-good dumps and malware samples.

author: Yaniv Radunsky @ tenroot & Hohit (AI)

reference:
  - https://attack.mitre.org/techniques/T1555.003/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: |
      C:/Users/*/AppData/**/{Login Data,Login Data For Account,Web Data,logins.json,key4.db,signons.sqlite}
  - name: PathFilterRegex
    type: regex
    default: "."
  - name: ExclusionRegex
    type: regex
    default: "^$"

sources:
  - name: Results
    description: Browser credential database files found in user profiles.
    query: |
      LET Files = SELECT
        OSPath,
        Size,
        Mtime,
        Btime,
        SysPath
      FROM glob(globs=TargetGlob)
      WHERE NOT IsDir

      SELECT
        OSPath,
        SysPath,
        Size,
        Mtime AS ModifiedTime,
        Btime AS CreatedTime,
        hash(path=SysPath, hashselect="MD5,SHA256").MD5 AS MD5,
        hash(path=SysPath, hashselect="MD5,SHA256").SHA256 AS SHA256,
        read_file(filename=OSPath, length=32) AS HeaderBytes
      FROM Files
      WHERE OSPath =~ PathFilterRegex
        AND NOT OSPath =~ ExclusionRegex

column_types:
  - name: ModifiedTime
    type: timestamp
  - name: CreatedTime
    type: timestamp
  - name: OSPath
    type: lr
  - name: SysPath
    type: lr
