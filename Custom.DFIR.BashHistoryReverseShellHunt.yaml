name: Custom.DFIR.BashHistoryReverseShellHunt
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for reverse shell patterns in bash history files across local users on Linux endpoints.
  
  This artifact inspects common bash history locations, parses commands line by line,
  and flags entries matching suspicious reverse shell, shell redirection, and network
  callback patterns associated with interactive command execution abuse.

reference:
  - https://attack.mitre.org/techniques/T1059.004/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: "/root/.bash_history,/home/*/.bash_history"
  - name: FilterRegex
    type: regex
    default: '(?i)(bash\s+-i|sh\s+-i|nc\s+-e|ncat\s+.*(--exec|-e)|socat\s+.*exec:|/dev/tcp/|mkfifo\s+.*\|\s*(sh|bash)|python(3)?\s+-c\s+.*socket|perl\s+-e\s+.*socket|php\s+-r\s+.*fsockopen|ruby\s+-rsocket|openssl\s+s_client\s+.*\|\s*(sh|bash)|curl\s+.*\|\s*(sh|bash)|wget\s+.*\|\s*(sh|bash))'
  - name: ContextLines
    type: int
    default: 0
  - name: UploadHits
    type: bool
    default: false

sources:
  - name: Results
    description: Parse bash history files and surface lines matching reverse shell patterns.
    query: |
      LET HistoryFiles <= SELECT OSPath, Size, Mtime
        FROM glob(globs=split(string=TargetGlob, sep=","))
        WHERE Size > 0

      LET ParsedLines <= SELECT
          OSPath,
          Size,
          Mtime,
          Line,
          LineNumber
        FROM foreach(
          row=HistoryFiles,
          query={
            SELECT
              HistoryFiles.OSPath AS OSPath,
              HistoryFiles.Size AS Size,
              HistoryFiles.Mtime AS Mtime,
              Line,
              LineNumber
            FROM split_records(
              filenames=HistoryFiles.OSPath,
              regex="\n",
              columns=["Line"])
          })

      LET Hits <= SELECT
          OSPath,
          Size,
          Mtime,
          LineNumber,
          Line,
          if(condition=Line =~ "^\s*#\d+$", then="HistoryTimestampMarker", else="Command") AS EntryType
        FROM ParsedLines
        WHERE Line =~ FilterRegex

      LET Uploaded <= SELECT
          Hits.OSPath AS OSPath,
          Hits.Size AS Size,
          Hits.Mtime AS Mtime,
          Hits.LineNumber AS LineNumber,
          Hits.Line AS Line,
          Hits.EntryType AS EntryType,
          upload(file=Hits.OSPath) AS Upload
        FROM Hits

      SELECT * FROM if(
        condition=UploadHits,
        then={ SELECT * FROM Uploaded },
        else={ SELECT OSPath, Size, Mtime, LineNumber, Line, EntryType FROM Hits })

column_types:
  - name: OSPath
    type: path
  - name: Mtime
    type: timestamp
  - name: LineNumber
    type: int
