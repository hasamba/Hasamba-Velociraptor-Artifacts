name: Custom.DFIR.BashHistoryReverseShellHunt
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts for reverse shell patterns in bash history files across all users.

  Attackers with interactive shell access (T1059.004 - Unix Shell) often spawn
  reverse shells to callback infrastructure. Commands like "bash -i >& /dev/tcp/...",
  "nc -e /bin/sh", or socat EXEC pipelines leave traces in user .bash_history
  files. This artifact scans all users' shell history files for such patterns
  and returns matching command lines with surrounding file metadata for triage.

reference:
  - https://attack.mitre.org/techniques/T1059.004/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: |
      ["/root/.bash_history","/root/.zsh_history","/home/*/.bash_history","/home/*/.zsh_history"]
  - name: ReverseShellRegex
    type: regex
    default: "(bash +-i[^\\n]*>&[^\\n]*/dev/(tcp|udp)/|/dev/(tcp|udp)/|nc [^\\n]*(-e|-c)[^\\n]*sh|socat [^\\n]*EXEC[^\\n]*sh|openssl s_client[^\\n]*(sh|bash)|mkfifo[^\\n]*(nc|netcat))"
  - name: ExcludeUserRegex
    type: regex
    default: "^$"

sources:
  - name: Results
    description: Reverse shell command lines found in user shell history files
    query: |
      LET Files = SELECT OSPath, Size, Mtime AS FileMtime
        FROM glob(globs=TargetGlob)
        WHERE Size > 0 AND NOT OSPath =~ ExcludeUserRegex

      SELECT
        OSPath AS HistoryFile,
        User,
        LineNumber,
        Line,
        FileMtime
      FROM foreach(
        row=Files,
        query={
          SELECT
            OSPath,
            parse_string_with_regex(
              string=OSPath,
              regex="(?:^|home|^root/)([^/]+)/[^/]+$"
            ).field_0 AS User,
            LineNumber,
            Line,
            FileMtime
          FROM split_records(
            filenames=OSPath,
            regex="\\n",
            columns=["Line"]
          )
          WHERE Line =~ ReverseShellRegex
        })

  - name: FileInventory
    description: All shell history files examined and their metadata
    query: |
      SELECT OSPath, Size, Mtime AS FileMtime
      FROM glob(globs=TargetGlob)
      WHERE NOT OSPath =~ ExcludeUserRegex

column_types:
  - name: FileMtime
    type: timestamp
