name: Custom.DFIR.DLLSearchOrderHijack
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for evidence of DLL search order hijacking via temp directories and PATH analysis.

  DLL search order hijacking (T1574.001) occurs when an attacker places a malicious
  DLL in a directory that is searched before the legitimate DLL location. Windows
  searches directories in a predictable order: application directory, System32,
  System, Windows, CWD, PATH. By dropping a DLL in a temp directory or a directory
  appearing early in PATH, attackers can achieve execution without modifying the
  legitimate binary.

  This artifact detects:
  1. Suspicious DLLs in temp and user-writable directories
  2. Processes with executables running from suspicious paths
  3. PATH entries that are user-writable or precede System32
  4. DLLs found in writable PATH directories (potential hijack candidates)

reference:
  - https://attack.mitre.org/techniques/T1574.001/

type: CLIENT

parameters:
  - name: TempGlobs
    type: csv
    default: |
      Glob
      C:/Windows/Temp/**/*.dll
      C:/Users/*/AppData/Local/Temp/**/*.dll
      C:/Users/*/Downloads/**/*.dll
      C:/Users/*/AppData/Local/**/*.dll
      C:/ProgramData/**/*.dll
  - name: SuspiciousPathRegex
    type: regex
    default: "(?i)(temp|downloads|appdata|programdata|desktop|public)"
  - name: LegitDirRegex
    type: regex
    default: "(?i)(system32|syswow64|winsxs|windows\\\\assembly|microsoft\\.net)"
  - name: KnownHijackDlls
    type: string
    default: "version.dll,wininet.dll,ws2_32.dll,winmm.dll,uxtheme.dll,dwmapi.dll,cryptbase.dll,dbghelp.dll,devobj.dll,dxgi.dll,ntmarta.dll,powrprof.dll,profapi.dll,sechost.dll,userenv.dll,virtdisk.dll"
  - name: UploadHits
    type: bool
    default: N

sources:
  - name: TempDirDLLs
    description: DLLs found in temp and user-writable directories commonly abused for DLL search order hijacking
    query: |
      LET TempDirList <= SELECT Glob FROM parse_csv(filename=TempGlobs, accessor="data")

      LET RawDLLs <= SELECT OSPath, Size, Mtime, Atime, Ctime,
        basename(path=OSPath) AS DllName
      FROM foreach(row=TempDirList, query={
        SELECT OSPath, Size, Mtime, Atime, Ctime,
          basename(path=OSPath) AS DllName
        FROM glob(globs=Glob)
      })
      WHERE DllName =~ "\\.dll$"

      LET HashedDLLs <= SELECT OSPath, Size, Mtime, Atime, Ctime, DllName,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM RawDLLs

      SELECT OSPath, Size, Mtime, Atime, Ctime, DllName,
        Hashes.MD5 AS MD5, Hashes.SHA256 AS SHA256,
        if(condition=UploadHits,
          then=upload(file=OSPath),
          else="N/A") AS Upload
      FROM HashedDLLs

  - name: ProcessesFromSuspiciousPaths
    description: Running processes whose executable resides in a suspicious or user-writable directory
    query: |
      LET ProcList <= SELECT Pid, Ppid, Name, Exe, CommandLine, Username, CreateTime
      FROM pslist()
      WHERE Exe =~ SuspiciousPathRegex

      SELECT Pid, Ppid, Name, Exe, CommandLine, Username, CreateTime
      FROM ProcList

  - name: PATHAnalysis
    description: Analyze PATH entries for user-writable directories that precede System32 or are suspicious
    query: |
      LET SystemPath <= environ(var="PATH")

      LET PathEntries <= SELECT Line AS PathEntry,
        enumerate() AS EntryIndex
      FROM split_records(
        filenames=SystemPath,
        accessor="data",
        regex=";",
        columns=["Line"])
      WHERE Line != ""

      LET System32Index <= SELECT min(item=EntryIndex) AS Idx
      FROM PathEntries
      WHERE PathEntry =~ "(?i)system32"

      SELECT PathEntry, EntryIndex,
        if(condition=EntryIndex < System32Index.Idx,
          then="PRECEDES System32",
          else="After System32") AS PositionRisk,
        if(condition=PathEntry =~ SuspiciousPathRegex,
          then="SUSPICIOUS LOCATION",
          else="OK") AS LocationRisk
      FROM PathEntries

  - name: DLLsInWritablePATHDirs
    description: DLLs found in non-system PATH directories that could be hijack candidates
    query: |
      LET SystemPath <= environ(var="PATH")

      LET PathEntries <= SELECT Line AS PathEntry
      FROM split_records(
        filenames=SystemPath,
        accessor="data",
        regex=";",
        columns=["Line"])
      WHERE Line != ""
        AND NOT Line =~ LegitDirRegex

      LET DLLsFound <= SELECT OSPath, Size, Mtime, basename(path=OSPath) AS DllName
      FROM foreach(row=PathEntries, query={
        SELECT OSPath, Size, Mtime, basename(path=OSPath) AS DllName
        FROM glob(globs=PathEntry + "/*.dll")
      })
      WHERE DllName =~ KnownHijackDlls OR DllName =~ "\\.dll$"

      LET HashedDLLs <= SELECT OSPath, Size, Mtime, DllName,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM DLLsFound

      SELECT OSPath, Size, Mtime, DllName,
        Hashes.MD5 AS MD5, Hashes.SHA256 AS SHA256
      FROM HashedDLLs

column_types:
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: CreateTime
    type: timestamp
  - name: OSPath
    type: path
  - name: Exe
    type: path
  - name: MD5
    type: string
  - name: SHA256
    type: string