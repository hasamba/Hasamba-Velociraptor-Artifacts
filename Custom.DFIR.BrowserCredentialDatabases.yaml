name: Custom.DFIR.BrowserCredentialDatabases
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for browser credential database (SQLite) files used by Chrome, Edge, and Firefox.
  Detects "Login Data" and credential SQLite DBs that may have been accessed or modified,
  enabling investigation of credential theft per MITRE ATT&CK T1555.003.

reference:
  - https://attack.mitre.org/techniques/T1555.003/

type: CLIENT

parameters:
  - name: ChromeLoginGlob
    type: glob
    default: "C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Login Data"
  - name: EdgeLoginGlob
    type: glob
    default: "C:/Users/*/AppData/Local/Microsoft/Edge/User Data/*/Login Data"
  - name: FirefoxProfileGlob
    type: glob
    default: "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/logins.json"
  - name: FirefoxKeyGlob
    type: glob
    default: "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/key4.db"
  - name: ChromeLocalState
    type: glob
    default: "C:/Users/*/AppData/Local/Google/Chrome/User Data/Local State"
  - name: EdgeLocalState
    type: glob
    default: "C:/Users/*/AppData/Local/Microsoft/Edge/User Data/Local State"
  - name: FilterRegex
    type: regex
    default: "."
  - name: UploadFiles
    type: bool
    default: "N"

sources:
  - name: ChromeCredentials
    description: Chrome browser Login Data SQLite databases
    query: |
      LET Files <= SELECT OSPath, Size, Mtime FROM glob(globs=ChromeLoginGlob)
      SELECT
        OSPath,
        Size,
        Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes,
        "Chrome" AS Browser,
        "Login Data" AS DBType
      FROM Files
      WHERE OSPath =~ FilterRegex

  - name: EdgeCredentials
    description: Edge browser Login Data SQLite databases
    query: |
      LET Files <= SELECT OSPath, Size, Mtime FROM glob(globs=EdgeLoginGlob)
      SELECT
        OSPath,
        Size,
        Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes,
        "Edge" AS Browser,
        "Login Data" AS DBType
      FROM Files
      WHERE OSPath =~ FilterRegex

  - name: FirefoxCredentials
    description: Firefox logins.json and key4.db credential files
    query: |
      LET Logins <= SELECT OSPath, Size, Mtime FROM glob(globs=FirefoxProfileGlob)
      LET Keys <= SELECT OSPath, Size, Mtime FROM glob(globs=FirefoxKeyGlob)
      LET AllFiles <= SELECT * FROM chain(
        a={ SELECT OSPath, Size, Mtime, "logins.json" AS DBType FROM Logins },
        b={ SELECT OSPath, Size, Mtime, "key4.db" AS DBType FROM Keys }
      )
      SELECT
        OSPath,
        Size,
        Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes,
        "Firefox" AS Browser,
        DBType
      FROM AllFiles
      WHERE OSPath =~ FilterRegex

  - name: EncryptionKeys
    description: Chrome and Edge Local State files containing encryption keys
    query: |
      LET ChromeLocal <= SELECT OSPath, Size, Mtime FROM glob(globs=ChromeLocalState)
      LET EdgeLocal <= SELECT OSPath, Size, Mtime FROM glob(globs=EdgeLocalState)
      LET AllLocal <= SELECT * FROM chain(
        a={ SELECT OSPath, Size, Mtime, "Chrome" AS Browser FROM ChromeLocal },
        b={ SELECT OSPath, Size, Mtime, "Edge" AS Browser FROM EdgeLocal }
      )
      SELECT
        OSPath,
        Size,
        Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes,
        Browser,
        "Local State" AS DBType
      FROM AllLocal
      WHERE OSPath =~ FilterRegex

  - name: AllCredentialDatabases
    description: Combined view of all browser credential databases with optional upload
    query: |
      LET ChromeLogin <= SELECT OSPath, Size, Mtime, hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes, "Chrome" AS Browser, "Login Data" AS DBType FROM glob(globs=ChromeLoginGlob)
      LET EdgeLogin <= SELECT OSPath, Size, Mtime, hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes, "Edge" AS Browser, "Login Data" AS DBType FROM glob(globs=EdgeLoginGlob)
      LET FirefoxLogin <= SELECT OSPath, Size, Mtime, hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes, "Firefox" AS Browser, "logins.json" AS DBType FROM glob(globs=FirefoxProfileGlob)
      LET FirefoxKey <= SELECT OSPath, Size, Mtime, hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes, "Firefox" AS Browser, "key4.db" AS DBType FROM glob(globs=FirefoxKeyGlob)
      LET ChromeLS <= SELECT OSPath, Size, Mtime, hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes, "Chrome" AS Browser, "Local State" AS DBType FROM glob(globs=ChromeLocalState)
      LET EdgeLS <= SELECT OSPath, Size, Mtime, hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes, "Edge" AS Browser, "Local State" AS DBType FROM glob(globs=EdgeLocalState)
      LET AllResults <= SELECT * FROM chain(
        a={ SELECT * FROM ChromeLogin },
        b={ SELECT * FROM EdgeLogin },
        c={ SELECT * FROM FirefoxLogin },
        d={ SELECT * FROM FirefoxKey },
        e={ SELECT * FROM ChromeLS },
        f={ SELECT * FROM EdgeLS }
      )
      SELECT * FROM if(condition=UploadFiles,
        then={
          SELECT OSPath, Size, Mtime, Hashes, Browser, DBType, upload(file=OSPath) AS Upload
          FROM AllResults
          WHERE OSPath =~ FilterRegex
        },
        else={
          SELECT OSPath, Size, Mtime, Hashes, Browser, DBType
          FROM AllResults
          WHERE OSPath =~ FilterRegex
        })

column_types:
  - name: Mtime
    type: timestamp
  - name: OSPath
    type: path