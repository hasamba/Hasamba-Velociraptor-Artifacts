name: Custom.DFIR.BrowserCredentialDatabases
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for browser credential databases (Chrome/Edge/Firefox SQLite) access on Windows endpoints.
  
  This artifact locates credential and login databases stored by Chromium-based browsers
  (Chrome, Edge, Brave) and Firefox, then checks for recent access times and file metadata
  to identify potential credential harvesting activity. It targets MITRE ATT&CK T1555.003
  (Credentials from Password Stores: Credentials from Web Browsers).

reference:
  - https://attack.mitre.org/techniques/T1555.003/

type: CLIENT

parameters:
  - name: UserGlob
    type: glob
    default: "C:/Users/*"
    description: Glob for user profile directories to scan.
  - name: UploadDatabases
    type: bool
    default: false
    description: If true, upload discovered credential databases to the server.
  - name: MaxUploadSize
    type: int64
    default: 10485760
    description: Maximum file size in bytes to upload (default 10MB).
  - name: FilterRegex
    type: regex
    default: "."
    description: Regex filter for matching OSPath results.

sources:
  - name: ChromiumCredentialDBs
    description: Locate Chrome/Edge/Brave Login Data and Web Data SQLite databases.
    query: |
      LET ChromiumProfiles <= SELECT OSPath FROM glob(globs=UserGlob + "/AppData/Local/*/User Data/*")
      
      LET ChromiumDBs <= SELECT
          OSPath,
          "Chromium" AS BrowserFamily,
          if(condition=(OSPath =~ "Google"), then="Chrome", else=
            if(condition=(OSPath =~ "Edge"), then="Edge", else=
              if(condition=(OSPath =~ "Brave"), then="Brave", else="Chromium"))) AS Browser,
          if(condition=(OSPath =~ "Login Data"), then="Login Data", else=
            if(condition=(OSPath =~ "Web Data"), then="Web Data", else=
              if(condition=(OSPath =~ "Cookies"), then="Cookies", else=
                if(condition=(OSPath =~ "Local State"), then="Local State", else="Other")))) AS FileType,
          Size,
          Mtime,
          Atime
      FROM foreach(
          row=ChromiumProfiles,
          query={
              SELECT OSPath, Size, Mtime, Atime
              FROM glob(globs=[
                  OSPath + "/Login Data",
                  OSPath + "/Web Data",
                  OSPath + "/Cookies",
                  OSPath + "/Local State"
              ])
          })
      
      SELECT
          OSPath,
          BrowserFamily,
          Browser,
          FileType,
          Size,
          Mtime,
          Atime,
          hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes,
          if(condition=UploadDatabases AND Size < MaxUploadSize,
             then=upload(file=OSPath),
             else=null) AS Upload
      FROM ChromiumDBs
      WHERE OSPath =~ FilterRegex

  - name: FirefoxCredentialDBs
    description: Locate Firefox key4.db, logins.json, and cert9.db credential files.
    query: |
      LET FirefoxProfiles <= SELECT OSPath FROM glob(globs=UserGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*")
      
      LET FirefoxCreds <= SELECT
          OSPath,
          "Firefox" AS BrowserFamily,
          "Firefox" AS Browser,
          if(condition=(OSPath =~ "key4.db"), then="key4.db", else=
            if(condition=(OSPath =~ "logins.json"), then="logins.json", else=
              if(condition=(OSPath =~ "cert9.db"), then="cert9.db", else=
                if(condition=(OSPath =~ "cookies.sqlite"), then="cookies.sqlite", else=
                  if(condition=(OSPath =~ "places.sqlite"), then="places.sqlite", else="Other"))))) AS FileType,
          Size,
          Mtime,
          Atime
      FROM foreach(
          row=FirefoxProfiles,
          query={
              SELECT OSPath, Size, Mtime, Atime
              FROM glob(globs=[
                  OSPath + "/key4.db",
                  OSPath + "/logins.json",
                  OSPath + "/cert9.db",
                  OSPath + "/cookies.sqlite",
                  OSPath + "/places.sqlite"
              ])
          })
      
      SELECT
          OSPath,
          BrowserFamily,
          Browser,
          FileType,
          Size,
          Mtime,
          Atime,
          hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes,
          if(condition=UploadDatabases AND Size < MaxUploadSize,
             then=upload(file=OSPath),
             else=null) AS Upload
      FROM FirefoxCreds
      WHERE OSPath =~ FilterRegex

  - name: BrowserProcessAccess
    description: Check for suspicious processes that may be accessing browser credential databases.
    query: |
      LET ProcList <= SELECT Pid, Ppid, Name, Exe, CommandLine, Username FROM pslist()
      
      SELECT
          Pid,
          Ppid,
          Name,
          Exe,
          CommandLine,
          Username
      FROM ProcList
      WHERE
          Name =~ "(?i)(mimikatz|procdump|seatbelt|sharpweb|chromepass|browserpassword|laZagne|hackbrowser|webbrowserpassview)"
          OR CommandLine =~ "(?i)(Login Data|key4.db|logins.json|Web Data|Cookies|Local State)"

column_types:
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Hashes
    type: hash