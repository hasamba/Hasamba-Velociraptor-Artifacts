name: Custom.DFIR.BrowserCredentialDBHunter
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for browser credential database files (Chrome, Edge, Firefox) on Windows endpoints.
  Identifies SQLite databases that store saved passwords, autofill data, and login credentials,
  detecting potential credential access per MITRE ATT&CK T1555.003.

reference:
  - https://attack.mitre.org/techniques/T1555.003/

type: CLIENT

parameters:
  - name: ChromeLoginGlob
    type: glob
    default: "C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Login Data"
  - name: ChromeLoginJournalGlob
    type: glob
    default: "C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Login Data-journal"
  - name: EdgeLoginGlob
    type: glob
    default: "C:/Users/*/AppData/Local/Microsoft/Edge/User Data/*/Login Data"
  - name: EdgeLoginJournalGlob
    type: glob
    default: "C:/Users/*/AppData/Local/Microsoft/Edge/User Data/*/Login Data-journal"
  - name: FirefoxProfileGlob
    type: glob
    default: "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/logins.json"
  - name: FirefoxKey4Glob
    type: glob
    default: "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/key4.db"
  - name: ChromeCookiesGlob
    type: glob
    default: "C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Cookies"
  - name: EdgeCookiesGlob
    type: glob
    default: "C:/Users/*/AppData/Local/Microsoft/Edge/User Data/*/Cookies"
  - name: FilterRegex
    type: regex
    default: "."
  - name: UploadFiles
    type: bool
    default: false

sources:
  - name: ChromeLogins
    description: Hunt Chrome Login Data SQLite databases including journals
    query: |
      LET MainFiles <= SELECT OSPath, Size, Mtime,
        "Chrome" AS Browser, "Login Data" AS DBType
        FROM glob(globs=ChromeLoginGlob)
        WHERE OSPath =~ FilterRegex
      LET JournalFiles <= SELECT OSPath, Size, Mtime,
        "Chrome" AS Browser, "Login Data-journal" AS DBType
        FROM glob(globs=ChromeLoginJournalGlob)
        WHERE OSPath =~ FilterRegex
      SELECT OSPath, Size, Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hash,
        Browser, DBType,
        if(condition=UploadFiles, then=upload(file=OSPath), else=null) AS Upload
      FROM chain(
        query={SELECT * FROM MainFiles},
        query={SELECT * FROM JournalFiles}
      )
      ORDER BY Mtime DESC

  - name: EdgeLogins
    description: Hunt Edge Login Data SQLite databases including journals
    query: |
      LET MainFiles <= SELECT OSPath, Size, Mtime,
        "Edge" AS Browser, "Login Data" AS DBType
        FROM glob(globs=EdgeLoginGlob)
        WHERE OSPath =~ FilterRegex
      LET JournalFiles <= SELECT OSPath, Size, Mtime,
        "Edge" AS Browser, "Login Data-journal" AS DBType
        FROM glob(globs=EdgeLoginJournalGlob)
        WHERE OSPath =~ FilterRegex
      SELECT OSPath, Size, Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hash,
        Browser, DBType,
        if(condition=UploadFiles, then=upload(file=OSPath), else=null) AS Upload
      FROM chain(
        query={SELECT * FROM MainFiles},
        query={SELECT * FROM JournalFiles}
      )
      ORDER BY Mtime DESC

  - name: FirefoxLogins
    description: Hunt Firefox logins.json and key4.db credential files
    query: |
      LET ProfileFiles <= SELECT OSPath, Size, Mtime,
        "Firefox" AS Browser, "logins.json" AS DBType
        FROM glob(globs=FirefoxProfileGlob)
        WHERE OSPath =~ FilterRegex
      LET KeyFiles <= SELECT OSPath, Size, Mtime,
        "Firefox" AS Browser, "key4.db" AS DBType
        FROM glob(globs=FirefoxKey4Glob)
        WHERE OSPath =~ FilterRegex
      SELECT OSPath, Size, Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hash,
        Browser, DBType,
        if(condition=UploadFiles, then=upload(file=OSPath), else=null) AS Upload
      FROM chain(
        query={SELECT * FROM ProfileFiles},
        query={SELECT * FROM KeyFiles}
      )
      ORDER BY Mtime DESC

  - name: BrowserCookies
    description: Hunt Chrome and Edge Cookies SQLite databases
    query: |
      LET ChromeCookies <= SELECT OSPath, Size, Mtime,
        "Chrome" AS Browser, "Cookies" AS DBType
        FROM glob(globs=ChromeCookiesGlob)
        WHERE OSPath =~ FilterRegex
      LET EdgeCookies <= SELECT OSPath, Size, Mtime,
        "Edge" AS Browser, "Cookies" AS DBType
        FROM glob(globs=EdgeCookiesGlob)
        WHERE OSPath =~ FilterRegex
      SELECT OSPath, Size, Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hash,
        Browser, DBType,
        if(condition=UploadFiles, then=upload(file=OSPath), else=null) AS Upload
      FROM chain(
        query={SELECT * FROM ChromeCookies},
        query={SELECT * FROM EdgeCookies}
      )
      ORDER BY Mtime DESC

column_types:
  - name: Mtime
    type: timestamp
  - name: OSPath
    type: path
  - name: Hash.MD5
    type: hash
  - name: Hash.SHA256
    type: hash