name: Custom.DFIR.CloudMetadataAccessDetection
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects access to cloud instance metadata services (IMDS) from
  suspicious processes (MITRE ATT&CK T1552.005 - Unsecured Credentials:
  Cloud Instance Metadata API).

  Attackers abuse SSRF or code execution on cloud VMs to query the
  link-local metadata service and steal instance role credentials,
  tokens and user data before pivoting to the cloud control plane.

  Detection layers:
   - LiveMetadataConnections (cross-platform): live netstat entries whose
     remote address is a metadata endpoint, enriched with the owning
     process (Name, Exe, CommandLine, Ppid, Username).
   - SuspiciousProcesses (cross-platform): running processes whose command
     line or executable references a metadata endpoint; flagged when the
     binary is a known fetch/script tool and enriched with live metadata
     connections owned by the same PID.
   - HistoryReferences (cross-platform): shell history lines (bash/zsh/sh
     and tmp histories on Unix, PSReadLine ConsoleHost_history on Windows)
     referencing metadata endpoints - historical proof of manual IMDS
     probing.

  Covered endpoints: 169.254.169.254 (AWS/GCP/Azure/OpenStack),
  metadata.* hostnames (metadata.google.internal, metadata.azure.com),
  Alibaba 100.100.100.200 and AWS IMDS IPv6 fd00:ec2::254.

  Note: process, connection and history sources run on any platform.
  History globs silently return no rows where the paths do not apply.

reference:
  - https://attack.mitre.org/techniques/T1552.005/
  - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-categories.html

type: CLIENT

parameters:
  - name: MetadataEndpointRegex
    type: regex
    description: Regex matching cloud metadata endpoints (IPs and hostnames), applied to connection addresses, process command lines and history lines.
    default: "169\\.254\\.169\\.254|metadata\\.|instance-data|100\\.100\\.100\\.200|fd00:ec2::254"

  - name: SuspiciousToolRegex
    type: regex
    description: Known fetch/script tool names flagged when the owning process touches the metadata API.
    default: "(?i)(curl|wget|nc|ncat|netcat|socat|python|perl|ruby|node|powershell|pwsh|cmd|bash|zsh|sh|dash|ksh|certutil|bitsadmin|mshta|rundll32|wscript|cscript)"

sources:
  - name: LiveMetadataConnections
    description: Live connections whose remote address is a cloud metadata endpoint, enriched with the owning process.
    query: |
      SELECT Pid, Status,
             Laddr.IP AS LocalAddress, Laddr.Port AS LocalPort,
             Raddr.IP AS RemoteAddress, Raddr.Port AS RemotePort,
             { SELECT Name, Exe, CommandLine, Ppid, Username FROM pslist(pid=Pid) LIMIT 1 } AS ProcessInfo
      FROM netstat()
      WHERE Raddr.IP =~ MetadataEndpointRegex

  - name: SuspiciousProcesses
    description: Running processes referencing metadata endpoints in their command line or executable path.
    query: |
      LET ProcHits <= SELECT Pid AS HitPid, Ppid AS PPid, Name, Exe, CommandLine, Username, CreateTime, Name =~ SuspiciousToolRegex AS SuspiciousTool FROM pslist() WHERE CommandLine =~ MetadataEndpointRegex OR Exe =~ MetadataEndpointRegex
      LET LiveConns <= SELECT Pid AS ConnPid, Status, Laddr.IP AS LocalAddress, Laddr.Port AS LocalPort, Raddr.IP AS RemoteAddress, Raddr.Port AS RemotePort FROM netstat() WHERE Raddr.IP =~ MetadataEndpointRegex
      SELECT HitPid AS Pid, PPid, Name, Exe, CommandLine, Username, CreateTime, SuspiciousTool,
             { SELECT Status, LocalAddress, LocalPort, RemoteAddress, RemotePort
               FROM LiveConns WHERE ConnPid = HitPid } AS MetadataConnections
      FROM ProcHits

  - name: HistoryReferences
    description: Shell history lines referencing cloud metadata endpoints (bash/zsh/sh history and PSReadLine ConsoleHost_history).
    query: |
      LET HistFiles <= SELECT OSPath, Size, Mtime AS Modified FROM glob(globs=["C:/Users/*/AppData/Roaming/Microsoft/Windows/PowerShell/PSReadLine/ConsoleHost_history.txt", "/root/.[a-z]*_history", "/home/*/.[a-z]*_history", "/Users/*/.[a-z]*_history", "/tmp/.[a-z]*_history"]) WHERE NOT IsDir AND Size < 10000000
      SELECT OSPath, Modified, Size, Line, Line =~ SuspiciousToolRegex AS UsedSuspiciousTool
      FROM foreach(row=HistFiles, query={
        SELECT OSPath, Line
        FROM split_records(filenames=OSPath, regex="\n", columns=["Line"])
        WHERE Line =~ MetadataEndpointRegex
      })

column_types:
  - name: CreateTime
    type: timestamp
  - name: Modified
    type: timestamp
  - name: OSPath
    type: os_path
  - name: Exe
    type: os_path