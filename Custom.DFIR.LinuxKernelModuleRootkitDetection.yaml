name: Custom.DFIR.LinuxKernelModuleRootkitDetection
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects kernel module (rootkit) loading artifacts on Linux endpoints (MITRE T1014).

  Enumerates the loaded module list from /proc/modules, cross-references each module
  against on-disk module files under /lib/modules, and surfaces suspicious indicators:
  modules with no on-disk file (loaded from memory / hidden source), recently modified
  or newly created module files, names matching common rootkit patterns, and metadata
  from /sys/module (taint, refcount). Rootkits typically install via insmod/modprobe
  with disguised names or live outside the standard modules tree.

reference:
  - https://attack.mitre.org/techniques/T1014/

type: CLIENT

parameters:
  - name: SuspiciousNameRegex
    type: regex
    default: "(?i)(rootkit|hidden|stealth|rk_|diamorphine|knark|adore|suckit|reptile|enigma|syslogd)"
  - name: ModulesDirGlob
    type: glob
    default: "/lib/modules/**/*.ko*"
  - name: ProcModulesPath
    type: string
    default: "/proc/modules"

sources:
  - name: LoadedModules
    description: Loaded kernel module list parsed from /proc/modules with a suspicious-name filter
    query: |
      LET Rows = SELECT
        split(string=Line, sep=" ")[0] AS ModuleName,
        atoi(string=split(string=Line, sep=" ")[1]) AS SizeBytes,
        atoi(string=split(string=Line, sep=" ")[2]) AS Instances,
        split(string=Line, sep=" ")[3] AS UsedBy,
        split(string=Line, sep=" ")[4] AS State,
        Line AS RawLine
      FROM parse_lines(filename=ProcModulesPath)
      SELECT ModuleName, SizeBytes, Instances, UsedBy, State, RawLine
      FROM Rows
      WHERE ModuleName =~ SuspiciousNameRegex
  - name: ModuleFilesOnDisk
    description: On-disk module files under /lib/modules with size, SHA256 and modification time
    query: |
      SELECT
        OSPath AS Path,
        Size,
        Mtime,
        hash(path=OSPath, hashselect="SHA256").SHA256 AS SHA256
      FROM glob(globs=ModulesDirGlob)

column_types:
  - name: Path
    type: path
  - name: Mtime
    type: timestamp