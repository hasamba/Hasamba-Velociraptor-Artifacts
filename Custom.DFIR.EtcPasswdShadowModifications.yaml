name: Custom.DFIR.EtcPasswdShadowModifications
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts for suspicious modifications to /etc/passwd and /etc/shadow on Linux endpoints.
  
  Detects recent changes, checks for unauthorized accounts, anomalous UIDs (0 or high-range),
  empty password fields, and collects file metadata and hashes for integrity verification.

reference:
  - https://attack.mitre.org/techniques/T1136.001/

type: CLIENT

parameters:
  - name: PasswdGlob
    type: glob
    default: "/etc/passwd"
  - name: ShadowGlob
    type: glob
    default: "/etc/shadow"
  - name: DaysThreshold
    type: int
    default: 7
    description: Number of days to look back for recent modifications.
  - name: SuspiciousUIDRegex
    type: regex
    default: "^(0|1000[0-9]+)$"
    description: Regex matching UIDs considered suspicious (root-level or unusually high).
  - name: FilterRegex
    type: regex
    default: "."
    description: Regex to filter results for specific patterns.

sources:
  - name: FileMetadata
    description: Collects file metadata and hashes for /etc/passwd and /etc/shadow.
    query: |
      LET TargetFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime 
        FROM glob(globs=[PasswdGlob, ShadowGlob])
      
      LET ThresholdEpoch <= now() - DaysThreshold * 86400
      
      LET FileDetails <= SELECT OSPath, Size, Mtime, Atime, Ctime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS FileHash,
        Mtime > ThresholdEpoch AS RecentlyModified
        FROM TargetFiles
        WHERE log(message="Checking " + OSPath, dedup=120)
      
      SELECT OSPath, Size, Mtime, Atime, Ctime,
        FileHash.MD5 AS MD5, FileHash.SHA256 AS SHA256,
        RecentlyModified
        FROM FileDetails
        WHERE OSPath =~ FilterRegex

  - name: PasswdAnalysis
    description: Parses /etc/passwd for suspicious accounts, UIDs, and shells.
    query: |
      LET ThresholdEpoch <= now() - DaysThreshold * 86400
      
      LET PasswdFile <= SELECT OSPath, Mtime FROM glob(globs=PasswdGlob)
      
      LET PasswdLines <= SELECT Line, OSPath, Mtime 
        FROM foreach(
          row=PasswdFile,
          query={ SELECT Line, OSPath, Mtime 
            FROM split_records(filenames=OSPath, regex="\n", columns=["Line"]) 
            WHERE Line =~ "." })
      
      LET ParsedPasswd <= SELECT 
        OSPath, Mtime,
        parse_string_with_regex(
          string=Line, 
          regex="^(?P<Username>[^:]+):(?P<Password>x|\\*|!|\\$[^:]*):(?P<UID>[0-9]+):(?P<GID>[0-9]+):(?P<GECOS>[^:]*):(?P<Home>[^:]*):(?P<Shell>[^:]*)$"
        ) AS Parsed,
        Line AS RawLine
        FROM PasswdLines
        WHERE Parsed
      
      LET EnrichedPasswd <= SELECT 
        OSPath, Mtime,
        Parsed.Username AS Username,
        Parsed.Password AS PasswordField,
        Parsed.UID AS UID,
        Parsed.GID AS GID,
        Parsed.GECOS AS GECOS,
        Parsed.Home AS HomeDir,
        Parsed.Shell AS Shell,
        RawLine,
        Mtime > ThresholdEpoch AS RecentlyModified,
        Parsed.UID =~ SuspiciousUIDRegex AS SuspiciousUID,
        Parsed.Shell =~ "(nologin|false)$" AS NoLoginShell,
        Parsed.Home = "" AS EmptyHome
        FROM ParsedPasswd
      
      SELECT 
        OSPath, Mtime, Username, PasswordField, UID, GID, GECOS, HomeDir, Shell,
        RecentlyModified, SuspiciousUID, NoLoginShell, EmptyHome, RawLine
        FROM EnrichedPasswd
        WHERE (SuspiciousUID OR NOT NoLoginShell OR RecentlyModified OR EmptyHome)
          AND Username =~ FilterRegex

  - name: ShadowAnalysis
    description: Parses /etc/shadow for weak, empty, or recently changed password entries.
    query: |
      LET ThresholdEpoch <= now() - DaysThreshold * 86400
      
      LET ShadowFile <= SELECT OSPath, Mtime FROM glob(globs=ShadowGlob)
      
      LET ShadowLines <= SELECT Line, OSPath, Mtime 
        FROM foreach(
          row=ShadowFile,
          query={ SELECT Line, OSPath, Mtime 
            FROM split_records(filenames=OSPath, regex="\n", columns=["Line"]) 
            WHERE Line =~ "." })
      
      LET ParsedShadow <= SELECT 
        OSPath, Mtime,
        parse_string_with_regex(
          string=Line,
          regex="^(?P<Username>[^:]+):(?P<Hash>[^:]*):(?P<LastChanged>[0-9]*):(?P<MinAge>[^:]*):(?P<MaxAge>[^:]*):(?P<Warn>[^:]*):(?P<Inactive>[^:]*):(?P<Expire>[^:]*):(?P<Reserved>[^:]*)$"
        ) AS Parsed,
        Line AS RawLine
        FROM ShadowLines
        WHERE Parsed
      
      LET EnrichedShadow <= SELECT 
        OSPath, Mtime,
        Parsed.Username AS Username,
        Parsed.Hash AS PasswordHash,
        Parsed.LastChanged AS LastChangedDays,
        Mtime > ThresholdEpoch AS RecentlyModified,
        Parsed.Hash = "" OR Parsed.Hash = "!" OR Parsed.Hash = "*" AS NoPassword,
        Parsed.Hash =~ "^\\$" AS HasProperHash
        FROM ParsedShadow
      
      SELECT 
        OSPath, Mtime, Username, PasswordHash, LastChangedDays,
        RecentlyModified, NoPassword, HasProperHash, RawLine
        FROM EnrichedShadow
        WHERE (RecentlyModified OR NoPassword OR NOT HasProperHash)
          AND Username =~ FilterRegex

column_types:
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp