name: Custom.DFIR.DetectTorOrC2NetworkConnections
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect processes with active or recent network connections to TOR exit nodes or known C2 IP addresses.
  
  This artifact correlates live network connections with process metadata, then filters remote IPs using user-provided regex patterns for TOR exit nodes and known C2 infrastructure. It is intended for rapid triage on systems where suspicious outbound proxying or command and control activity is suspected.
reference:
  - https://attack.mitre.org/techniques/T1090.003/

type: CLIENT

parameters:
  - name: TorExitNodeRegex
    type: regex
    default: "^$"
  - name: C2IPRegex
    type: regex
    default: "^$"
  - name: ProcessRegex
    type: regex
    default: "."
  - name: CommandLineRegex
    type: regex
    default: "."
  - name: StateRegex
    type: regex
    default: "."
  - name: CalculateHashes
    type: bool
    default: false
  - name: UploadBinary
    type: bool
    default: false

sources:
  - name: MatchedConnections
    description: Correlate network connections to processes and filter on TOR or C2 regex matches.
    query: |
      LET NetConns <=
        SELECT
          Pid AS ConnPid,
          Status,
          Laddr.IP AS LocalIP,
          Laddr.Port AS LocalPort,
          Raddr.IP AS RemoteIP,
          Raddr.Port AS RemotePort
        FROM netstat()

      LET Procs <=
        SELECT
          Pid,
          Ppid,
          Name,
          Exe,
          CommandLine,
          Username,
          CreateTime
        FROM pslist()

      LET Correlated <=
        SELECT *
        FROM foreach(
          row=NetConns,
          query={
            SELECT
              ConnPid AS Pid,
              Ppid,
              Name,
              Exe,
              CommandLine,
              Username,
              CreateTime,
              Status,
              LocalIP,
              LocalPort,
              RemoteIP,
              RemotePort
            FROM Procs
            WHERE Pid = ConnPid
          })

      LET Hits <=
        SELECT
          Pid,
          Ppid,
          Name,
          Exe,
          CommandLine,
          Username,
          CreateTime,
          Status,
          LocalIP,
          LocalPort,
          RemoteIP,
          RemotePort,
          if(condition=RemoteIP =~ TorExitNodeRegex, then="TOR Exit Node", else="Known C2 / Other Match") AS MatchType,
          if(condition=CalculateHashes, then=hash(path=Exe, hashselect="SHA256").SHA256, else="") AS SHA256
        FROM Correlated
        WHERE RemoteIP
          AND Name =~ ProcessRegex
          AND CommandLine =~ CommandLineRegex
          AND Status =~ StateRegex
          AND (
            RemoteIP =~ TorExitNodeRegex
            OR RemoteIP =~ C2IPRegex
          )

      SELECT
        Pid,
        Ppid,
        Name,
        Exe,
        CommandLine,
        Username,
        CreateTime,
        Status,
        LocalIP,
        LocalPort,
        RemoteIP,
        RemotePort,
        MatchType,
        SHA256,
        if(condition=UploadBinary AND Exe, then=upload(file=Exe), else="") AS Upload
      FROM Hits

column_types:
  - name: CreateTime
    type: timestamp
  - name: Exe
    type: path
  - name: SHA256
    type: hash
