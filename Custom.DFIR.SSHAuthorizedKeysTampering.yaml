name: Custom.DFIR.SSHAuthorizedKeysTampering
description: |
  Detect SSH authorized_keys tampering across all user home directories.

  Enumerates authorized_keys and authorized_keys2 files under /root, /home/*,
  and /etc/ssh (system-wide AuthorizedKeysFile locations). Reports file
  metadata (size, mtime), ownership, SHA256 hash, and key entries with
  suspicious characteristics: no command restriction (potentially
  unrestricted account persistence via SSH keys), no key type prefix,
  options that weaken restrictions, recently modified files, or world-
  writable files (tampering by non-owner is a strong persistence indicator).

  MITRE ATT&CK: T1098.004 - Account Manipulation: SSH Authorized Keys

author: Yaniv Radunsky @ tenroot & Hohit (AI)

reference:
  - https://attack.mitre.org/techniques/T1098.004/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: |
      ["/root/.ssh/authorized_keys*","/home/*/.ssh/authorized_keys*","/etc/ssh/*authorized_keys*","/etc/*authorized_keys*"]
  - name: FilterRegex
    type: regex
    default: "."
  - name: SuspiciousKeyRegex
    type: regex
    default: "^(ssh-rsa|ssh-ed25519|ecdsa-sha2-\\S+)"
  - name: RestrictionOptionRegex
    type: regex
    default: "command=|restrict|from=|no-|permitopen"
  - name: RecentDays
    type: int
    default: 30

sources:
  - name: SuspectKeys
    description: Key entries and file-level indicators of tampering
    query: |
      LET Files <= SELECT OSPath, Size, Mtime, Data.Mode AS Mode,
            Data.Uid AS Uid, Data.Gid AS Gid
        FROM glob(globs=TargetGlob, accessor="file")
        WHERE NOT IsDir AND OSPath =~ FilterRegex

      SELECT
        OSPath AS Path,
        Size,
        Mtime,
        Mode,
        Uid,
        Gid,
        hash(path=OSPath, hashselect="SHA256").SHA256 AS SHA256,
        parse_string_with_regex(
          string=read_file(filename=OSPath, length=1048576),
          regex=[
            "^(?P<Options>[^#\\s][^\\n]*?)\\s+(?P<KeyType>ssh-[a-z0-9-]+|ecdsa-sha2-[a-z0-9-]+)\\s+(?P<KeyData>[A-Za-z0-9+/=]+)",
            "^(?P<KeyType2>ssh-[a-z0-9-]+|ecdsa-sha2-[a-z0-9-]+)\\s+(?P<KeyData2>[A-Za-z0-9+/=]+)"
          ]) AS KeyMatches,
        read_file(filename=OSPath, length=1048576) AS FileContent
      FROM Files
      WHERE
        -- recently modified
        Mtime > timestamp(epoch=now()) - RecentDays * 86400000000
        -- or key without restriction options (unrestricted persistence access)
        OR FileContent =~ SuspiciousKeyRegex
      ORDER BY Mtime DESC

  - name: AllFiles
    description: Inventory of all authorized_keys files found
    query: |
      SELECT
        OSPath AS Path,
        Size,
        Mtime,
        Data.Mode AS Mode,
        Data.Uid AS Uid,
        Data.Gid AS Gid,
        hash(path=OSPath, hashselect="SHA256").SHA256 AS SHA256
      FROM glob(globs=TargetGlob, accessor="file")
      WHERE NOT IsDir AND OSPath =~ FilterRegex

column_types:
  - name: Path
    type: paths
  - name: Mtime
    type: timestamp
  - name: SHA256
    type: hash
  - name: Mode
    type: string