name: Custom.DFIR.RDPLateralMovement
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects RDP lateral movement (MITRE ATT&CK T1021.001) from Windows Security
  event logs.

  Correlates three complementary signals from Security.evtx:
  1. Event ID 4624 - successful logons with LogonType 10 (RemoteInteractive),
     the primary RDP logon signal, enriched with client workstation, IP and port.
  2. Event ID 4648 - logons made with explicit credentials. When the credential
     differs from the logged-on user this is a strong indicator of credential
     reuse across RDP hops (mimikatz-style chaining or runas-style hops).
  3. Event ID 4778 - a session was reconnected to a window station, revealing
     which clients resumed RDP sessions on this host.

  All sources support a configurable lookback window plus user and source-IP
  regex filters for scoping to a specific investigation.

reference:
  - https://attack.mitre.org/techniques/T1021.001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4624
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4648
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4778

type: CLIENT

parameters:
  - name: SecurityEvtxGlob
    type: string
    description: Glob for the Windows Security event log file.
    default: "C:/Windows/System32/winevt/Logs/Security.evtx"

  - name: LogonTypeFilter
    type: string
    description: 4624 LogonType treated as RDP. 10 = RemoteInteractive.
    default: "10"

  - name: RDPUserRegex
    type: regex
    description: Regex applied to the DOMAIN\\user string of target and caller accounts.
    default: ".*"

  - name: SourceIPRegex
    type: regex
    description: Regex applied to the RDP client IP address.
    default: ".*"

  - name: EvtxAgeDays
    type: int
    description: Only report events newer than this many days.
    default: "7"

sources:
  - name: RDP4624Logons
    description: Successful 4624 logons with LogonType 10 (RemoteInteractive) - the primary RDP lateral movement signal.
    query: |
      LET Cutoff = timestamp(epoch=now() - EvtxAgeDays * 86400)
      LET Events = SELECT
             timestamp(epoch=EventTimeRaw) AS EventTime,
             EventID,
             EventData.TargetUserName AS TargetUserName,
             EventData.TargetDomainName AS TargetDomainName,
             EventData.LogonType AS LogonType,
             EventData.IpAddress AS IpAddress,
             EventData.IpPort AS IpPort,
             EventData.WorkstationName AS WorkstationName,
             EventData.AuthenticationPackageName AS AuthPackage,
             EventData.LogonID AS LogonID
          FROM foreach(
            row={ SELECT OSPath FROM glob(globs=SecurityEvtxGlob) },
            query={ SELECT System.TimeCreated.SystemTime AS EventTimeRaw,
                           System.EventID.Value AS EventID,
                           EventData
                    FROM parse_evtx(filename=OSPath)
                    WHERE System.EventID.Value = 4624 })
      SELECT EventTime,
             TargetDomainName + "\\" + TargetUserName AS TargetUser,
             LogonType,
             IpAddress AS SourceIP,
             IpPort AS SourcePort,
             WorkstationName,
             AuthPackage,
             LogonID
      FROM Events
      WHERE LogonType = LogonTypeFilter
        AND (TargetDomainName + "\\" + TargetUserName) =~ RDPUserRegex
        AND if(condition=IpAddress, then=IpAddress, else="") =~ SourceIPRegex
        AND EventTime > Cutoff

  - name: ExplicitCreds4648
    description: |
      4648 explicit credential logons - flags credential reuse used to hop
      between hosts during RDP lateral movement.
    query: |
      LET Cutoff = timestamp(epoch=now() - EvtxAgeDays * 86400)
      LET Events = SELECT
             timestamp(epoch=EventTimeRaw) AS EventTime,
             EventID,
             EventData.TargetUserName AS TargetUserName,
             EventData.TargetDomainName AS TargetDomainName,
             EventData.SubjectUserName AS SubjectUserName,
             EventData.SubjectDomainName AS SubjectDomainName,
             EventData.TargetInfo AS TargetInfo,
             EventData.IpAddress AS IpAddress,
             EventData.IpPort AS IpPort,
             EventData.ProcessName AS ProcessName
          FROM foreach(
            row={ SELECT OSPath FROM glob(globs=SecurityEvtxGlob) },
            query={ SELECT System.TimeCreated.SystemTime AS EventTimeRaw,
                           System.EventID.Value AS EventID,
                           EventData
                    FROM parse_evtx(filename=OSPath)
                    WHERE System.EventID.Value = 4648 })
      SELECT EventTime,
             SubjectDomainName + "\\" + SubjectUserName AS CallerUser,
             TargetDomainName + "\\" + TargetUserName AS TargetUser,
             TargetInfo AS TargetServer,
             IpAddress AS SourceIP,
             IpPort AS SourcePort,
             ProcessName
      FROM Events
      WHERE ((TargetDomainName + "\\" + TargetUserName) =~ RDPUserRegex
              OR (SubjectDomainName + "\\" + SubjectUserName) =~ RDPUserRegex)
        AND if(condition=IpAddress, then=IpAddress, else="") =~ SourceIPRegex
        AND EventTime > Cutoff

  - name: SessionReconnect4778
    description: |
      4778 window-station reconnects - shows which clients resumed RDP
      sessions, useful for mapping interactive lateral movement paths.
    query: |
      LET Cutoff = timestamp(epoch=now() - EvtxAgeDays * 86400)
      LET Events = SELECT
             timestamp(epoch=EventTimeRaw) AS EventTime,
             EventID,
             EventData.AccountName AS AccountName,
             EventData.AccountDomain AS AccountDomain,
             EventData.ClientName AS ClientName,
             EventData.ClientAddress AS ClientAddress,
             EventData.SessionName AS SessionName
          FROM foreach(
            row={ SELECT OSPath FROM glob(globs=SecurityEvtxGlob) },
            query={ SELECT System.TimeCreated.SystemTime AS EventTimeRaw,
                           System.EventID.Value AS EventID,
                           EventData
                    FROM parse_evtx(filename=OSPath)
                    WHERE System.EventID.Value = 4778 })
      SELECT EventTime,
             AccountDomain + "\\" + AccountName AS Account,
             ClientName AS ClientMachine,
             ClientAddress AS ClientIP,
             SessionName
      FROM Events
      WHERE (AccountDomain + "\\" + AccountName) =~ RDPUserRegex
        AND if(condition=ClientAddress, then=ClientAddress, else="") =~ SourceIPRegex
        AND EventTime > Cutoff

column_types:
  - name: EventTime
    type: timestamp