name: Custom.DFIR.BitsJobAbuseDetection
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects BITS (Background Intelligent Transfer Service) job abuse for
  persistence or arbitrary payload download (MITRE ATT&CK T1197).

  attackers abuse bitsadmin/COM APIs to create jobs that download
  malware, exfiltrate data, or execute arbitrary commands on job
  completion (NotifyCmdLine persistence). This artifact inspects:

  1. Microsoft-Windows-Bits-Operational event log for suspicious
     job creation and completion events, extracting the notification
     command line (persistence indicator) and remote URLs.
  2. BITS job state files under System32 config for jobs referencing
     suspicious executables or script interpreters (cmd.exe, powershell,
     rundll32, mshta, wscript, certutil, bitsadmin).
  3. Files created by BITS jobs are hashed for triage.

reference:
  - https://attack.mitre.org/techniques/T1197/

type: CLIENT

parameters:
  - name: SuspiciousProcessRegex
    type: regex
    default: "(?i)(cmd\\.exe|powershell|pwsh|rundll32|regsvr32|mshta|wscript|cscript|certutil|curl|wget|bitsadmin|vssadmin|schtasks|sc\\.exe)"
  - name: SuspiciousPathRegex
    type: regex
    default: "(?i)(appdata|temp|programdata|users/public|system32/spool|windows/tasks|downloads)"
  - name: EventTimeframeDays
    type: int
    default: "7"

sources:
  - name: BitsOperationalEvents
    description: >
      Parse Microsoft-Windows-Bits-Operational event log for job creation,
      error and completion events; flag jobs whose notification command line
      or remote name matches suspicious patterns.
    query: |
      LET Cutoff = timestamp(epoch=now()) - timestamp(epoch=EventTimeframeDays * 86400)
      LET EventFiles = SELECT OSPath FROM glob(
          globs="C:/Windows/System32/winevt/Logs/Microsoft-Windows-Bits-Operational*.evtx")
      LET RawEvents = SELECT * FROM foreach(
          row=EventFiles,
          query={
            SELECT
              System.TimeCreated.SystemTime AS EventTime,
              System.EventID.Value AS EventID,
              System.Computer AS Computer,
              EventData AS EventData
            FROM parse_evtx(filename=OSPath)
          })
      LET JobCreated = SELECT * FROM RawEvents WHERE EventID = 3
      -- Bits-Operational EventID 3 (job created) carries JobTitle,
      -- JobId, JobOwner, CmdLine and RemoteName in EventData on modern
      -- Windows; where missing they render as NULL.
      SELECT
        EventTime,
        Computer,
        EventID,
        EventData.JobTitle AS JobTitle,
        EventData.JobId AS JobId,
        EventData.JobOwner AS JobOwner,
        EventData.CmdLine AS NotifyCmdLine,
        EventData.RemoteName AS RemoteName,
        EventData.JobPath AS JobPath,
        if(condition=EventData.CmdLine =~ SuspiciousProcessRegex OR
                    EventData.RemoteName =~ SuspiciousProcessRegex OR
                    EventData.JobPath =~ SuspiciousPathRegex,
           then="** SUSPICIOUS **",
           else="") AS Flag
      FROM JobCreated
      WHERE EventTime > Cutoff

  - name: SuspiciousEventSummary
    description: >
      Error and command-execution related BITS events (job error / notification
      command execution) indicating download failure retry loops or persistence.
    query: |
      LET Cutoff = timestamp(epoch=now()) - timestamp(epoch=EventTimeframeDays * 86400)
      LET EventFiles = SELECT OSPath FROM glob(
          globs="C:/Windows/System32/winevt/Logs/Microsoft-Windows-Bits-Operational*.evtx")
      SELECT
        System.TimeCreated.SystemTime AS EventTime,
        System.EventID.Value AS EventID,
        System.Computer AS Computer,
        EventData.JobId AS JobId,
        EventData.JobTitle AS JobTitle,
        EventData.CmdLine As NotifyCmdLine,
        EventData.RemoteName As RemoteName,
        EventData.ErrorStr As ErrorStr,
        if(condition=EventData.CmdLine =~ SuspiciousProcessRegex OR
                    EventData.RemoteName =~ SuspiciousProcessRegex,
           then="** SUSPICIOUS **",
           else="") AS Flag
      FROM foreach(
        row=EventFiles,
        query={
          SELECT System.TimeCreated.SystemTime AS System_TimeCreated_SystemTime,
                 System.EventID.Value AS System_EventID_Value,
                 System.Computer AS Computer,
                 EventData AS EventData
          FROM parse_evtx(filename=OSPath)
        })
      WHERE System_EventID_Value IN (4, 13, 25, 26, 37) AND
            System_TimeCreated_SystemTime > Cutoff

  - name: BitsJobFiles
    description: >
      Enumerate BITS job state files and hash any files staged in
      suspicious directories referenced by active jobs.
    query: |
      LET JobFiles = SELECT
          OSPath,
          Size,
          Mtime
        FROM glob(
          globs=[
            "C:/Windows/System32/config/systemprofile/AppData/Local/Microsoft/Windows/BITS/**/*.job",
            "C:/Windows/System32/config/systemprofile/AppData/Local/Microsoft/Windows/BITS/qmgr.db"
          ])
      LET SuspiciousFiles = SELECT * FROM JobFiles WHERE OSPath =~ SuspiciousPathRegex
      SELECT
        OSPath,
        Size,
        Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM SuspiciousFiles

column_types:
  - name: EventTime
    type: timestamp
  - name: Mtime
    type: timestamp
  - name: OSPath
    type: os_path
  - name: RemoteName
    type: url
  - name: NotifyCmdLine
    type: command_line
  - name: Hashes
    type: hashes
