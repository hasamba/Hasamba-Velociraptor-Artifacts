name: Custom.DFIR.PSEncodedCommand4104
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts for PowerShell encoded command execution artifacts by parsing Windows Event 4104 (Script Block Logging).
  
  Detects use of -EncodedCommand, -Enc, -e, or -ec parameters, base64-encoded payloads,
  and common obfuscation patterns like FromBase64String and memory injection stubs.

reference:
  - https://attack.mitre.org/techniques/T1059.001/

type: CLIENT

parameters:
  - name: EvtxGlob
    type: glob
    default: "C:/Windows/System32/winevt/Logs/Microsoft-Windows-PowerShell/Operational.evtx"
  - name: EncodedRegex
    type: regex
    default: "(?i)(encodedcommand|\\s-[ee][nc]?\\s|frombase64string|-[ee]nc\\s)"
  - name: SuspiciousRegex
    type: regex
    default: "(?i)(iex|invoke-expression|downloadstring|downloadfile|start-process|new-object\\s+net\\.webclient|new-object\\s+system\\.net\\.webclient|system\\.io\\.compression|\\[convert\\]::frombase64string|\\[text\\.encoding\\]::utf8\\.getstring|hidden|noprofile|bypass|reflection\\\\.assembly|load\\(|\\[system\\.reflection)"
  - name: DateAfter
    type: timestamp
    default: ""

sources:
  - name: EncodedCommandEvents
    description: Parse PowerShell Operational evtx for Event 4104 and filter for encoded command patterns.
    query: |
      LET EvtxFiles <= SELECT OSPath FROM glob(globs=EvtxGlob)

      LET All4104 <= SELECT * FROM foreach(
        row=EvtxFiles,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            System.EventID.Value AS EventID,
            EventData.ScriptBlockId AS ScriptBlockId,
            EventData.ScriptBlockText AS ScriptBlockText,
            EventData.Path AS Path,
            OSPath AS EvtxPath
          FROM parse_evtx(filename=OSPath)
          WHERE System.EventID.Value = 4104
        })

      LET Filtered <= SELECT * FROM All4104
        WHERE ScriptBlockText =~ EncodedRegex
           OR ScriptBlockText =~ SuspiciousRegex

      SELECT
        EventTime,
        ScriptBlockId,
        ScriptBlockText,
        Path,
        EvtxPath,
        if(condition=ScriptBlockText =~ "(?i)encodedcommand|\\s-[ee][nc]?\\s",
           then="EncodedCommand",
           else=if(condition=ScriptBlockText =~ "(?i)frombase64string|\\[convert\\]",
                   then="Base64Decode",
                   else="SuspiciousPattern")) AS DetectionCategory,
        len(list=ScriptBlockText) AS ScriptLength
      FROM Filtered

  - name: Summary
    description: Aggregate summary of detected encoded command executions per host.
    query: |
      LET Results <= SELECT
        EventTime,
        ScriptBlockId,
        ScriptBlockText,
        Path,
        EvtxPath,
        DetectionCategory,
        ScriptLength
      FROM EncodedCommandEvents

      SELECT
        count() AS TotalDetections,
        min(item=EventTime) AS FirstSeen,
        max(item=EventTime) AS LastSeen,
        enumerate(items=DetectionCategory) AS Categories
      FROM Results

column_types:
  - name: EventTime
    type: timestamp
  - name: FirstSeen
    type: timestamp
  - name: LastSeen
    type: timestamp
  - name: EvtxPath
    type: path