name: Custom.DFIR.DetectCryptoMinerActivity
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for cryptocurrency miner activity by combining suspicious process names with sustained high CPU usage.
  
  This artifact is generic and cross-platform in intent, but most useful on endpoints where process and CPU telemetry are available.
reference:
  - https://attack.mitre.org/techniques/T1496/
type: CLIENT
parameters:
  - name: NameRegex
    type: regex
    default: '(?i)(xmrig|minerd|cpuminer|sgminer|bfgminer|t-rex|gminer|lolminer|kdevtmpfsi|kinsing|cryptonight|xmr-stak)'
  - name: ExePathRegex
    type: regex
    default: '(?i)(/tmp/|/var/tmp/|/dev/shm/|AppData\\\\Local\\\\Temp|\\\\Windows\\\\Temp)'
  - name: CmdlineRegex
    type: regex
    default: '(?i)(-o\\s+stratum\+tcp|stratum\+tcp://|--url|--user|--pass|--pool|wallet|rig-id|nonce|coinhive|monero)'
  - name: MinCpuPercent
    type: int
    default: 50
  - name: LookbackMinutes
    type: int
    default: 60
column_types:
  - name: CreateTime
    type: timestamp
  - name: Exe
    type: path
  - name: OSPath
    type: path
  - name: Mtime
    type: timestamp
  - name: ApproxCpuPercent
    type: int
  - name: Size
    type: int
sources:
  - name: SuspiciousProcesses
    description: Processes whose name, path, command line, or CPU usage match common miner patterns.
    query: |
      LET RecentProcesses <= SELECT Pid, Ppid, Name, Exe, CommandLine, Username, CreateTime, UserTime, KernelTime FROM pslist()
      SELECT
        timestamp(epoch=CreateTime) AS CreateTime,
        Pid,
        Ppid,
        Name,
        Exe,
        CommandLine,
        Username,
        UserTime,
        KernelTime
      FROM RecentProcesses
      WHERE Name =~ NameRegex
        OR Exe =~ ExePathRegex
        OR CommandLine =~ CmdlineRegex
  - name: HighCpuProcesses
    description: Processes that match miner-like names or command lines and are worth reviewing for sustained CPU abuse.
    query: |
      LET RecentProcesses <= SELECT Pid, Ppid, Name, Exe, CommandLine, Username, CreateTime, UserTime, KernelTime FROM pslist()
      SELECT
        timestamp(epoch=CreateTime) AS CreateTime,
        Pid,
        Ppid,
        Name,
        Exe,
        CommandLine,
        Username,
        UserTime,
        KernelTime
      FROM RecentProcesses
      WHERE Name =~ NameRegex
        OR Exe =~ ExePathRegex
        OR CommandLine =~ CmdlineRegex
  - name: MinerBinariesOnDisk
    description: Common miner binary names found on disk in temporary or user-writable locations.
    query: |
      LET Files <= SELECT OSPath, Size, Mtime FROM glob(globs=["C:/Users/**","/home/*/**","/tmp/**","/var/tmp/**","/dev/shm/**","/Windows/Temp/**"])
      SELECT
        OSPath,
        Size,
        Mtime
      FROM Files
      WHERE OSPath =~ '(?i)(xmrig|minerd|cpuminer|sgminer|bfgminer|t-rex|gminer|lolminer|kdevtmpfsi|kinsing|xmr-stak)'
