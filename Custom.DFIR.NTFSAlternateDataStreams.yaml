name: Custom.DFIR.NTFSAlternateDataStreams
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Finds files with Alternate Data Streams (ADS) on NTFS filesystems.
  
  ADS are often used by malware to hide payloads or configuration data.
  This artifact searches for streams with names (non-default streams) which typically indicates hidden data or 'Zone.Identifier' (Mark of the Web).

reference:
  - https://attack.mitre.org/techniques/T1564.004/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: "C:/Users/**/*.{exe,dll,bat,ps1,vbs,js}"
  - name: MinSize
    type: int
    default: 0
    description: Minimum stream size to report.
  - name: IgnoreZoneIdentifier
    type: bool
    default: false
    description: If true, ignore 'Zone.Identifier' streams (Mark of the Web).

sources:
  - name: ADSFound
    query: |
      -- Find all streams for files matching the glob using the ntfs accessor
      LET AllStreams <= SELECT 
          OSPath, 
          Name AS StreamName, 
          Size, 
          Mtime, 
          Atime, 
          Ctime, 
          Btime 
        FROM glob(globs=TargetGlob, accessor="ntfs")
        WHERE StreamName -- Only include streams with a name (non-default)

      -- Filter and format results
      SELECT 
        OSPath, 
        StreamName, 
        Size, 
        Mtime, 
        Atime, 
        Ctime, 
        Btime 
      FROM AllStreams 
      WHERE Size >= MinSize
        AND if(condition=IgnoreZoneIdentifier, 
               then=NOT StreamName =~ "Zone.Identifier", 
               else=TRUE)
      
column_types:
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: Btime
    type: timestamp
