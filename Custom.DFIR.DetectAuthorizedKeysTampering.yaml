name: Custom.DFIR.DetectAuthorizedKeysTampering
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect suspicious SSH authorized_keys entries across Linux user home directories.

  This artifact inspects authorized_keys files for unusual key options, suspicious
  comments, weak file modes, unexpected ownership, and recent modifications that may
  indicate persistence through SSH key tampering.

reference:
  - https://attack.mitre.org/techniques/T1098.004/
  - https://man.openbsd.org/sshd.8
  - https://man.openbsd.org/sshd_config.5

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: "/root/.ssh/authorized_keys,/home/*/.ssh/authorized_keys"
    description: Glob list for authorized_keys files to inspect.
  - name: FilterRegex
    type: regex
    default: "."
    description: Additional regex applied to file paths.
  - name: SuspiciousOptionRegex
    type: regex
    default: "(?i)(command=|environment=|from=|permitopen=|tunnel=|principals=)"
    description: Regex for risky authorized_keys options.
  - name: SuspiciousCommentRegex
    type: regex
    default: "(?i)(temp|test|backup|admin|root|svc|service|ansible|jenkins|deploy|github|gitlab|azure|gcp|aws|corp|vpn)"
    description: Regex for suspicious key comments.
  - name: RecentDays
    type: int
    default: 7
    description: Flag files modified within this many days.
  - name: UploadHits
    type: bool
    default: false
    description: Upload matching files.

sources:
  - name: Results
    description: Enumerate authorized_keys files and parse suspicious entries.
    query: |
      LET RecentSeconds <= RecentDays * 86400
      LET NowEpoch <= now().Unix

      LET KeyFiles <= SELECT
          OSPath,
          Size,
          Mtime,
          Mode,
          Uid,
          Gid,
          IsDir
        FROM glob(globs=split(string=TargetGlob, sep=","))
        WHERE NOT IsDir AND OSPath =~ FilterRegex

      LET ParsedLines <= SELECT
          KeyFiles.OSPath AS OSPath,
          KeyFiles.Size AS Size,
          KeyFiles.Mtime AS Mtime,
          KeyFiles.Mode AS Mode,
          KeyFiles.Uid AS Uid,
          KeyFiles.Gid AS Gid,
          Line,
          LineNumber
        FROM foreach(
          row=KeyFiles,
          query={
            SELECT
              Line,
              LineNumber
            FROM split_records(
              filenames=KeyFiles.OSPath,
              regex="\n",
              columns=["Line"])
          })

      LET Findings <= SELECT
          OSPath,
          Size,
          Mtime,
          Mode,
          Uid,
          Gid,
          LineNumber,
          Line,
          split(string=Line, sep="\s+")[-1] AS KeyComment,
          if(condition=Line =~ SuspiciousOptionRegex, then="Y", else="N") AS SuspiciousOptions,
          if(condition=split(string=Line, sep="\s+")[-1] =~ SuspiciousCommentRegex, then="Y", else="N") AS SuspiciousComment,
          if(condition=Mode =~ "(?i)....w....$|.......w.$", then="Y", else="N") AS WeakPermissions,
          if(condition=NowEpoch - Mtime.Unix < RecentSeconds, then="Y", else="N") AS RecentlyModified,
          hash(path=OSPath, hashselect="MD5,SHA256").MD5 AS MD5,
          hash(path=OSPath, hashselect="MD5,SHA256").SHA256 AS SHA256
        FROM ParsedLines
        WHERE Line =~ "\\S" AND NOT Line =~ "^\\s*#" AND (
          Line =~ SuspiciousOptionRegex OR
          split(string=Line, sep="\s+")[-1] =~ SuspiciousCommentRegex OR
          Mode =~ "(?i)....w....$|.......w.$" OR
          NowEpoch - Mtime.Unix < RecentSeconds
        )

      LET Uploaded <= SELECT
          OSPath,
          Size,
          Mtime,
          Mode,
          Uid,
          Gid,
          LineNumber,
          Line,
          KeyComment,
          SuspiciousOptions,
          SuspiciousComment,
          WeakPermissions,
          RecentlyModified,
          MD5,
          SHA256,
          upload(file=OSPath) AS Upload
        FROM Findings

      SELECT * FROM if(
        condition=UploadHits,
        then={ SELECT * FROM Uploaded },
        else={ SELECT * FROM Findings })

column_types:
  - name: OSPath
    type: path
  - name: Mtime
    type: timestamp
  - name: LineNumber
    type: int
  - name: MD5
    type: string
  - name: SHA256
    type: string
  - name: Upload
    type: preview_upload
