name: Custom.DFIR.PasstheHashTicket4624
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects pass-the-hash (PtH) and pass-the-ticket (PtT) activity by analyzing
  Windows Security Event Log 4624 (Logon) events with Logon Type 3 (network).

  PtH is indicated by LogonProcessName NtLmSsp and AuthenticationPackageName NTLM
  combined with an elevated target user or unusual source hosts. PtT is indicated
  by LogonProcessName Kerberos with AuthenticationPackageName Kerberos where
  patterns suggest a forged TGT or unusual LogonGuid.

  This artifact filters for NTLM and Kerberos network logons, flags suspicious
  credential usage, and enriches with source IP, target user, and logon process.

reference:
  - https://attack.mitre.org/techniques/T1550.002/

type: CLIENT

parameters:
  - name: EvtxGlob
    type: glob
    default: "C:/Windows/System32/winevt/Logs/Security.evtx"
  - name: SuspectUserRegex
    type: regex
    default: "(?i)(admin|svc|service|backup|operator|krbtgt)"
  - name: SuspectProcessRegex
    type: regex
    default: "(?i)(NtLmSsp|Kerberos)"
  - name: SuspiciousNTLMOnly
    type: bool
    default: Y
  - name: DaysBack
    type: int
    default: 7

sources:
  - name: NetworkLogon4624
    description: |
      Parses Security EVTX for event 4624 with Logon Type 3, filtering for
      NTLM and Kerberos authentication packages associated with PtH and PtT.
    query: |
      LET EvtxFiles <= SELECT OSPath FROM glob(globs=EvtxGlob)

      LET ParsedEvents <= SELECT * FROM foreach(
        row=EvtxFiles,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            System.EventID.Value AS EventID,
            EventData
          FROM parse_evtx(filename=OSPath)
          WHERE System.EventID.Value = 4624
        })

      LET Extracted <= SELECT
        EventTime,
        EventID,
        get(item=EventData, field="TargetUserName") AS TargetUserName,
        get(item=EventData, field="TargetDomainName") AS TargetDomainName,
        get(item=EventData, field="LogonType") AS LogonType,
        get(item=EventData, field="LogonProcessName") AS LogonProcessName,
        get(item=EventData, field="AuthenticationPackageName") AS AuthenticationPackageName,
        get(item=EventData, field="WorkstationName") AS WorkstationName,
        get(item=EventData, field="IpAddress") AS IpAddress,
        get(item=EventData, field="IpPort") AS IpPort,
        get(item=EventData, field="LogonGuid") AS LogonGuid,
        get(item=EventData, field="TargetUserSid") AS TargetUserSid,
        get(item=EventData, field="ElevatedToken") AS ElevatedToken,
        get(item=EventData, field="ImpersonationLevel") AS ImpersonationLevel,
        get(item=EventData, field="ProcessId") AS ProcessId,
        get(item=EventData, field="ProcessName") AS ProcessName
      FROM ParsedEvents

      LET FilteredLogons <= SELECT * FROM Extracted
        WHERE LogonType = "3"
          AND LogonProcessName =~ SuspectProcessRegex

      LET NTLMLogons <= SELECT
        EventTime,
        "PassTheHash" AS DetectionType,
        format(format="NTLM network logon Type 3 for user %s\\%s from %s (Workstation: %s)",
               args=[TargetDomainName, TargetUserName, IpAddress, WorkstationName]) AS DetectionDetail,
        TargetUserName,
        TargetDomainName,
        TargetUserSid,
        LogonType,
        LogonProcessName,
        AuthenticationPackageName,
        WorkstationName,
        IpAddress,
        IpPort,
        LogonGuid,
        ElevatedToken,
        ImpersonationLevel,
        ProcessId,
        ProcessName
      FROM FilteredLogons
      WHERE AuthenticationPackageName =~ "(?i)NTLM"
        AND SuspiciousNTLMOnly
        AND (TargetUserName =~ SuspectUserRegex
             OR ElevatedToken = "%%1842"
             OR IpAddress =~ "(?i)^(?!127\\.0\\.0\\.1)(?!169\\.|10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.)")

      LET KerberosLogons <= SELECT
        EventTime,
        "PassTheTicket" AS DetectionType,
        format(format="Kerberos network logon Type 3 for user %s\\%s from %s (LogonGuid: %s)",
               args=[TargetDomainName, TargetUserName, IpAddress, LogonGuid]) AS DetectionDetail,
        TargetUserName,
        TargetDomainName,
        TargetUserSid,
        LogonType,
        LogonProcessName,
        AuthenticationPackageName,
        WorkstationName,
        IpAddress,
        IpPort,
        LogonGuid,
        ElevatedToken,
        ImpersonationLevel,
        ProcessId,
        ProcessName
      FROM FilteredLogons
      WHERE AuthenticationPackageName =~ "(?i)Kerberos"
        AND (TargetUserName =~ SuspectUserRegex
             OR LogonGuid = "{00000000-0000-0000-0000-000000000000}"
             OR ElevatedToken = "%%1842")

      SELECT * FROM chain(q1={SELECT * FROM NTLMLogons}, q2={SELECT * FROM KerberosLogons})
      WHERE EventTime > now() - DaysBack * 86400
      ORDER BY EventTime DESC

column_types:
  - name: EventTime
    type: timestamp