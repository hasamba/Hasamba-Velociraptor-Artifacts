name: Custom.DFIR.AwsCredentialAfterHoursAccess
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for AWS credential files whose last access time falls outside normal working hours.

  This artifact searches common AWS credential/config locations across Linux,
  macOS, and Windows user profiles, extracts filesystem timestamps and hashes,
  and flags files whose access hour is before WorkdayStartHour or at/after
  WorkdayEndHour. This supports investigation of unsecured credential access
  consistent with MITRE ATT&CK T1552.001.

reference:
  - https://attack.mitre.org/techniques/T1552.001/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: "**/.aws/{credentials,config}"
  - name: PathRegex
    type: regex
    default: "(?i)(^|[\\/])\\.aws[\\/](credentials|config)$"
  - name: ContentRegex
    type: regex
    default: "(?i)(aws_access_key_id|aws_secret_access_key|aws_session_token|credential_process|sso_session)"
  - name: WorkdayStartHour
    type: string
    default: "08"
  - name: WorkdayEndHour
    type: string
    default: "18"
  - name: IncludeWorkingHours
    type: bool
    default: false
  - name: MaxPreviewBytes
    type: int
    default: 4096

sources:
  - name: Results
    description: AWS credential/config files with last access outside configured working hours.
    query: |
      LET Files <= SELECT OSPath, Size, Mtime, Atime, Ctime, Btime,
          format(format="%v", args=Atime) AS AccessTimeString,
          read_file(filename=OSPath, length=MaxPreviewBytes) AS Preview,
          hash(path=OSPath, hashselect="MD5,SHA256").MD5 AS MD5,
          hash(path=OSPath, hashselect="MD5,SHA256").SHA256 AS SHA256
        FROM glob(globs=[
          TargetGlob,
          "/home/*/.aws/{credentials,config}",
          "/root/.aws/{credentials,config}",
          "/Users/*/.aws/{credentials,config}",
          "C:/Users/*/.aws/{credentials,config}",
          "C:/Windows/System32/config/systemprofile/.aws/{credentials,config}"
        ])
        WHERE OSPath =~ PathRegex

      LET Parsed <= SELECT OSPath, Size, Mtime, Atime, Ctime, Btime,
          AccessTimeString,
          parse_string_with_regex(string=AccessTimeString, regex="T(?P<AccessHour>[0-9][0-9]):").AccessHour AS AccessHour,
          Preview, MD5, SHA256
        FROM Files
        WHERE Preview =~ ContentRegex

      LET Flagged <= SELECT OSPath, Size, Mtime, Atime, Ctime, Btime,
          AccessTimeString, AccessHour,
          if(condition=AccessHour < WorkdayStartHour OR AccessHour >= WorkdayEndHour,
             then="after_hours", else="working_hours") AS AccessWindow,
          MD5, SHA256
        FROM Parsed

      SELECT OSPath, Size, Mtime, Atime, Ctime, Btime,
          AccessTimeString, AccessHour, AccessWindow, MD5, SHA256
      FROM Flagged
      WHERE IncludeWorkingHours OR AccessWindow = "after_hours"

column_types:
  - name: OSPath
    type: path
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: Btime
    type: timestamp
  - name: MD5
    type: hash
  - name: SHA256
    type: hash
