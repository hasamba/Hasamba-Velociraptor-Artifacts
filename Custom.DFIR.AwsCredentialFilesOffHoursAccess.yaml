name: Custom.DFIR.AwsCredentialFilesOffHoursAccess
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for AWS credential/configuration files that were READ outside normal
  working hours - a common indicator of interactive credential theft,
  automation using leaked keys, or adversary harvesting of unsecured
  credentials (MITRE ATT&CK T1552.001 - Unsecured Credentials: Credentials
  In Files).

  Sweeps cross-platform AWS CLI/SDK locations:
    - Windows:  C:/Users/*/.aws/**
    - Linux:    /home/*/.aws/** and /root/.aws/**
    - macOS:    /Users/*/.aws/**

  Detection logic:
    - Enumerates every file under the AWS config directory using target
      globs (extend TargetGlob if your estate stores SDK cache or profiles
      elsewhere).
    - Flags files whose ACCESS time (atime) falls outside the configured
      working window (07:00-19:00 endpoint local time by default; tune
      StartHour/EndHour). Set IncludeAllHours=True to also list files
      accessed during working hours for baseline comparison.

  Forensic caveats:
    - atime is captured during the glob() enumeration, BEFORE the file is
      hashed or opened, so the artifact does not contaminate the very
      timestamp being hunted.
    - Linux relatime may suppress atime updates for files accessed more
      than once within 24h; NTFS can have LastAccessTime updates disabled
      on some builds. An absent/off result is not proof of innocence -
      treat atime findings as triage evidence, then corroborate with
      auditd/Sysmon/EDR logs around the flagged AccessTime.
    - AccessHour reflects the endpoint local timezone.

  Content inspection:
    - Each file's content is matched against KeyRegex. Any AWS access key
      IDs (AKIA/ASIA followed by 16 chars) are reported masked (first 8 +
      last 4 characters) so secrets are never written into hunt results.
      A boolean flag also marks files containing an actual
      aws_secret_access_key line. The full file can be uploaded to the
      server with UploadFiles=True if explicitly authorized, and exposed
      keys should then be rotated via AWS IAM.

reference:
  - https://attack.mitre.org/techniques/T1552.001/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: |
      C:/Users/*/.aws/**
      /home/*/.aws/**
      /root/.aws/**
      /Users/*/.aws/**

  - name: FileFilterRegex
    type: regex
    default: "."
    description: Keep only files whose full path matches this regex.

  - name: KeyRegex
    type: regex
    default: "(AKIA[A-Z0-9]{16}|ASIA[A-Z0-9]{16})"
    description: AWS access key ID pattern used for content inspection.

  - name: StartHour
    type: int64
    default: 7
    description: Start of the normal working window (endpoint local hour).

  - name: EndHour
    type: int64
    default: 19
    description: End of the normal working window (endpoint local hour).

  - name: MaxFileBytes
    type: int64
    default: 131072
    description: Skip files larger than this (bytes) to bound read cost.

  - name: IncludeAllHours
    type: bool
    default: false
    description: Also include files accessed during working hours (baseline).

  - name: UploadFiles
    type: bool
    default: false
    description: Upload flagged files to the server (files contain real secrets).

sources:
  - name: OffHoursAccess
    description: |
      AWS credential files whose access time falls outside the working
      window, with SHA256, masked access key preview and optional upload.
    query: |
      LET Files <= SELECT OSPath, Size, Atime, Mtime
          FROM glob(globs=TargetGlob)
          WHERE NOT is_dir AND Size > 0 AND Size < MaxFileBytes AND OSPath =~ FileFilterRegex AND Atime.Unix > 0

      SELECT OSPath,
             Size,
             Atime AS AccessTime,
             Atime.Hour AS AccessHour,
             Mtime AS ModTime,
             hash(path=OSPath, hashselect="SHA256").SHA256 AS SHA256,
             HasSecretMarker AS SecretKeyLinePresent,
             if(condition=FirstKeyRaw,
                then=substr(str=FirstKeyRaw, start=0, end=8) + "..." + substr(str=FirstKeyRaw, start=16),
                else=NULL) AS FirstKeyMasked,
             if(condition=UploadFiles, then=upload(file=OSPath), else=NULL) AS Upload
      FROM foreach(row=Files, query={
        SELECT parse_string_with_regex(string=read_file(filename=OSPath, length=MaxFileBytes), regex=KeyRegex)._0 AS FirstKeyRaw,
               read_file(filename=OSPath, length=MaxFileBytes) =~ "aws_secret_access_key" AS HasSecretMarker
        FROM scope()
      })
      WHERE IncludeAllHours OR Atime.Hour < StartHour OR Atime.Hour >= EndHour
      ORDER BY AccessTime

column_types:
  - name: OSPath
    type: path
  - name: AccessTime
    type: timestamp
  - name: ModTime
    type: timestamp
  - name: SHA256
    type: sha256
  - name: Size
    type: size