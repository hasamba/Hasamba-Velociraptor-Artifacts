name: Custom.DFIR.SysmonLsassCredentialAccess
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects evidence of credential dumping via LSASS memory access in Sysmon
  logs (MITRE ATT&CK T1003.001 - OS Credential Dumping: LSASS Memory).

  Correlates three Sysmon signals commonly produced by LSASS dump tooling:
  1. Event ID 10 (ProcessAccess) - a process requesting VM_READ style access
     rights against lsass.exe (0x1010, 0x1038, 0x1410, 0x143a and the
     0x1fff/0x1fffff "all access" family).
  2. Event ID 7 (ImageLoad) - minidump helper DLLs (comsvcs.dll, dbghelp.dll,
     dbgcore.dll) loaded into any process.
  3. Event ID 1 (ProcessCreate) - comsvcs.dll MiniDump command lines
     (rundll32 comsvcs.dll,#24 MiniDump <pid> <out.dmp> full).

reference:
  - https://attack.mitre.org/techniques/T1003.001/
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon

type: CLIENT

parameters:
  - name: EvtxGlob
    type: string
    default: "C:/Windows/System32/winevt/Logs/*Sysmon*.evtx"
  - name: SuspiciousAccessRegex
    type: regex
    default: "0x(1010|1038|1410|143a|1f[0-9a-f]{3})"
  - name: SourceImageFilterRegex
    type: regex
    default: "."
  - name: SuspiciousImageLoadRegex
    type: regex
    default: "(?i)(comsvcs|dbghelp|dbgcore)"
  - name: MiniDumpCmdRegex
    type: regex
    default: "(?i)comsvcs"

sources:
  - name: LsassProcessAccess
    description: |
      Sysmon Event ID 10 (ProcessAccess) - suspicious GrantedAccess against
      lsass.exe, with source process and call trace.
    query: |
      LET SysmonLogs <= SELECT OSPath FROM glob(globs=EvtxGlob)
      SELECT
        timestamp(epoch=System.TimeCreated.SystemTime) AS EventTime,
        System.Computer AS Computer,
        EventData.SourceImage AS SourceImage,
        EventData.SourceUser AS SourceUser,
        EventData.GrantedAccess AS GrantedAccess,
        EventData.CallTrace AS CallTrace,
        EventData.TargetImage AS TargetImage,
        EventData.TargetUser AS TargetUser,
        OSPath AS LogFile
      FROM foreach(
        row=SysmonLogs,
        query={
          SELECT OSPath,
                 System.TimeCreated.SystemTime AS SystemTime,
                 System.Computer AS Computer,
                 System.EventID.Value AS EventID,
                 EventData
          FROM parse_evtx(filename=OSPath)
        })
      WHERE EventID = 10
        AND TargetImage =~ "(?i)lsass.exe$"
        AND GrantedAccess =~ SuspiciousAccessRegex
        AND SourceImage =~ SourceImageFilterRegex

  - name: LsassImageLoad
    description: |
      Sysmon Event ID 7 (ImageLoad) - minidump helper DLLs
      (comsvcs.dll, dbghelp.dll, dbgcore.dll) loaded into processes.
    query: |
      LET SysmonLogs <= SELECT OSPath FROM glob(globs=EvtxGlob)
      SELECT
        timestamp(epoch=System.TimeCreated.SystemTime) AS EventTime,
        System.Computer AS Computer,
        EventData.Image AS Image,
        EventData.ImageLoaded AS ImageLoaded,
        EventData.FileVersion AS FileVersion,
        EventData.Hashes AS Hashes,
        EventData.Signed AS Signed,
        EventData.Signature AS Signature,
        OSPath AS LogFile
      FROM foreach(
        row=SysmonLogs,
        query={
          SELECT OSPath,
                 System.TimeCreated.SystemTime AS SystemTime,
                 System.Computer AS Computer,
                 System.EventID.Value AS EventID,
                 EventData
          FROM parse_evtx(filename=OSPath)
        })
      WHERE EventID = 7
        AND ImageLoaded =~ SuspiciousImageLoadRegex

  - name: MiniDumpCommandLines
    description: |
      Sysmon Event ID 1 (ProcessCreate) - comsvcs.dll MiniDump style
      command lines used to dump LSASS to a .dmp file.
    query: |
      LET SysmonLogs <= SELECT OSPath FROM glob(globs=EvtxGlob)
      SELECT
        timestamp(epoch=System.TimeCreated.SystemTime) AS EventTime,
        System.Computer AS Computer,
        EventData.Image AS Image,
        EventData.User AS User,
        EventData.CommandLine AS CommandLine,
        EventData.ParentImage AS ParentImage,
        OSPath AS LogFile
      FROM foreach(
        row=SysmonLogs,
        query={
          SELECT OSPath,
                 System.TimeCreated.SystemTime AS SystemTime,
                 System.Computer AS Computer,
                 System.EventID.Value AS EventID,
                 EventData
          FROM parse_evtx(filename=OSPath)
        })
      WHERE EventID = 1
        AND CommandLine =~ MiniDumpCmdRegex
        AND CommandLine =~ "(?i)minidump"

column_types:
  - name: EventTime
    type: timestamp
  - name: SourceImage
    type: string
  - name: TargetImage
    type: string
  - name: Image
    type: string
  - name: ImageLoaded
    type: string
  - name: CallTrace
    type: string
  - name: Hashes
    type: string
  - name: LogFile
    type: string