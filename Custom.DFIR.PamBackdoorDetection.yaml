name: Custom.DFIR.PamBackdoorDetection
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect PAM module backdoors by scanning PAM configuration files and hashing PAM-related shared libraries.
  Adversaries may modify pluggable authentication modules (PAM) to persist credentials access and bypass
  authentication on Linux hosts (MITRE ATT&CK T1556.003 — Authentication Package / Pluggable Authentication Modules).
  This artifact enumerates /etc/pam.d config entries, flags suspicious directives (pam_exec, hidden modules,
  unusual paths), and hashes all PAM module libraries to expose tampering or rogue .so files.

reference:
  - https://attack.mitre.org/techniques/T1556.003/

type: CLIENT

parameters:
  - name: PamConfigGlob
    type: glob
    default: "/etc/pam.d/*"
  - name: PamLibGlob
    type: string
    default: "/lib/x86_64-linux-gnu/security/*.so,/lib64/security/*.so,/usr/lib/x86_64-linux-gnu/security/*.so,/lib/security/*.so"
  - name: SuspiciousDirectiveRegex
    type: regex
    default: "pam_exec|pam_permit|pam_debug|pam_subpass|auth\\s+required\\s+.*\\.so"
  - name: SuspiciousPathRegex
    type: regex
    default: "/tmp/|/dev/shm|/home/|/var/tmp|\\.hidden|\\\\ "
  - name: HashLibraries
    type: bool
    default: true

sources:
  - name: PamConfigScan
    description: Parse /etc/pam.d entries and flag suspicious directives or module paths
    query: |
      LET ConfigFiles <= SELECT OSPath, Size, Mtime FROM glob(globs=PamConfigGlob)
      SELECT
        OSPath AS ConfigFile,
        Mtime AS Modified,
        Line AS RawLine,
        LineNo
      FROM foreach(
        row=ConfigFiles,
        query={
          SELECT
            record.Line AS Line,
            record.LineNo AS LineNo,
            OSPath,
            Size,
            Mtime
          FROM parse_lines(filename=OSPath)
        }
      )
      WHERE Line =~ SuspiciousDirectiveRegex
        OR Line =~ SuspiciousPathRegex
        OR Line =~ FilterRegex

  - name: ModuleHashes
    description: Hash all PAM security module libraries for baselining and rogue-module detection
    query: |
      LET Libs <= SELECT OSPath, Size, Mtime FROM glob(globs=split(string=PamLibGlob, sep=","))
      SELECT
        OSPath AS LibraryPath,
        Size AS SizeBytes,
        Mtime AS Modified,
        hash(path=OSPath, hashselect="MD5,SHA256").MD5 AS MD5,
        hash(path=OSPath, hashselect="MD5,SHA256").SHA256 AS SHA256
      FROM Libs
      WHERE HashLibraries
        AND (OSPath =~ FilterRegex OR OSPath =~ SuspiciousPathRegex OR Size = 0)

  - name: LoadedPamModules
    description: Processes currently mapped to PAM library paths — catches live backdoor loading
    query: |
      LET ProcMaps = SELECT Exe, Pid, Name, CommandLine FROM pslist()
      SELECT
        Pid,
        Name,
        Exe,
        CommandLine
      FROM ProcMaps
      WHERE Exe =~ "pam|/lib/security"

column_types:
  - name: Modified
    type: timestamp
  - name: ConfigFile
    type: path
  - name: LibraryPath
    type: path
  - name: MD5
    type: hash
  - name: SHA256
    type: hash