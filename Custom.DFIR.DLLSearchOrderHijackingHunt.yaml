name: Custom.DFIR.DLLSearchOrderHijackingHunt
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts for evidence of DLL Search Order Hijacking (T1574.001) by scanning temp
  directories and writable PATH locations for DLLs that may shadow legitimate system
  libraries, and cross-references process image paths loaded from suspicious locations.

  Investigates:
  - DLLs residing in %TEMP%, %TMP%, and user-writable PATH directories
  - Processes loading DLLs from outside System32/SysWOW64/WinSxS
  - PATH environment variable entries that precede System32 and may be weaponised
  - File metadata anomalies (no version info, unsigned, suspicious timestamps)

reference:
  - https://attack.mitre.org/techniques/T1574.001/
  - https://docs.microsoft.com/en-us/windows/win32/dlls/dynamic-link-library-search-order

type: CLIENT

parameters:
  - name: TempGlobs
    description: Glob patterns covering temp and writable directories to scan for DLLs.
    type: csv
    default: |
      Glob
      C:/Windows/Temp/**/*.dll
      C:/Users/*/AppData/Local/Temp/**/*.dll
      C:/Temp/**/*.dll
      C:/ProgramData/Temp/**/*.dll

  - name: SuspiciousPathRegex
    description: Regex matching directories considered suspicious for DLL placement.
    type: regex
    default: "(?i)(\\\\temp\\\\|\\\\tmp\\\\|\\\\appdata\\\\local\\\\temp\\\\|\\\\programdata\\\\temp\\\\|c:\\\\temp\\\\)"

  - name: LegitDirRegex
    description: Regex matching known-good system DLL directories (excluded from process DLL scan).
    type: regex
    default: "(?i)(system32|syswow64|winsxs|windows\\\\assembly|microsoft\\.net)"

  - name: DLLNameFilterRegex
    description: Regex filter on DLL filename for scoped investigations (default matches all).
    type: regex
    default: "."

  - name: UploadSuspiciousDLLs
    description: If true, upload DLLs found in suspicious locations for further analysis.
    type: bool
    default: "N"

sources:
  - name: TempDirDLLs
    description: |
      DLLs found inside temp and writable directories. High-confidence indicators when
      filenames collide with known Windows or application DLL names.
    query: |
      LET TempDirList <= SELECT Glob FROM parse_csv(filename=TempGlobs, accessor="data")

      LET RawDLLs <= SELECT OSPath, Size, Mtime, Atime, Ctime
                     FROM foreach(
                       row=TempDirList,
                       query={
                         SELECT OSPath, Size, Mtime, Atime, Ctime
                         FROM glob(globs=Glob)
                       })
                     WHERE OSPath =~ DLLNameFilterRegex

      LET HashedDLLs <= SELECT
          OSPath,
          Size,
          Mtime,
          Atime,
          Ctime,
          hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
        FROM RawDLLs

      SELECT
        OSPath,
        Size,
        Mtime,
        Atime,
        Ctime,
        Hashes.MD5 AS MD5,
        Hashes.SHA256 AS SHA256,
        if(condition=UploadSuspiciousDLLs,
          then=upload(file=OSPath),
          else="N/A") AS Upload
      FROM HashedDLLs

  - name: ProcessesWithSuspiciousDLLPaths
    description: |
      Running processes whose executable path resides in a suspicious (writable / temp)
      directory, indicating a potentially hijacked DLL loading context.
    query: |
      LET ProcList <= SELECT Pid, Ppid, Name, Exe, CommandLine, Username, CreateTime
                      FROM pslist()
                      WHERE Exe =~ SuspiciousPathRegex
                        AND Exe =~ DLLNameFilterRegex

      SELECT
        Pid,
        Ppid,
        Name,
        Exe,
        CommandLine,
        Username,
        CreateTime
      FROM ProcList

  - name: PATHAnalysis
    description: |
      Analyses the system and per-user PATH environment variable for directories that
      precede System32, are writable, or reside in temp/user-controlled locations.
      Entries that appear before System32 are prime hijacking candidates.
    query: |
      LET SystemPath <= environ(var="PATH")

      LET PathEntries <= SELECT Line AS PathEntry,
                                enumerate() AS EntryIndex
                         FROM split_records(
                           filenames=SystemPath,
                           accessor="data",
                           regex=";",
                           columns=["Line"])
                         WHERE Line != ""

      LET System32Index <= SELECT min(item=EntryIndex) AS Idx
                           FROM PathEntries
                           WHERE PathEntry =~ "(?i)system32"

      SELECT
        PathEntry,
        EntryIndex,
        if(condition= EntryIndex < System32Index.Idx,
           then="⚠️ PRECEDES System32",
           else="OK") AS PositionRisk,
        if(condition= PathEntry =~ SuspiciousPathRegex,
           then="⚠️ SUSPICIOUS LOCATION",
           else="OK") AS LocationRisk
      FROM PathEntries

  - name: DLLsInWritablePATHDirs
    description: |
      Scans each non-system PATH directory for DLLs. DLLs placed in PATH directories
      that precede System32 may be loaded in place of legitimate system libraries.
    query: |
      LET SystemPath <= environ(var="PATH")

      LET PathEntries <= SELECT Line AS PathEntry
                         FROM split_records(
                           filenames=SystemPath,
                           accessor="data",
                           regex=";",
                           columns=["Line"])
                         WHERE Line != ""
                           AND NOT Line =~ LegitDirRegex

      LET DLLsFound <= SELECT OSPath, Size, Mtime
                       FROM foreach(
                         row=PathEntries,
                         query={
                           SELECT OSPath, Size, Mtime
                           FROM glob(globs=PathEntry + "/*.dll")
                         })
                       WHERE OSPath =~ DLLNameFilterRegex

      LET HashedWritable <= SELECT
          OSPath,
          Size,
          Mtime,
          hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
        FROM DLLsFound

      SELECT
        OSPath,
        Size,
        Mtime,
        Hashes.MD5 AS MD5,
        Hashes.SHA256 AS SHA256
      FROM HashedWritable

column_types:
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: CreateTime
    type: timestamp
  - name: OSPath
    type: path
  - name: Exe
    type: path
  - name: MD5
    type: string
  - name: SHA256
    type: string
