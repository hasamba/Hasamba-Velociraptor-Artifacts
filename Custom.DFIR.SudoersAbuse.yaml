name: Custom.DFIR.SudoersAbuse
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect evidence of sudo rule abuse or new NOPASSWD entries in sudoers configuration.
  
  Adversaries may modify sudoers files to elevate privileges, often adding NOPASSWD entries
  to bypass authentication (MITRE ATT&CK T1548.003). This artifact collects and analyzes
  sudoers configuration files, sudoers.d entries, and sudo log entries for signs of abuse.

reference:
  - https://attack.mitre.org/techniques/T1548.003/

type: CLIENT

parameters:
  - name: SudoersGlob
    type: glob
    default: "/etc/sudoers,/etc/sudoers.d/*"
  - name: FilterRegex
    type: regex
    default: "(?i)(nopasswd|\\(root\\)|\\(all\\)|\\ball\\b.*\\ball\\b|\\b!root\\b|\\b\\(ALL\\s*:\\s*ALL\\))"
  - name: SudoLogGlob
    type: glob
    default: "/var/log/sudo*"
  - name: AuthLogGlob
    type: glob
    default: "/var/log/auth.log*"

sources:
  - name: SudoersFiles
    description: Collect and analyze sudoers configuration files for NOPASSWD and permissive rules.
    query: |
      LET SudoersFiles <= SELECT OSPath, Size, Mtime
        FROM glob(globs=SudoersGlob)
      
      LET ParsedLines <= SELECT OSPath, Line
        FROM foreach(
          row=SudoersFiles,
          query={
            SELECT OSPath, Line
            FROM split_records(filenames=OSPath, regex="\n", columns=["Line"])
            WHERE NOT Line =~ "^\s*#" AND NOT Line =~ "^\s*$"
          })
      
      SELECT
        OSPath AS SudoersFile,
        Line,
        Mtime,
        if(condition=Line =~ "(?i)nopasswd", then="NOPASSWD", else="PermissiveRule") AS RuleType
      FROM ParsedLines
      WHERE Line =~ FilterRegex

  - name: SudoersDEntries
    description: Enumerate all files in /etc/sudoers.d/ with metadata and content.
    query: |
      LET SudoersDEntries <= SELECT OSPath, Size, Mtime
        FROM glob(globs="/etc/sudoers.d/*")
      
      SELECT
        OSPath,
        Size,
        Mtime,
        read_file(filename=OSPath, length=4096) AS Content,
        if(condition=Content =~ "(?i)nopasswd", then=true, else=false) AS HasNopasswd
      FROM SudoersDEntries

  - name: SudoLogs
    description: Collect sudo log entries showing command executions with timestamp and user.
    query: |
      LET SudoLogFiles <= SELECT OSPath, Size, Mtime
        FROM glob(globs=SudoLogGlob)
      
      SELECT
        OSPath AS LogFile,
        Line,
        Mtime
      FROM foreach(
        row=SudoLogFiles,
        query={
          SELECT OSPath, Line, Mtime
          FROM split_records(filenames=OSPath, regex="\n", columns=["Line"])
          WHERE Line =~ "(?i)sudo"
        })

  - name: AuthLogSudoEntries
    description: Collect auth.log entries related to sudo usage for privilege escalation audit.
    query: |
      LET AuthLogFiles <= SELECT OSPath, Size, Mtime
        FROM glob(globs=AuthLogGlob)
      
      SELECT
        OSPath AS AuthLogFile,
        Line,
        Mtime
      FROM foreach(
        row=AuthLogFiles,
        query={
          SELECT OSPath, Line, Mtime
          FROM split_records(filenames=OSPath, regex="\n", columns=["Line"])
          WHERE Line =~ "(?i)sudo|privilege|escalat"
        })

column_types:
  - name: Mtime
    type: timestamp
  - name: SudoersFile
    type: path
  - name: LogFile
    type: path
  - name: AuthLogFile
    type: path