name: Custom.DFIR.SudoersAbuse
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects evidence of sudo rule abuse and unauthorized NOPASSWD entries in sudoers configuration.

  This artifact scans /etc/sudoers and /etc/sudoers.d/* for NOPASSWD directives,
  suspicious user/group rule additions, and recently modified sudoers files.
  It also checks sudo log entries for privilege escalation activity and
  examines running processes for those executing under sudo context.

  MITRE ATT&CK T1548.003 - Abuse Elevation Control Mechanism: Sudo and Sudo Caching.

reference:
  - https://attack.mitre.org/techniques/T1548.003/

type: CLIENT

parameters:
  - name: SudoersGlob
    type: glob
    default: "/etc/sudoers"
    description: Main sudoers file path.

  - name: SudoersDGlob
    type: glob
    default: "/etc/sudoers.d/*"
    description: Drop-in sudoers directory glob.

  - name: SudoLogGlob
    type: glob
    default: "/var/log/sudo.log"
    description: sudo log file path (may vary by distro).

  - name: AuthLogGlob
    type: glob
    default: "/var/log/auth.log*"
    description: Auth log files for sudo session events.

  - name: NopasswdRegex
    type: regex
    default: "NOPASSWD"
    description: Regex to match NOPASSWD directives in sudoers files.

  - name: SuspiciousSudoRegex
    type: regex
    default: "(ALL\\s*=\\s*ALL|ALL\\s*\\(ALL\\)|!authenticate|authenticate!)"
    description: Regex for overly permissive or dangerous sudo rules.

  - name: SudoAuthRegex
    type: regex
    default: "sudo.*COMMAND|sudo.*session|sudo:.*authentication"
    description: Regex for sudo-related auth log entries.

sources:
  - name: SudoersFiles
    description: Parse main sudoers and drop-in files for NOPASSWD and suspicious rules.
    query: |
      LET SudoersPaths <= SELECT OSPath, Size, Mtime FROM glob(globs=SudoersGlob)
      LET SudoersDPaths <= SELECT OSPath, Size, Mtime FROM glob(globs=SudoersDGlob)
      LET AllSudoers <= SELECT * FROM chain(
        a={ SELECT * FROM SudoersPaths },
        b={ SELECT * FROM SudoersDPaths })

      LET ParsedLines <= SELECT
        OSPath,
        Size,
        Mtime,
        Line,
        if(condition=Line =~ NopasswdRegex, then=TRUE, else=FALSE) AS HasNOPASSWD,
        if(condition=Line =~ SuspiciousSudoRegex, then=TRUE, else=FALSE) AS IsSuspicious
      FROM foreach(
        row=AllSudoers,
        query={
          SELECT OSPath, Size, Mtime, Line
          FROM split_records(filenames=OSPath, regex="\n", columns=["Line"])
        })

      SELECT
        OSPath AS SudoersFile,
        Mtime,
        Line,
        HasNOPASSWD,
        IsSuspicious
      FROM ParsedLines
      WHERE HasNOPASSWD OR IsSuspicious OR Line =~ "^\\s*Defaults"
      ORDER BY OSPath

  - name: SudoersFileMetadata
    description: Metadata for all sudoers files including modification times and hashes.
    query: |
      LET AllFiles <= SELECT * FROM chain(
        a={ SELECT OSPath, Size, Mtime FROM glob(globs=SudoersGlob) },
        b={ SELECT OSPath, Size, Mtime FROM glob(globs=SudoersDGlob) })

      SELECT
        OSPath AS SudoersFile,
        Size,
        Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM AllFiles

  - name: SudoAuthLogEntries
    description: Parse auth logs for sudo session and command execution events.
    query: |
      LET AuthFiles <= SELECT OSPath FROM glob(globs=AuthLogGlob)

      SELECT
        OSPath AS LogFile,
        Line
      FROM foreach(
        row=AuthFiles,
        query={
          SELECT OSPath, Line
          FROM split_records(filenames=OSPath, regex="\n", columns=["Line"])
        })
      WHERE Line =~ SudoAuthRegex

  - name: SudoLogEntries
    description: Parse the dedicated sudo log file if it exists for command audit trail.
    query: |
      LET SudoLogFiles <= SELECT OSPath FROM glob(globs=SudoLogGlob)

      SELECT
        OSPath AS SudoLogFile,
        Line
      FROM foreach(
        row=SudoLogFiles,
        query={
          SELECT OSPath, Line
          FROM split_records(filenames=OSPath, regex="\n", columns=["Line"])
        })

  - name: SudoProcesses
    description: List currently running processes that may be executing under sudo context.
    query: |
      LET Procs <= SELECT Pid, Ppid, Name, Exe, CommandLine, Username FROM pslist()

      SELECT
        Pid,
        Ppid,
        Name,
        Exe,
        CommandLine,
        Username
      FROM Procs
      WHERE
        Username =~ "root" AND Ppid > 0
        OR CommandLine =~ "(?i)sudo"
        OR Name =~ "(?i)sudo"

column_types:
  - name: Mtime
    type: timestamp
  - name: Hashes
    type: hash