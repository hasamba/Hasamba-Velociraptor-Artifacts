name: Custom.DFIR.WindowsNetworkLogonCredentialReuse
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect suspicious Windows Security 4624 network logons that may indicate pass-the-hash or pass-the-ticket activity.

  This artifact parses Windows Security.evtx for successful Logon Type 3 events and exposes fields commonly used to triage credential replay: source IP, logon process, authentication package, key length, impersonation level, elevated token, and account/domain context. It is mapped to MITRE ATT&CK T1550.002.

reference:
  - https://attack.mitre.org/techniques/T1550.002/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4624

type: CLIENT

parameters:
  - name: SecurityLogGlob
    type: glob
    default: C:/Windows/System32/winevt/Logs/Security.evtx
  - name: UserRegex
    type: regex
    default: .
  - name: SourceIpRegex
    type: regex
    default: .
  - name: AuthPackageRegex
    type: regex
    default: (?i)^(NTLM|Kerberos)$
  - name: ExcludeUserRegex
    type: regex
    default: (?i).*\$$
  - name: SuspiciousOnly
    type: bool
    default: true

sources:
  - name: NetworkLogon4624
    description: Successful Windows Security 4624 Logon Type 3 events with credential-reuse triage fields.
    query: |
      LET SecurityLogs <= SELECT OSPath, Size, Mtime FROM glob(globs=SecurityLogGlob)

      LET NetworkLogons <= SELECT
          OSPath AS EventLogPath,
          System.TimeCreated.SystemTime AS EventTime,
          System.Computer AS Computer,
          System.EventID.Value AS EventID,
          get(item=EventData, field="SubjectUserName") AS SubjectUserName,
          get(item=EventData, field="SubjectDomainName") AS SubjectDomainName,
          get(item=EventData, field="TargetUserName") AS TargetUserName,
          get(item=EventData, field="TargetDomainName") AS TargetDomainName,
          get(item=EventData, field="TargetLogonId") AS TargetLogonId,
          get(item=EventData, field="LogonType") AS LogonType,
          get(item=EventData, field="LogonProcessName") AS LogonProcessName,
          get(item=EventData, field="AuthenticationPackageName") AS AuthenticationPackageName,
          get(item=EventData, field="LmPackageName") AS LmPackageName,
          get(item=EventData, field="KeyLength") AS KeyLength,
          get(item=EventData, field="ProcessName") AS ProcessName,
          get(item=EventData, field="IpAddress") AS SourceIpAddress,
          get(item=EventData, field="IpPort") AS SourceIpPort,
          get(item=EventData, field="ImpersonationLevel") AS ImpersonationLevel,
          get(item=EventData, field="RestrictedAdminMode") AS RestrictedAdminMode,
          get(item=EventData, field="TargetOutboundUserName") AS TargetOutboundUserName,
          get(item=EventData, field="TargetOutboundDomainName") AS TargetOutboundDomainName,
          get(item=EventData, field="ElevatedToken") AS ElevatedToken,
          EventData
        FROM foreach(
          row=SecurityLogs,
          query={
            SELECT * FROM parse_evtx(filename=OSPath)
            WHERE System.EventID.Value = 4624
              AND get(item=EventData, field="LogonType") =~ "^3$"
          })

      SELECT
        EventTime,
        Computer,
        EventID,
        EventLogPath,
        TargetUserName,
        TargetDomainName,
        TargetLogonId,
        SourceIpAddress,
        SourceIpPort,
        LogonProcessName,
        AuthenticationPackageName,
        LmPackageName,
        KeyLength,
        ImpersonationLevel,
        RestrictedAdminMode,
        ElevatedToken,
        ProcessName,
        SubjectUserName,
        SubjectDomainName,
        TargetOutboundUserName,
        TargetOutboundDomainName,
        EventData,
        AuthenticationPackageName =~ "(?i)^NTLM$" AS PossiblePassTheHash,
        AuthenticationPackageName =~ "(?i)^Kerberos$" AS PossiblePassTheTicket,
        KeyLength =~ "^0$" AS ZeroKeyLength,
        ElevatedToken =~ "(?i)^(%%1842|Yes|true)$" AS ElevatedNetworkToken
      FROM NetworkLogons
      WHERE TargetUserName =~ UserRegex
        AND SourceIpAddress =~ SourceIpRegex
        AND AuthenticationPackageName =~ AuthPackageRegex
        AND NOT TargetUserName =~ ExcludeUserRegex
        AND if(condition=SuspiciousOnly,
          then=AuthenticationPackageName =~ "(?i)^(NTLM|Kerberos)$" AND SourceIpAddress =~ "^(?!-|::1|127\\.0\\.0\\.1$).+",
          else=true)

column_types:
  - name: EventTime
    type: timestamp
  - name: EventLogPath
    type: path
