name: Custom.DFIR.LinuxPasswdShadowModification
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for suspicious modifications to /etc/passwd and /etc/shadow (T1136.001 - Create Account: Local Account).

  Parses /etc/passwd for risky entries (additional UID 0 accounts, accounts with login shells
  and no password, system accounts with interactive shells, unusual home directories) and
  reports file metadata/hashes for passwd, shadow and their backups (passwd-, shadow-, .bak),
  so recent timestamps can be correlated with account creation.

reference:
  - https://attack.mitre.org/techniques/T1136.001/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: "/etc/{passwd,shadow,passwd-,shadow-,gshadow,group,passwd.bak,shadow.bak,passwd.OLD,shadow.OLD}"
  - name: FilterRegex
    type: regex
    default: "."
  - name: LoginShellRegex
    type: regex
    default: "(bash|zsh|sh|dash|ksh|csh|tcsh|fish)$"
  - name: SuspiciousHomeRegex
    type: regex
    default: "^(/tmp|/dev/shm|/var/tmp|/var/www|/run|/dev)"

sources:
  - name: FileMetadata
    description: Metadata and hashes of account database files and their backups.
    query: |
      LET Files <= SELECT OSPath, Size, Mode.String AS Mode, Mtime, Atime, Ctime, Btime
        FROM glob(globs=TargetGlob)
        WHERE NOT IsDir AND OSPath =~ FilterRegex
      SELECT OSPath, Size, Mode, Mtime, Atime, Ctime, Btime,
             hash(path=OSPath, hashselect="SHA256").SHA256 AS SHA256,
             hash(path=OSPath, hashselect="MD5").MD5 AS MD5
      FROM Files

  - name: PasswdSuspiciousEntries
    description: Suspicious account entries in /etc/passwd.
    query: |
      LET Lines <= SELECT Line FROM parse_lines(filename="/etc/passwd")
        WHERE Line =~ "^[^#]" AND Line =~ ":"
      LET Parsed <= SELECT parse_string_with_regex(string=Line,
          regex="^(?P<User>[^:]*):(?P<Pw>[^:]*):(?P<UID>[^:]*):(?P<GID>[^:]*):(?P<Gecos>[^:]*):(?P<Home>[^:]*):(?P<Shell>.*)$") AS R,
          Line
        FROM Lines
      LET Entries <= SELECT R.User AS User, R.Pw AS PasswordField, int(int=R.UID) AS UID,
          int(int=R.GID) AS GID, R.Gecos AS Gecos, R.Home AS Home, R.Shell AS Shell, Line
        FROM Parsed
      SELECT User, PasswordField, UID, GID, Gecos, Home, Shell,
        if(condition=UID = 0 AND User != "root", then="UID0_NonRoot",
        else=if(condition=PasswordField = "" , then="EmptyPasswordField",
        else=if(condition=Home =~ SuspiciousHomeRegex, then="SuspiciousHome",
        else=if(condition=UID < 1000 AND UID > 0 AND Shell =~ LoginShellRegex AND NOT User =~ "^(sync|halt|shutdown)$",
                then="SystemAccountWithLoginShell",
        else=if(condition=PasswordField != "x" AND PasswordField != "*" AND PasswordField != "!",
                then="PasswordHashInPasswd", else="")))))  AS Reason,
        Line
      FROM Entries
      WHERE Reason != "" AND Line =~ FilterRegex

  - name: ShadowSuspiciousEntries
    description: Shadow entries with empty passwords or recently changed passwords (hashes are not returned).
    query: |
      LET Lines <= SELECT Line FROM parse_lines(filename="/etc/shadow")
        WHERE Line =~ "^[^#]" AND Line =~ ":"
      LET Parsed <= SELECT parse_string_with_regex(string=Line,
          regex="^(?P<User>[^:]*):(?P<Hash>[^:]*):(?P<LastChange>[^:]*):") AS R
        FROM Lines
      SELECT R.User AS User,
        if(condition=R.Hash = "", then="EmptyPassword",
        else=if(condition=R.Hash =~ "^[!*]", then="Locked/NoPassword",
        else="HasHash")) AS PasswordState,
        if(condition=R.LastChange =~ "^[0-9]+$",
           then=timestamp(epoch=int(int=R.LastChange) * 86400), else=NULL) AS LastPasswordChange
      FROM Parsed
      WHERE User =~ FilterRegex AND PasswordState != "Locked/NoPassword"

column_types:
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: Btime
    type: timestamp
  - name: LastPasswordChange
    type: timestamp
  - name: OSPath
    type: path
  - name: SHA256
    type: hash
  - name: MD5
    type: hash
