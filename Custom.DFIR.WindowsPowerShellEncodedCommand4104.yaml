name: Custom.DFIR.WindowsPowerShellEncodedCommand4104
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for PowerShell encoded command execution artifacts in Windows PowerShell Script Block Logging events (Event ID 4104).
  
  This artifact parses PowerShell Operational EVTX logs and extracts script block content that may indicate use of encoded commands, Base64 payloads, or obfuscated execution. It is useful for DFIR triage and threat hunting related to MITRE ATT&CK T1059.001.
reference:
  - https://attack.mitre.org/techniques/T1059.001/
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging_windows
type: CLIENT
parameters:
  - name: EvtxGlob
    type: glob
    default: "C:/Windows/System32/winevt/Logs/Microsoft-Windows-PowerShell%4Operational.evtx"
  - name: ScriptBlockRegex
    type: regex
    default: "(?i)(?:-enc(?:odedcommand)?\\b|frombase64string|[A-Za-z0-9+/]{200,}={0,2})"
  - name: PathRegex
    type: regex
    default: "(?i)PowerShell"
  - name: UploadLogs
    type: bool
    default: false
sources:
  - name: ScriptBlockEvents
    description: Parse PowerShell Operational EVTX files and return matching 4104 script block events.
    query: |
      LET LogFiles <= SELECT OSPath, Size, Mtime
      FROM glob(globs=EvtxGlob)
      WHERE OSPath =~ PathRegex

      LET ParsedEvents <= SELECT
          OSPath,
          Size,
          Mtime,
          System.TimeCreated.SystemTime AS EventTime,
          System.Computer AS Computer,
          System.Channel AS Channel,
          System.Provider.Name AS Provider,
          System.EventRecordID AS EventRecordID,
          System.Execution.ProcessID AS ProcessID,
          System.Security.UserID AS UserID,
          EventData.ScriptBlockId AS ScriptBlockId,
          EventData.Path AS ScriptPath,
          EventData.MessageNumber AS MessageNumber,
          EventData.MessageTotal AS MessageTotal,
          EventData.ScriptBlockText AS ScriptBlockText
      FROM foreach(
        row=LogFiles,
        query={
          SELECT *
          FROM parse_evtx(filename=OSPath)
          WHERE System.EventID.Value = 4104
        })

      LET Results <= SELECT
          EventTime,
          Computer,
          Channel,
          Provider,
          OSPath,
          Size,
          Mtime,
          EventRecordID,
          ProcessID,
          UserID,
          ScriptBlockId,
          ScriptPath,
          MessageNumber,
          MessageTotal,
          ScriptBlockText,
          if(
            condition=ScriptBlockText =~ "(?i)-enc(?:odedcommand)?\\b",
            then="EncodedCommandSwitch",
            else=if(
              condition=ScriptBlockText =~ "(?i)frombase64string",
              then="FromBase64String",
              else="LongBase64LikeString")) AS MatchType
      FROM ParsedEvents
      WHERE ScriptBlockText =~ ScriptBlockRegex

      SELECT * FROM if(
        condition=UploadLogs,
        then={
          SELECT *, upload(file=OSPath) AS Upload
          FROM Results
        },
        else={
          SELECT * FROM Results
        })
column_types:
  - name: EventTime
    type: timestamp
  - name: Mtime
    type: timestamp
  - name: OSPath
    type: path
  - name: ScriptPath
    type: path
