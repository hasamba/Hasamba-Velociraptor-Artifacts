name: Custom.DFIR.DetectBITSJobAbuse
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects evidence of BITS job abuse used for persistence or file download on Windows endpoints.

  This artifact looks for BITS queue database files, registry autoruns invoking bitsadmin or PowerShell BITS cmdlets,
  scheduled task definitions referencing BITS abuse patterns, and prefetch evidence for bitsadmin execution.
reference:
  - https://attack.mitre.org/techniques/T1197/

type: CLIENT

parameters:
  - name: BitsQueueGlob
    type: glob
    default: "C:/ProgramData/Microsoft/Network/Downloader/qmgr*.dat"
  - name: TaskGlob
    type: glob
    default: "C:/Windows/System32/Tasks/**/*"
  - name: PrefetchGlob
    type: glob
    default: "C:/Windows/Prefetch/BITSADMIN*.pf"
  - name: RegistryGlobs
    type: csv
    default: |
      HKEY_LOCAL_MACHINE/SOFTWARE/Microsoft/Windows/CurrentVersion/Run/*,
      HKEY_LOCAL_MACHINE/SOFTWARE/Microsoft/Windows/CurrentVersion/RunOnce/*,
      HKEY_LOCAL_MACHINE/SOFTWARE/Wow6432Node/Microsoft/Windows/CurrentVersion/Run/*,
      HKEY_LOCAL_MACHINE/SOFTWARE/Wow6432Node/Microsoft/Windows/CurrentVersion/RunOnce/*,
      HKEY_USERS/*/Software/Microsoft/Windows/CurrentVersion/Run/*,
      HKEY_USERS/*/Software/Microsoft/Windows/CurrentVersion/RunOnce/*
  - name: SuspiciousRegex
    type: regex
    default: "(?i)(bitsadmin(\\.exe)?|start-bitstransfer|add-bitsfile|setnotifycmdline|resume-bitstransfer|complete-bitstransfer)"
  - name: UploadFiles
    type: bool
    default: false

sources:
  - name: QueueFiles
    description: Locate BITS queue database files and optionally upload them for offline parsing.
    query: |
      LET QueueFiles <= SELECT OSPath, Size, Mtime, Ctime, Btime, hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM glob(globs=BitsQueueGlob)

      SELECT * FROM if(
        condition=UploadFiles,
        then={
          SELECT OSPath, Size, Mtime, Ctime, Btime, Hashes.MD5 AS MD5, Hashes.SHA256 AS SHA256,
                 upload(file=OSPath) AS Upload
          FROM QueueFiles
        },
        else={
          SELECT OSPath, Size, Mtime, Ctime, Btime, Hashes.MD5 AS MD5, Hashes.SHA256 AS SHA256,
                 "" AS Upload
          FROM QueueFiles
        })

  - name: RegistryAutoruns
    description: Inspect common autorun registry keys for commands that invoke BITS abuse patterns.
    query: |
      LET AutoRuns <= SELECT OSPath, Data.value AS Command
      FROM glob(globs=split(string=RegistryGlobs, sep=","), accessor="registry")

      SELECT OSPath AS RegistryPath, Command
      FROM AutoRuns
      WHERE Command =~ SuspiciousRegex

  - name: ScheduledTasks
    description: Search scheduled task definitions for bitsadmin or PowerShell BITS cmdlets.
    query: |
      LET TaskHits <= SELECT OSPath, Mtime, Ctime, Btime,
             read_file(filename=OSPath, length=200000) AS Content
      FROM glob(globs=TaskGlob)

      SELECT OSPath, Mtime, Ctime, Btime, Content
      FROM TaskHits
      WHERE Content =~ SuspiciousRegex

  - name: PrefetchEvidence
    description: Check for bitsadmin prefetch artifacts indicating execution.
    query: |
      LET PrefetchFiles <= SELECT OSPath, Size, Mtime, Ctime, Btime, hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM glob(globs=PrefetchGlob)

      SELECT OSPath, Size, Mtime, Ctime, Btime, Hashes.MD5 AS MD5, Hashes.SHA256 AS SHA256
      FROM PrefetchFiles

column_types:
  - name: OSPath
    type: path
  - name: RegistryPath
    type: path
  - name: Mtime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: Btime
    type: timestamp
  - name: MD5
    type: hash
  - name: SHA256
    type: hash
  - name: Upload
    type: path
