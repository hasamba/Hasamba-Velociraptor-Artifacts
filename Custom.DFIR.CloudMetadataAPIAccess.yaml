name: Custom.DFIR.CloudMetadataAPIAccess
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects processes accessing the cloud instance metadata API at 169.254.169.254.
  
  Cloud metadata endpoints (AWS IMDS, GCP, Azure) expose credentials and instance
  configuration. Attackers use T1552.005 to harvest temporary IAM tokens, SSH keys,
  and startup scripts from these endpoints. This artifact monitors active network
  connections and process command lines for metadata API interaction, flagging
  suspicious processes that are not standard cloud-init or provisioning agents.

reference:
  - https://attack.mitre.org/techniques/T1552.005/

type: CLIENT

parameters:
  - name: KnownGoodRegex
    type: regex
    default: "cloud-init|systemd|sshd|cron|snapd|unattended-upgrade|packagekit|polkitd|dbus-daemon|NetworkManager|dhclient|udisksd|accounts-daemon|rsyslogd|journald|multipathd|lvm|lvmetad|agetty|login|snap|canonical"
    description: Regex for processes that are known to legitimately access metadata APIs.
  - name: MetadataIPs
    type: csv
    default: |
      IP
      169.254.169.254
      fd00:ec2::254
      metadata.google.internal
      100.100.100.200
    description: List of cloud metadata endpoint IPs/addresses to monitor.
  - name: SuspiciousCmdlineRegex
    type: regex
    default: "(curl|wget|python|perl|ruby|powershell|cmd|bash|sh|nc|ncat|socat|invoke-webrequest|invoke-restmethod|iwr)"
    description: Regex for command-line tools commonly used to query metadata APIs.

sources:
  - name: NetstatMetadataConnections
    description: |
      Identifies active or recent network connections to cloud metadata API addresses
      from suspicious processes, excluding known-good system services.
    query: |
      LET MetadataIPs <= SELECT IP FROM MetadataIPs

      LET Suspicious <= SELECT
          Pid, Ppid, Name, Exe, CommandLine, Username
        FROM pslist()
        WHERE NOT Name =~ KnownGoodRegex
          AND NOT CommandLine =~ KnownGoodRegex

      LET Connections <= SELECT
          Pid, Name, Status,
          Laddr.IP + ":" + format(format="%d", args=Laddr.Port) AS LocalAddr,
          Raddr.IP + ":" + format(format="%d", args=Raddr.Port) AS RemoteAddr,
          Raddr.IP AS RemoteIP
        FROM netstat()

      LET MetadataConnections <= SELECT * FROM foreach(
        row=Connections,
        query={
          SELECT * FROM foreach(
            row=MetadataIPs,
            query={
              SELECT
                Connections.Pid AS Pid,
                Connections.Name AS Name,
                Connections.Status AS Status,
                Connections.LocalAddr AS LocalAddr,
                Connections.RemoteAddr AS RemoteAddr,
                Suspicious.Exe AS ProcessExe,
                Suspicious.CommandLine AS ProcessCommandLine,
                Suspicious.Username AS Username,
                Suspicious.Ppid AS Ppid
              FROM Suspicious
              WHERE Connections.Pid = Suspicious.Pid
                AND Connections.RemoteIP = IP
            }
          )
        }
      )

      SELECT * FROM MetadataConnections

  - name: CommandLineMetadataAccess
    description: |
      Searches process command lines for explicit references to cloud metadata
      endpoint URLs or IPs, catching attempts even if the connection already
      closed and is no longer in netstat output.
    query: |
      LET SuspiciousProcs <= SELECT
          Pid, Ppid, Name, Exe, CommandLine, Username
        FROM pslist()
        WHERE CommandLine =~ SuspiciousCmdlineRegex
          AND (
            CommandLine =~ "169\\.254\\.169\\.254"
            OR CommandLine =~ "metadata"
            OR CommandLine =~ "fd00:ec2::254"
            OR CommandLine =~ "100\\.100\\.100\\.200"
            OR CommandLine =~ "metadata\\.google\\.internal"
          )

      SELECT
          Pid, Ppid, Name,
          Exe AS ProcessExe,
          CommandLine AS ProcessCommandLine,
          Username
        FROM SuspiciousProcs

column_types:
  - name: LocalAddr
    type: string
  - name: RemoteAddr
    type: string