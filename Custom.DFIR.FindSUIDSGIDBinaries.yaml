name: Custom.DFIR.FindSUIDSGIDBinaries
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Find SUID/SGID binaries that do not match a known-good baseline.
  This VQL artifact examines Linux paths and filters based on configured criteria.

reference:
  - https://attack.mitre.org/techniques/T1548.001/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: "/usr/bin/*"
  - name: FilterRegex
    type: regex
    default: "*"

sources:
  - name: Results
    description: Find binaries that are set with SUID/SGID.
    query: |
      LET Binaries <= SELECT OSPath FROM glob(globs=TargetGlob) WHERE SUID = true OR SGID = true
      SELECT OSPath FROM Binaries WHERE OSPath =~ FilterRegex

column_types:
  - name: OSPath
    type: path
  - name: Size
    type: int
  - name: Mtime
    type: timestamp
