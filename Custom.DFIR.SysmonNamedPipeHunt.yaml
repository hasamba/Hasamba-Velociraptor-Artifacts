name: Custom.DFIR.SysmonNamedPipeHunt
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts named pipe artifacts exposed by Sysmon Event ID 17 (Pipe Created) and
  Event ID 18 (Pipe Connected) on Windows endpoints.

  Named pipes are a common channel for adversary IPC abuse: C2 beaconing over
  private pipes, PSExec-style lateral movement through the svcctl/msrpc pipes,
  privileged pipe impersonation, and credential-dumping tooling touching pipe
  endpoints. This artifact parses the Sysmon operational event log (plus any
  rotated Sysmon log archives), keeps only pipe create/connect records, and
  filters them by pipe name and owning image with regex parameters. Maps to
  MITRE ATT&CK T1559.001 Inter-Process Communication abuse.

reference:
  - https://attack.mitre.org/techniques/T1559.001/

type: CLIENT

parameters:
  - name: SysmonLogGlob
    type: glob
    default: "C:/Windows/System32/winevt/Logs/Microsoft-Windows-Sysmon%4*.evtx"
    description: Where to find Sysmon operational event logs (includes rotated archives).

  - name: PipeNameRegex
    type: regex
    default: "."
    description: Regex filtering pipe names, e.g. "msrpc|svcctl|isapi".

  - name: ImagePathRegex
    type: regex
    default: "."
    description: Regex filtering the image that created or connected the pipe.

  - name: DaysLookback
    type: int
    default: 7
    description: Only keep events newer than this many days.

sources:
  - name: PipeEvents
    description: Sysmon pipe creation/connection records filtered by regex and lookback
    query: |
      LET LookbackTime <= timestamp(epoch=now() - DaysLookback * 86400)
      LET LogFiles <= SELECT OSPath FROM glob(globs=SysmonLogGlob)
      SELECT
        timestamp(epoch=System.TimeCreated.SystemTime) AS EventTime,
        System.Computer AS ComputerName,
        System.EventID.Value AS EventID,
        if(condition=System.EventID.Value = 17,
           then="PipeCreated",
           else="PipeConnected") AS EventAction,
        EventData.PipeName AS PipeName,
        EventData.Image AS Image,
        EventData.User AS PipeUser,
        EventData.ProcessId AS Pid,
        EventData.ProcessGuid AS ProcessGuid,
        OSPath AS SourceLog
      FROM foreach(row=LogFiles,
        query={ SELECT System, EventData, OSPath FROM parse_evtx(filename=OSPath) })
      WHERE (System.EventID.Value = 17 OR System.EventID.Value = 18)
        AND EventData.PipeName =~ PipeNameRegex
        AND EventData.Image =~ ImagePathRegex
        AND timestamp(epoch=System.TimeCreated.SystemTime) > LookbackTime

column_types:
  - name: EventTime
    type: timestamp
  - name: Image
    type: path
  - name: SourceLog
    type: path