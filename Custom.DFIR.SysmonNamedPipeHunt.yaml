name: Custom.DFIR.SysmonNamedPipeHunt
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts named pipe artifacts from Sysmon Event ID 17 (Pipe Created) and
  Event ID 18 (Pipe Connected) in the Sysmon operational event log.

  Named pipes are a common IPC channel abused for process execution,
  credential relaying and lateral movement (e.g. Cobalt Strike default
  pipes such as MSSE-*, postex pipes, or PsExec svcctl-style pipes).
  This artifact surfaces pipe names, creating/connecting process images
  and users so analysts can spot anomalous or malware-typical pipe names.

reference:
  - https://attack.mitre.org/techniques/T1559.001/

type: CLIENT

parameters:
  - name: SysmonLogGlob
    type: glob
    description: Glob pointing at the Sysmon operational EVTX log(s).
    default: "C:/Windows/System32/winevt/Logs/Microsoft-Windows-Sysmon%4Operational.evtx"
  - name: EventIDRegex
    type: regex
    description: Sysmon Event IDs to include (17 = Pipe Created, 18 = Pipe Connected).
    default: "^(17|18)$"
  - name: PipeNameRegex
    type: regex
    description: Filter pipe names by this regex.
    default: "."
  - name: ImageRegex
    type: regex
    description: Filter the creating/connecting process image by this regex.
    default: "."

sources:
  - name: PipeEvents
    description: |
      Sysmon EID 17/18 pipe events, filtered by EventIDRegex, PipeNameRegex and ImageRegex.
    query: |
      LET SysmonLogs <= SELECT OSPath FROM glob(globs=SysmonLogGlob)
      SELECT
        EventTime,
        EventID,
        EventType,
        Computer,
        PipeName,
        Image,
        User,
        LogPath
      FROM foreach(
        row=SysmonLogs,
        query={
          SELECT
            timestamp(string=System.TimeCreated.SystemTime) AS EventTime,
            System.EventID.Value AS EventID,
            EventData.EventType AS EventType,
            System.Computer AS Computer,
            EventData.PipeName AS PipeName,
            EventData.Image AS Image,
            EventData.User AS User,
            OSPath AS LogPath
          FROM parse_evtx(filename=OSPath)
        })
      WHERE EventID =~ EventIDRegex
        AND PipeName =~ PipeNameRegex
        AND if(condition=Image, then=Image =~ ImageRegex, else=TRUE)

  - name: PipeSummary
    description: |
      Pipes aggregated by name with event counts and first/last seen timestamps.
    query: |
      LET SysmonLogs <= SELECT OSPath FROM glob(globs=SysmonLogGlob)
      SELECT
        PipeName,
        count() AS TotalEvents,
        min(item=EventTime) AS FirstSeen,
        max(item=EventTime) AS LastSeen
      FROM foreach(
        row=SysmonLogs,
        query={
          SELECT
            timestamp(string=System.TimeCreated.SystemTime) AS EventTime,
            System.EventID.Value AS EventID,
            EventData.PipeName AS PipeName,
            EventData.Image AS Image,
            EventData.User AS User
          FROM parse_evtx(filename=OSPath)
        })
      WHERE EventID =~ EventIDRegex
        AND PipeName =~ PipeNameRegex
        AND if(condition=Image, then=Image =~ ImageRegex, else=TRUE)
      GROUP BY PipeName
      ORDER BY TotalEvents DESC

column_types:
  - name: EventTime
    type: timestamp
  - name: FirstSeen
    type: timestamp
  - name: LastSeen
    type: timestamp
  - name: LogPath
    type: path