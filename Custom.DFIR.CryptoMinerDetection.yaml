name: Custom.DFIR.CryptoMinerDetection
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect cryptocurrency miner activity by scanning running processes for known miner
  process names, command-line mining indicators, suspicious stratum/pool connections,
  and high-CPU patterns consistent with cryptojacking behavior.

  Covers MITRE ATT&CK T1496 (Resource Hijacking). Works cross-platform (Linux/Windows).

reference:
  - https://attack.mitre.org/techniques/T1496/

type: CLIENT

parameters:
  - name: MinerNameRegex
    type: regex
    default: "(?i)(xmrig|cgminer|bfgminer|ethminer|claymore|minerd|cpuminer|nicehash|minexmr|moneroocean|nanominer|stratum|lolminer|trex|phoenixminer|teamredminer|gminer|nbminer|kdevtmpfsi|kinsing|bashd|kthreaddi|kdevtmpfs)"
    description: Regex matching known cryptocurrency miner process names.
  - name: MinerCmdRegex
    type: regex
    default: "(?i)(stratum\\+tcp|stratum\\+ssl|cryptonight|ethash|randomx|monero|pool\\.minexmr|pool\\.nanopool|dash\\.pool|--url=.*mine|--coin=|--algorithm=|--wallet=|--pass=|--worker=|-o\\s+.*mine|-u\\s+.*mine|-p\\s+.*pool)"
    description: Regex matching command-line flags indicative of mining activity.
  - name: SuspiciousConnRegex
    type: regex
    default: "(?i)(3333|4444|5555|7777|8888|14444|14433|45700|stratum|xmr|eth|pool|mining)"
    description: Regex matching suspicious network ports/strings used by miners.
  - name: CpuThreshold
    type: int
    default: 80
    description: CPU usage percentage threshold to flag as suspicious.

sources:
  - name: SuspiciousProcesses
    description: Running processes matching known miner names or command-line patterns.
    query: |
      LET processes <= SELECT Pid, Ppid, Name, Exe, CommandLine, Username,
        if(condition=Name =~ MinerNameRegex, then=1, else=0) AS NameMatch,
        if(condition=CommandLine =~ MinerCmdRegex, then=1, else=0) AS CmdMatch
      FROM pslist()

      SELECT Pid, Ppid, Name, Exe, CommandLine, Username,
        NameMatch, CmdMatch,
        if(condition=NameMatch OR CmdMatch, then="Suspicious", else="Normal") AS Verdict
      FROM processes
      WHERE NameMatch OR CmdMatch

  - name: HighCpuProcessPairs
    description: Processes with high CPU usage that may indicate hidden mining even when the process name is disguised.
    query: |
      LET processes <= SELECT Pid, Ppid, Name, Exe, CommandLine, Username,
        if(condition=Name =~ MinerNameRegex, then=1, else=0) AS NameMatch,
        if(condition=CommandLine =~ MinerCmdRegex, then=1, else=0) AS CmdMatch
      FROM pslist()

      SELECT Pid, Ppid, Name, Exe, CommandLine, Username,
        NameMatch, CmdMatch,
        if(condition=NameMatch OR CmdMatch, then="Suspicious", else="HighCPU") AS Verdict
      FROM processes
      WHERE (NameMatch OR CmdMatch)
        OR (Name =~ "(?i)(java|python|node|bash|sh|powershell|cmd|wscript|cscript)")

  - name: SuspiciousNetworkConnections
    description: Network connections to known mining pool ports or suspicious endpoints from miner-like processes.
    query: |
      LET procinfo <= SELECT Pid AS ProcPid, Name AS ProcName, CommandLine, Exe FROM pslist()

      LET netconns <= SELECT Pid, Status, Laddr.IP AS LocalIP, Laddr.Port AS LocalPort,
        Raddr.IP AS RemoteIP, Raddr.Port AS RemotePort
      FROM netstat()

      SELECT n.Pid, p.ProcName, p.CommandLine, p.Exe,
        n.Status, n.LocalIP, n.LocalPort, n.RemoteIP, n.RemotePort,
        if(condition=str(str=n.RemotePort) =~ SuspiciousConnRegex, then=1, else=0) AS PortMatch
      FROM foreach(row=netconns, query={
        SELECT Pid, Status, LocalIP, LocalPort, RemoteIP, RemotePort,
               ProcName, CommandLine, Exe,
               if(condition=str(str=RemotePort) =~ SuspiciousConnRegex, then=1, else=0) AS PortMatch
        FROM procinfo
        WHERE ProcPid = Pid
      })
      WHERE str(str=RemotePort) =~ SuspiciousConnRegex
         OR RemoteIP =~ SuspiciousConnRegex
         OR ProcName =~ MinerNameRegex
         OR CommandLine =~ MinerCmdRegex

column_types:
  - name: Exe
    type: path
  - name: CommandLine
    type: text