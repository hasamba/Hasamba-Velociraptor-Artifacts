name: Custom.DFIR.AWSCredentialAccessAfterHours
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts for AWS credential files accessed outside normal working hours.
  
  Adversaries may search for AWS credential files (~/.aws/credentials, ~/.aws/config)
  on compromised hosts to harvest static access keys, secret keys, and session tokens.
  MITRE ATT&CK T1552.001 — Unsecured Credentials: Credentials In Files.
  
  This artifact monitors filesystem metadata on AWS credential files, flagging
  modifications or accesses occurring outside configurable working hours (default 08:00-20:00).
  It also collects the content of discovered files and extracts embedded access key IDs.

reference:
  - https://attack.mitre.org/techniques/T1552.001/

type: CLIENT

parameters:
  - name: AWSCredGlobs
    type: glob
    default: |
      /home/*/.aws/credentials
      /home/*/.aws/config
      /Users/*/.aws/credentials
      /Users/*/.aws/config
      /root/.aws/credentials
      /root/.aws/config
      /etc/aws/credentials
      /etc/aws/config
  - name: WorkStartHour
    type: int
    default: 8
    description: Start of normal working hours (0-23, local time)
  - name: WorkEndHour
    type: int
    default: 20
    description: End of normal working hours (0-23, local time)
  - name: FilterRegex
    type: regex
    default: "."
    description: Regex filter for OSPath matching
  - name: UploadFiles
    type: bool
    default: "Y"
    description: Upload discovered credential files for offline review

sources:
  - name: CredFileDiscovery
    description: Discover AWS credential files and flag after-hours access
    query: |
      LET CredFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime, Btime
        FROM glob(globs=split(string=AWSCredGlobs, sep="\n"))
        WHERE OSPath =~ FilterRegex AND Size > 0

      LET MtimeHour <= SELECT
          OSPath, Size, Mtime, Atime, Ctime, Btime,
          timestamp(epoch=Mtime).Hour AS MHour,
          timestamp(epoch=Atime).Hour AS AHour
        FROM CredFiles

      SELECT
          OSPath,
          Size,
          Mtime,
          Atime,
          Ctime,
          Btime,
          if(condition= MHour < WorkStartHour OR MHour >= WorkEndHour,
             then="AFTER_HOURS",
             else="WITHIN_HOURS") AS MtimeWorkStatus,
          if(condition= AHour < WorkStartHour OR AHour >= WorkEndHour,
             then="AFTER_HOURS",
             else="WITHIN_HOURS") AS AtimeWorkStatus,
          if(condition=UploadFiles,
             then=upload(file=OSPath),
             else=null) AS Upload
        FROM MtimeHour

  - name: AccessKeyExtraction
    description: Extract AWS Access Key IDs found in credential files for rapid triage
    query: |
      LET CredFiles <= SELECT OSPath
        FROM glob(globs=split(string=AWSCredGlobs, sep="\n"))
        WHERE OSPath =~ FilterRegex

      SELECT
          OSPath,
          filter(list=read_file(filename=OSPath).Lines, regex="(?i)aws_access_key_id") AS AccessKeyLines,
          filter(list=read_file(filename=OSPath).Lines, regex="^\\[") AS ProfileSections
        FROM CredFiles
        WHERE len(list=AccessKeyLines) > 0

column_types:
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: Btime
    type: timestamp
  - name: OSPath
    type: path
  - name: Upload
    type: path