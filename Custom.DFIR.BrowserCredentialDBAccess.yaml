name: Custom.DFIR.BrowserCredentialDBAccess
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for browser credential databases (Chrome/Edge/Firefox SQLite) access on Windows endpoints.

  Credential-stealing tools (infostealers, Mimikatz, LaZagne, ChromePass) and manual attackers
  access the credential stores of installed browsers: the Chromium "Login Data" SQLite database
  (Chrome and Edge) and the Firefox key4.db SQLite database with its logins.json companion.
  This artifact enumerates all such stores with creation/modification timestamps, sizes and
  hashes to surface unexpected modification or export activity, inspects SQLite file headers
  for tampering or corruption, lists running processes touching browser credential stores,
  and optionally uploads the stores for offline decryption and password extraction.
reference:
  - https://attack.mitre.org/techniques/T1555.003/
type: CLIENT

parameters:
  - name: FilterRegex
    type: regex
    default: "."
    description: Only report stores and processes whose path, name or command line match this regex.

  - name: UploadFiles
    type: bool
    default: "N"
    description: Upload the credential store files to the server for offline password-decryption analysis.

sources:
  - name: CredentialStores
    description: Enumerate browser credential database files with times, sizes and hashes.
    query: |
      LET DBFiles = SELECT OSPath, Name, Size, Mtime, Btime
        FROM glob(globs=[
          "C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Login Data",
          "C:/Users/*/AppData/Local/Microsoft/Edge/User Data/*/Login Data",
          "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/key4.db",
          "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/logins.json"
        ])
        WHERE NOT IsDir

      LET StoreInfo = SELECT OSPath AS Path, Name, Size,
             timestamp(epoch=Mtime) AS Modified,
             timestamp(epoch=Btime) AS Created,
             if(condition=UploadFiles,
                then=upload(file=OSPath)) AS Upload,
             hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
        FROM DBFiles
        WHERE OSPath =~ FilterRegex

      SELECT Path, Name, Size, Modified, Created, Upload,
             Hashes.MD5 AS MD5, Hashes.SHA256 AS SHA256
        FROM StoreInfo

  - name: StoreIntegrity
    description: Read SQLite headers of credential databases to detect tampering or corruption.
    query: |
      LET DBFiles = SELECT OSPath AS Path, Size
        FROM glob(globs=[
          "C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Login Data",
          "C:/Users/*/AppData/Local/Microsoft/Edge/User Data/*/Login Data",
          "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/key4.db"
        ])
        WHERE NOT IsDir

      LET Headers = SELECT Path, Size,
             if(condition=Size > 0,
                then=read_file(filename=Path, length=16)) AS Header
        FROM DBFiles

      SELECT Path, Size, Header,
             Header =~ "SQLite format 3" AS ValidSQLiteHeader
        FROM Headers
        WHERE Path =~ FilterRegex

  - name: SuspiciousProcesses
    description: Running processes that interact with browser credential stores.
    query: |
      SELECT Pid, Ppid, Name, Exe, CommandLine, Username,
             CreateTime AS StartTime
        FROM pslist()
        WHERE Name =~ FilterRegex
              AND (Name =~ "(?i)(chrome|msedge|firefox|brave|opera|vivaldi|chromium)"
                   OR CommandLine =~ "(?i)(Login Data|logins.json|key4.db|sqlite)")

column_types:
  - name: Path
    type: fs_path
  - name: Modified
    type: timestamp
  - name: Created
    type: timestamp
  - name: StartTime
    type: timestamp