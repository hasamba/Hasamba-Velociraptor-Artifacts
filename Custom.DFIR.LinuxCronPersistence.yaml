name: Custom.DFIR.LinuxCronPersistence
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts for cron-based persistence on Linux (MITRE ATT&CK T1053.003).

  Enumerates every classic cron location: user crontabs under /var/spool/cron
  and /var/spool/cron/crontabs, system crontabs (/etc/crontab), drop-in
  directories (/etc/cron.d, /etc/cron.hourly, /etc/cron.daily,
  /etc/cron.weekly, /etc/cron.monthly), anacron schedules, at jobs
  (/var/spool/cron/atjobs) and systemd timers. Flags suspicious indicators:
  download-exec patterns (curl/wget), base64 obfuscation, reverse shells,
  and payloads hidden in /tmp or /dev/shm.

  Cron remains one of the most reliable Linux persistence mechanisms because
  jobs re-execute on schedule and frequently run as root. A single line
  dropped into /etc/cron.d with root ownership survives reboots and is
  commonly abused by cryptominer droppers and web shells.

reference:
  - https://attack.mitre.org/techniques/T1053.003/

type: CLIENT

parameters:
  - name: CrontabGlob
    type: glob
    description: Glob patterns for cron-related files.
    default: |
      ["/var/spool/cron/**",
       "/var/spool/cron/crontabs/**",
       "/etc/crontab",
       "/etc/cron.d/**",
       "/etc/cron.hourly/**",
       "/etc/cron.daily/**",
       "/etc/cron.weekly/**",
       "/etc/cron.monthly/**",
       "/etc/anacrontab",
       "/var/spool/cron/atjobs/**",
       "/etc/systemd/system/*.timer",
       "/usr/lib/systemd/system/*.timer"]
  - name: SuspiciousRegex
    type: regex
    description: Regex flagging suspicious command content in cron lines.
    default: "(curl|wget|python[23]?|perl|base64|/tmp/|/dev/shm|chmod[[:space:]]+\\+x|nc[[:space:]]+-e|bash[[:space:]]+-i|openssl|http[s]?://)"
  - name: CommentRegex
    type: regex
    description: Lines matching this are treated as comments and skipped.
    default: "^[[:space:]]*(#|$)"

sources:
  - name: CronContent
    description: >
      Line-by-line parsing of all crontab, cron.d, anacron and at job files,
      with file ownership metadata, SHA256 and a suspicious-flag per line.
    query: |
      LET Files <= SELECT OSPath, Size, Mtime
        FROM glob(globs=CrontabGlob)
        WHERE NOT IsDir AND Size > 0

      LET CronLines = SELECT * FROM foreach(row=Files,
        query={
          SELECT OSPath AS CronFile, Line
          FROM split_records(filenames=OSPath, regex="\r?\n", columns=["Line"])
          WHERE Line =~ "[^[:space:]]"
            AND NOT Line =~ "^[[:space:]]*(#|$)"
        })

      SELECT
        CronFile,
        Line,
        if(condition=Line =~ SuspiciousRegex, then=TRUE, else=FALSE) AS Suspicious,
        hash(path=CronFile, hashselect="SHA256").SHA256 AS FileHash,
        Mtime AS FileMtime
      FROM foreach(row=Files, query=CronLines)

  - name: CronFileInfo
    description: >
      Per-file inventory of every cron-related file found: size, timestamps
      and SHA256 — useful for spotting planted cron files at a glance.
    query: |
      SELECT
        OSPath AS Path,
        Size,
        Mtime,
        hash(path=OSPath, hashselect="SHA256").SHA256 AS SHA256
      FROM glob(globs=CrontabGlob)
      WHERE NOT IsDir AND Size > 0

  - name: SuspiciousEntries
    description: >
      Only entries whose command content matches SuspiciousRegex — download,
      obfuscation, reverse shell or /tmp payload patterns. These usually
      warrant immediate triage.
    query: |
      LET Files <= SELECT OSPath
        FROM glob(globs=CrontabGlob)
        WHERE NOT IsDir AND Size > 0

      SELECT
        OSPath AS CronFile,
        Line,
        upload(file=OSPath) AS Upload
      FROM foreach(row=Files,
        query={
          SELECT OSPath, Line
          FROM split_records(filenames=OSPath, regex="\r?\n", columns=["Line"])
          WHERE Line =~ SuspiciousRegex
            AND NOT Line =~ CommentRegex
        })

column_types:
  - name: FileMtime
    type: timestamp
  - name: Mtime
    type: timestamp
