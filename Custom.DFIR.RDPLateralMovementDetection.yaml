name: Custom.DFIR.RDPLateralMovementDetection
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect RDP lateral movement using Windows Security Event Log IDs 4624 (logon), 4648 (explicit credentials) and 4778 (RDP session reconnection).

  Lateral movement via RDP (MITRE ATT&CK T1021.001) leaves distinctive traces
  in the Windows Security event log: LogonType 10 interactive/RDP logons
  (4624), credential usage with explicit credentials (4648 with RDP process
  names such as mstscax.dll ortermsrv.exe), and session reconnections
  (4778/4779). Correlating these on each endpoint lets an analyst spot
  on each endpoint lets an analyst spot workstation-to-workstation RDP hops even when central log aggregation is missing.

  Default filter passes all records; tighten the regex parameters to narrow
  to specific accounts, source hosts, or process names.

reference:
  - https://attack.mitre.org/techniques/T1021.001/

type: CLIENT

parameters:
  - name: EventLogGlob
    type: glob
    default: "C:/Windows/System32/winevt/Logs/Security*.evtx"
  - name: TargetUserRegex
    type: regex
    default: "."
  - name: SourceHostRegex
    type: regex
    default: "."
  - name: ProcessNameRegex
    type: regex
    default: "."
  - name: SearchDays
    type: int
    default: "7"

sources:
  - name: RDPLogon4624
    description: |
      Successful logons (4624) with LogonType 10 (RemoteInteractive / RDP),
      excluding machine accounts.
    query: |
      LET cutoff <= timestamp(epoch=now() - SearchDays * 86400)
      LET events <= SELECT EventTime, EventID, EventData
        FROM foreach(
          row={ SELECT OSPath FROM glob(globs=EventLogGlob) },
          query={
            SELECT timestamp(string=System.TimeCreated.SystemTime) AS EventTime,
                   System.EventID.Value AS EventID,
                   EventData
            FROM parse_evtx(filename=OSPath)
            WHERE System.EventID.Value = 4624
          })
      SELECT EventTime,
             EventID,
             EventData.SubjectUserName AS TargetUser,
             EventData.SubjectDomainName AS TargetDomain,
             EventData.IpAddress AS SourceIP,
             EventData.WorkstationName AS SourceHost,
             EventData.LogonType AS LogonType,
             EventData.ProcessName AS ProcessName,
             OSPath AS EventLog
      FROM events
      WHERE LogonType = "10"
        AND EventTime > cutoff
        AND TargetUser =~ TargetUserRegex
        AND SourceHost =~ SourceHostRegex

  - name: ExplicitCredentials4648
    description: |
      Logons with explicit credentials (4648) referencing RDP-related
      processes (mstsc.exe, mstscax.dll, termsrv.exe, svchost with
      TermService).
    query: |
      LET cutoff <= timestamp(epoch=now() - SearchDays * 86400)
      LET events <= SELECT EventTime, EventID, EventData
        FROM foreach(
          row={ SELECT OSPath FROM glob(globs=EventLogGlob) },
          query={
            SELECT timestamp(string=System.TimeCreated.SystemTime) AS EventTime,
                   System.EventID.Value AS EventID,
                   EventData
            FROM parse_evtx(filename=OSPath)
            WHERE System.EventID.Value = 4648
          })
      SELECT EventTime,
             EventID,
             EventData.SubjectUserName AS CallerUser,
             EventData.TargetUserName AS CredTargetUser,
             EventData.TargetServerName AS TargetServer,
             EventData.ProcessName AS ProcessName,
             EventData.IpAddress AS SourceIP,
             OSPath AS EventLog
      FROM events
      WHERE EventData.ProcessName =~ "(?i)mstsc|termsrv|TermService"
        AND ProcessName =~ ProcessNameRegex
        AND EventTime > cutoff

  - name: SessionReconnect4778
    description: |
      RDP session reconnect / enumerations (4778) showing which sessions are
      alive and from which workstation they were resumed.
    query: |
      LET cutoff <= timestamp(epoch=now() - SearchDays * 86400)
      LET events <= SELECT EventTime, EventID, EventData
        FROM foreach(
          row={ SELECT OSPath FROM glob(globs=EventLogGlob) },
          query={
            SELECT timestamp(string=System.TimeCreated.SystemTime) AS EventTime,
                   System.EventID.Value AS EventID,
                   EventData
            FROM parse_evtx(filename=OSPath)
            WHERE System.EventID.Value = 4778
          })
      SELECT EventTime,
             EventID,
             EventData.AccountName AS Account,
             EventData.ClientName AS ClientName,
             EventData.SessionName AS SessionName,
             OSPath AS EventLog
      FROM events
      WHERE EventTime > cutoff
        AND Account =~ TargetUserRegex
        AND ClientName =~ SourceHostRegex

  - name: Summary
    description: |
      Timeline of all RDP-related events across the three sources, sorted by
      time — the quick triage view for lateral movement.
    query: |
      LET cutoff <= timestamp(epoch=now() - SearchDays * 86400)
      LET rdp_events <= SELECT EventTime, EventID, EventData, OSPath AS EventLog
        FROM foreach(
          row={ SELECT OSPath FROM glob(globs=EventLogGlob) },
          query={
            SELECT timestamp(string=System.TimeCreated.SystemTime) AS EventTime,
                   System.EventID.Value AS EventID,
                   EventData,
                   OSPath
            FROM parse_evtx(filename=OSPath)
            WHERE System.EventID.Value in (4624, 4648, 4778)
          })
      SELECT EventTime,
             EventID,
             if(condition=EventID = 4624,
                then=EventData.SubjectUserName,
                else=EventData.AccountName) AS User,
             if(condition=EventID = 4624,
                then=EventData.IpAddress,
                else=EventData.ClientName) AS Source,
             OSPath AS EventLog
      FROM rdp_events
      WHERE EventTime > cutoff
        AND (EventData.SubjectUserName =~ TargetUserRegex
             OR EventData.AccountName =~ TargetUserRegex)
      ORDER BY EventTime

column_types:
  - name: EventTime
    type: timestamp
  - name: EventLog
    type: path
  - name: SourceIP
    type: text
