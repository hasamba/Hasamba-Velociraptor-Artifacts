name: Custom.DFIR.BrowserCredentialStoreHunt
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunts Windows endpoints for browser credential stores and evidence of access to them (T1555.003).
  Enumerates Chrome / Chromium / Chrome Beta / Chrome Canary (SxS) / Edge / Brave "Login Data"
  SQLite credential databases and Firefox logins.json, key4.db, key3.db and signons.sqlite within
  their legitimate profile locations, then flags identical filenames found outside profile paths
  (Temp, Downloads, Desktop, Documents, Public, ProgramData) as STAGED_COPY - the classic
  post-collection footprint of credential-relay and password-dumping tooling. Every hit is hashed
  (MD5/SHA256) for correlation against known attacker-staged copies, and stores can optionally be
  uploaded for offline decryption analysis. A second source lists running processes whose command
  lines reference the credential stores themselves or known credential-recovery tooling
  (NirSoft-style password viewers, mimikatz, pypykatz, sqlite cli/db tools, decryption scripts).

reference:
  - https://attack.mitre.org/techniques/T1555.003/

type: CLIENT

parameters:
  - name: FilterRegex
    type: regex
    description: Only report credential-store rows whose full path (components joined with /) matches this.
    default: "."

  - name: ProfileRegex
    type: regex
    description: Rows matching this (case-insensitive) are in a legitimate browser profile location (PROFILE); anything else is a STAGED_COPY.
    default: '(?i)(appdata/(local|roaming)/(google/chrome|google/chrome beta|google/chrome sxs|chromium|bravesoftware/brave-browser|microsoft/edge)/user data/[^/]+/(login data|login data-corrupt)$|appdata/roaming/mozilla/firefox/profiles/[^/]+/(logins\.json|key4\.db|key3\.db|signons\.sqlite)$)'

  - name: ProcessRegex
    type: regex
    description: Running processes whose CommandLine matches this regex are surfaced as suspicious credential-store accessors.
    default: '(?i)(chromepass|chromepw|browserpass|browserpassword|mailpassview|passwordfox|passworddump|password.?dump|mimikatz|pypykatz|firefox.?decrypt|chrome.?decrypt|sqlite3|sqlitebrowser|db.?browser|logins\.json|key4\.db|key3\.db|signons\.sqlite|login.?data)'

  - name: UploadFiles
    type: bool
    description: Upload each credential store for offline analysis on the server.
    default: false

sources:
  - name: CredentialStores
    description: Browser credential databases in legitimate profiles and copies staged outside profiles, with hashes and classification.
    query: |
      LET GlobTargets = parse_json(data='[
         "C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Login Data",
         "C:/Users/*/AppData/Local/Google/Chrome/User Data/*/Login Data-corrupt",
         "C:/Users/*/AppData/Local/Google/Chrome Beta/User Data/*/Login Data",
         "C:/Users/*/AppData/Local/Google/Chrome SxS/User Data/*/Login Data",
         "C:/Users/*/AppData/Local/Chromium/User Data/*/Login Data",
         "C:/Users/*/AppData/Local/Microsoft/Edge/User Data/*/Login Data",
         "C:/Users/*/AppData/Local/Microsoft/Edge/User Data/*/Login Data-corrupt",
         "C:/Users/*/AppData/Local/BraveSoftware/Brave-Browser/User Data/*/Login Data",
         "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/logins.json",
         "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/key4.db",
         "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/key3.db",
         "C:/Users/*/AppData/Roaming/Mozilla/Firefox/Profiles/*/signons.sqlite",
         "C:/Users/*/Downloads/**/Login Data",
         "C:/Users/*/Downloads/**/logins.json",
         "C:/Users/*/Downloads/**/key4.db",
         "C:/Users/*/Desktop/**/Login Data",
         "C:/Users/*/Desktop/**/logins.json",
         "C:/Users/*/Desktop/**/key4.db",
         "C:/Users/*/Documents/**/Login Data",
         "C:/Users/*/Documents/**/logins.json",
         "C:/Users/*/Documents/**/key4.db",
         "C:/Users/*/AppData/Local/Temp/**/Login Data",
         "C:/Users/*/AppData/Local/Temp/**/logins.json",
         "C:/Users/*/AppData/Local/Temp/**/key4.db",
         "C:/Users/Public/**/Login Data",
         "C:/Users/Public/**/logins.json",
         "C:/Users/Public/**/key4.db",
         "C:/Temp/**/Login Data",
         "C:/Temp/**/logins.json",
         "C:/Temp/**/key4.db",
         "C:/Windows/Temp/**/Login Data",
         "C:/Windows/Temp/**/logins.json",
         "C:/Windows/Temp/**/key4.db",
         "C:/ProgramData/**/Login Data",
         "C:/ProgramData/**/logins.json",
         "C:/ProgramData/**/key4.db"]')
      LET Files <= SELECT OSPath, Size, Mtime, Btime,
        if(condition=UploadFiles,
           then=upload(file=OSPath,
                       name='credstore_' + basename(path=dirname(path=OSPath)) + '_' + basename(path=OSPath)),
           else=NULL) AS Upload,
        join(array=OSPath.Components, sep='/') AS FlatPath
        FROM glob(globs=GlobTargets)
      LET Hashed <= SELECT *, hash(path=OSPath, hashselect='MD5,SHA256') AS HashInfo
        FROM Files
      SELECT OSPath, basename(path=OSPath) AS FileName, FlatPath,
             Size, Mtime, Btime,
             HashInfo.MD5 AS MD5, HashInfo.SHA256 AS SHA256,
             if(condition=FlatPath =~ ProfileRegex,
                then='PROFILE', else='STAGED_COPY') AS Classification,
             Upload
      FROM Hashed
      WHERE FlatPath =~ FilterRegex
      ORDER BY Classification DESC

  - name: SuspiciousProcesses
    description: Running processes whose command lines reference browser credential stores or credential-recovery tooling.
    query: |
      SELECT Pid, Ppid, Name, Exe, CommandLine, Username, CreateTime
      FROM pslist()
      WHERE CommandLine AND CommandLine =~ ProcessRegex
      ORDER BY Name

column_types:
  - name: OSPath
    type: string
  - name: FileName
    type: string
  - name: FlatPath
    type: string
  - name: Size
    type: number
  - name: Mtime
    type: timestamp
  - name: Btime
    type: timestamp
  - name: CreateTime
    type: timestamp
  - name: MD5
    type: string
  - name: SHA256
    type: string
  - name: Classification
    type: string