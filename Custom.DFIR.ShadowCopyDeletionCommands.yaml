name: Custom.DFIR.ShadowCopyDeletionCommands
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects attempts to delete Volume Shadow Copy Service (VSS) snapshots via
  command-line tooling: vssadmin.exe delete shadows, wmic shadowcopy delete,
  diskshadow delete shadows, and PowerShell Win32_ShadowCopy WMI delete calls.

  Shadow copy deletion (MITRE ATT&CK T1490 - Inhibit System Recovery) is a
  hallmark precursor of ransomware deployment and destructive attacks, removing
  the primary local recovery path. This artifact correlates historical process
  telemetry from three Windows event channels (Security 4688 process creation,
  Sysmon Event ID 1 process creation, PowerShell 4104 script blocks) and adds a
  live process sweep for vssadmin/wmic/diskshadow. Security 4688 command lines
  require the "Audit Process Creation" and command-line auditing policies to be
  enabled on the endpoint.

reference:
  - https://attack.mitre.org/techniques/T1490/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/vssadmin
  - https://learn.microsoft.com/en-us/previous-versions/windows/desktop/vsswmi/delete-method-in-class-win32-shadowcopy

type: CLIENT

parameters:
  - name: SecurityEvtxGlob
    description: Glob for the Security event log
    type: glob
    default: "C:/Windows/System32/winevt/Logs/Security.evtx"
  - name: SysmonEvtxGlob
    description: Glob for the Sysmon operational event log (optional channel)
    type: glob
    default: "C:/Windows/System32/winevt/Logs/Microsoft-Windows-Sysmon%4Operational.evtx"
  - name: PowerShellEvtxGlob
    description: Glob for the PowerShell operational event log
    type: glob
    default: "C:/Windows/System32/winevt/Logs/Microsoft-Windows-PowerShell%4Operational.evtx"
  - name: CommandLineRegex
    description: Regex matching shadow copy deletion command patterns
    type: regex
    default: "(?i)(vssadmin.{0,80}delete.{0,80}shadow|wmic.{0,200}(shadowcopy|stdshadowcopy|win32_shadowcopy).{0,200}delete|win32_shadowcopy.{0,80}delete|(Get-WmiObject|Get-CimInstance).{0,120}win32_shadowcopy|diskshadow.{0,200}delete.{0,80}shadow|delete\\s+shadows|delete.{0,16}shadow)"
  - name: ProcessNameRegex
    description: Regex for suspicious shadow copy tool process names (live sweep)
    type: regex
    default: "(?i)(vssadmin|wmic|diskshadow)\\.exe$"
  - name: DaysBack
    description: Only consider events newer than this many days
    type: int64
    default: 30

sources:
  - name: Security4688ProcessCreation
    description: Security event log 4688 process creation events with shadow copy deletion commands
    query: |
      LET SecurityFiles <= SELECT OSPath FROM glob(globs=SecurityEvtxGlob)
      LET TimeLowerBound <= now() - DaysBack * 86400

      SELECT
        EventTime,
        EventID,
        Computer,
        AccountDomain,
        AccountName,
        NewProcessId,
        NewProcessName,
        CreatorProcessId,
        ParentProcessName,
        CommandLine,
        EvtxPath
      FROM foreach(
        row=SecurityFiles,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            System.EventID.Value AS EventID,
            System.Computer AS Computer,
            EventData.SubjectDomainName AS AccountDomain,
            EventData.SubjectUserName AS AccountName,
            EventData.NewProcessId AS NewProcessId,
            EventData.NewProcessName AS NewProcessName,
            EventData.ProcessId AS CreatorProcessId,
            EventData.ParentProcessName AS ParentProcessName,
            EventData.CommandLine AS CommandLine,
            OSPath AS EvtxPath
          FROM parse_evtx(filename=OSPath)
          WHERE System.EventID.Value = 4688
        })
      WHERE CommandLine =~ CommandLineRegex
        AND EventTime > TimeLowerBound

  - name: SysmonProcessCreate
    description: Sysmon Event ID 1 process creation events with shadow copy deletion commands
    query: |
      LET SysmonFiles <= SELECT OSPath FROM glob(globs=SysmonEvtxGlob)
      LET TimeLowerBound <= now() - DaysBack * 86400

      SELECT
        EventTime,
        User,
        Image,
        OriginalFileName,
        CommandLine,
        ParentImage,
        EvtxPath
      FROM foreach(
        row=SysmonFiles,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            EventData.User AS User,
            EventData.Image AS Image,
            EventData.OriginalFileName AS OriginalFileName,
            EventData.CommandLine AS CommandLine,
            EventData.ParentImage AS ParentImage,
            OSPath AS EvtxPath
          FROM parse_evtx(filename=OSPath)
          WHERE System.EventID.Value = 1
        })
      WHERE CommandLine =~ CommandLineRegex
        AND EventTime > TimeLowerBound

  - name: PowerShell4104ScriptBlocks
    description: PowerShell 4104 script blocks invoking shadow copy deletion
    query: |
      LET PowerShellFiles <= SELECT OSPath FROM glob(globs=PowerShellEvtxGlob)
      LET TimeLowerBound <= now() - DaysBack * 86400

      SELECT
        EventTime,
        MessageNumber,
        MessageTotal,
        ScriptPath,
        ScriptBlockText,
        EvtxPath
      FROM foreach(
        row=PowerShellFiles,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            EventData.MessageNumber AS MessageNumber,
            EventData.MessageTotal AS MessageTotal,
            EventData.Path AS ScriptPath,
            EventData.ScriptBlockText AS ScriptBlockText,
            OSPath AS EvtxPath
          FROM parse_evtx(filename=OSPath)
          WHERE System.EventID.Value = 4104
        })
      WHERE ScriptBlockText =~ CommandLineRegex
        AND EventTime > TimeLowerBound

  - name: LiveSuspiciousProcesses
    description: Currently running shadow copy tooling (vssadmin/wmic/diskshadow)
    query: |
      SELECT
        Pid,
        Ppid,
        Name,
        Exe,
        CommandLine,
        Username,
        CreateTime AS StartTime
      FROM pslist()
      WHERE CommandLine =~ CommandLineRegex
        OR Name =~ ProcessNameRegex

column_types:
  - name: EventTime
    type: timestamp
  - name: StartTime
    type: timestamp
  - name: EvtxPath
    type: path
  - name: NewProcessName
    type: path
  - name: Image
    type: path
  - name: ParentImage
    type: path
  - name: ParentProcessName
    type: path
  - name: ScriptPath
    type: path
  - name: NewProcessId
    type: number
  - name: CreatorProcessId
    type: number
  - name: Pid
    type: number
  - name: Ppid
    type: number