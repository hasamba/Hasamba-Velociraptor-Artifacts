name: Custom.DFIR.SuspiciousServices
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Enumerates installed Windows services and flags those with suspicious
  binary paths — binaries outside standard Windows/Program Files locations,
  paths in user-writable directories, TEMP folders, or paths containing
  suspicious markers. Covers Windows service persistence (T1543.003).

  Services are a classic persistence mechanism. Attackers register services
  whose binPath points to a dropped binary in a world-writable or unusual
  location. This artifact reads the SERVICES registry key to localize each
  service's configured binary path, then filters for suspicious locations.

reference:
  - https://attack.mitre.org/techniques/T1543.003/

type: CLIENT

parameters:
  - name: SuspiciousPathRegex
    type: regex
    default: "(?i)(temp|users|appdata|programdata|public|downloads|perflogs|inetpub|recycle|\\\\windows\\\\tmp)"

  - name: ExcludeRegex
    type: regex
    default: "(?i)^$"

sources:
  - name: SuspiciousServices
    description: Services whose configured binary path matches suspicious locations
    query: |
      LET SVCKey = "HKEY_LOCAL_MACHINE/SYSTEM/CurrentControlSet/Services"
      SELECT
        ServiceName,
        ImagePath,
        StartMode,
        timestamp(epoch=Mtime) AS KeyModified,
        OSPath
      FROM foreach(
        row={
          SELECT Name AS ServiceName, OSPath
          FROM glob(globs=SVCKey + "/*", accessor="registry")
        },
        query={
          SELECT
            ServiceName,
            read_file(filename=OSPath + "/ImagePath", accessor="registry") AS ImagePath,
            read_file(filename=OSPath + "/Start", accessor="registry") AS StartMode,
            Mtime,
            OSPath
          FROM glob(
            globs=OSPath + "/ImagePath",
            accessor="registry")
          WHERE ImagePath =~ SuspiciousPathRegex
            AND NOT ImagePath =~ ExcludeRegex
        })

column_types:
  - name: KeyModified
    type: timestamp
  - name: OSPath
    type: path
