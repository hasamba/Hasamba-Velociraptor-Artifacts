name: Custom.DFIR.OfficeMacroTrustRecords
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Identifies Office macro execution evidence by examining registry TrustRecords
  and recently opened Office documents.

  This artifact hunts for TrustRecords entries that indicate a user clicked
  "Enable Content" on a macro-enabled Office document, as well as recent document
  entries (Office RecentDocs / MRU) that may reveal macro-laden files opened by the user.

  MITRE ATT&CK T1137.001 - Office Application Startup: Office Template Macros.

reference:
  - https://attack.mitre.org/techniques/T1137/001/

type: CLIENT

parameters:
  - name: TrustRecordGlob
    type: string
    default: "HKEY_USERS/*/Software/Microsoft/Office/*/*/Security/Trusted Documents/TrustRecords"
    description: Registry path glob for Office TrustRecords across all users and Office versions.
  - name: RecentDocsGlob
    type: string
    default: "HKEY_USERS/*/Software/Microsoft/Office/*/User MRU/*/File MRU/*"
    description: Registry path glob for Office RecentDocs / File MRU entries.
  - name: MacroExtRegex
    type: regex
    default: "(?i)\\.(docm|xltm|xlsm|xlsb|pptm|potm|doc|xls|ppt)$"
    description: Regex to filter for macro-capable Office file extensions in recent docs.
  - name: UploadFiles
    type: bool
    default: false
    description: If true, upload discovered macro-enabled files from the filesystem.

sources:
  - name: TrustRecords
    description: Office TrustRecords showing documents where macros were enabled.
    query: |
      LET TrustReg <= SELECT OSPath, Data FROM glob(globs=TrustRecordGlob, accessor="registry")

      LET Parsed <= SELECT
          OSPath AS RegistryKey,
          Data.value AS RawValue,
          if(condition=Data.value,
             then=Data.value,
             else="") AS TrustData
        FROM TrustReg

      SELECT
          RegistryKey,
          TrustData,
          regex_replace(source=TrustData, re="\\\\", replace="/") AS NormalizedPath
        FROM Parsed
        WHERE TrustData != ""

  - name: RecentMacroDocs
    description: Recent Office documents matching macro-capable extensions.
    query: |
      LET RecentReg <= SELECT OSPath, Data, Mtime FROM glob(globs=RecentDocsGlob, accessor="registry")

      LET ParsedRecent <= SELECT
          OSPath AS RegistryKey,
          Data.value AS RawValue,
          Mtime
        FROM RecentReg
        WHERE Data.value =~ MacroExtRegex

      SELECT
          RegistryKey,
          RawValue AS DocumentPath,
          regex_replace(source=RawValue, re="\\\\", replace="/") AS NormalizedPath,
          Mtime
        FROM ParsedRecent

  - name: MacroFilesOnDisk
    description: Macro-enabled Office files found on disk based on recent docs entries.
    query: |
      LET RecentReg <= SELECT OSPath, Data FROM glob(globs=RecentDocsGlob, accessor="registry")

      LET DocPaths <= SELECT
          regex_replace(
            source=regex_replace(source=Data.value, re="^\\[.*?\\]", replace=""),
            re="\\\\",
            replace="/"
          ) AS FilePath
        FROM RecentReg
        WHERE Data.value =~ MacroExtRegex
          AND Data.value =~ "^[A-Za-z]:"

      LET ExistingFiles <= SELECT
          FilePath,
          OSPath,
          Size,
          Mtime
        FROM foreach(
          row=DocPaths,
          query={
            SELECT FilePath, OSPath, Size, Mtime
            FROM glob(globs=FilePath)
            WHERE Size > 0
          }
        )

      SELECT * FROM if(
        condition=UploadFiles,
        then={
          SELECT FilePath, OSPath, Size, Mtime,
                 hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes,
                 upload(file=OSPath) AS Upload
          FROM ExistingFiles
        },
        else={
          SELECT FilePath, OSPath, Size, Mtime,
                 hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
          FROM ExistingFiles
        }
      )

column_types:
  - name: Mtime
    type: timestamp
  - name: NormalizedPath
    type: file_path
  - name: FilePath
    type: file_path
  - name: DocumentPath
    type: file_path