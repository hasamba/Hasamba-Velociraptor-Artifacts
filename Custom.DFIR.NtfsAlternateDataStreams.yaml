name: Custom.DFIR.NtfsAlternateDataStreams
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects Alternate Data Streams (ADS) on NTFS filesystems — a technique used by
  attackers to hide payloads, store staging data, or conceal malicious content
  behind legitimate-looking files (MITRE ATT&CK T1564.004).

  The artifact scans common user-writable locations for files with ADS, reports
  the stream name, size, and content preview, and optionally uploads suspicious
  streams for further analysis.

reference:
  - https://attack.mitre.org/techniques/T1564.004/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: "C:/Users/**"
    description: Root path to scan for ADS. Defaults to all user profiles.
  - name: FilterRegex
    type: regex
    default: "(?i)(zone\\.identifier|hidden|payload|stub|data|stream|ads| malicious|temp|cache|download)"
    description: Regex to filter interesting ADS stream names. Default catches common indicator patterns.
  - name: MaxStreamSize
    type: int
    default: 1048576
    description: Maximum stream size (bytes) to read for content preview. Default 1 MB.
  - name: UploadStreams
    type: bool
    default: false
    description: If true, upload suspicious ADS content to the server for analysis.

sources:
  - name: ADS
    description: Scan for Alternate Data Streams on NTFS.
    query: |
      LET RootFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime, Btime
        FROM glob(globs=TargetGlob, accessor="ntfs")
       WHERE IsDir = FALSE

      LET AllStreams <= SELECT OSPath, Size, Mtime, Atime, Ctime, Btime
        FROM foreach(
          row=RootFiles,
          query={
            SELECT OSPath, Size, Mtime, Atime, Ctime, Btime
              FROM glob(globs=OSPath + ":*", accessor="ntfs")
             WHERE NOT OSPath =~ ":\\$DATA$"
          })

      LET FilteredStreams <= SELECT OSPath, Size, Mtime, Atime, Ctime, Btime
        FROM AllStreams
       WHERE OSPath =~ FilterRegex

      LET WithPreview <= SELECT OSPath, Size, Mtime, Atime, Ctime, Btime,
        read_file(filename=OSPath, length=MaxStreamSize, accessor="ntfs") AS ContentPreview,
        hash(path=OSPath, hashselect="MD5,SHA256", accessor="ntfs") AS Hashes
        FROM FilteredStreams

      SELECT * FROM if(condition=UploadStreams,
        then={
          SELECT OSPath, Size, Mtime, Atime, Ctime, Btime, ContentPreview, Hashes,
            upload(file=OSPath, accessor="ntfs") AS Upload
          FROM WithPreview
        },
        else={
          SELECT OSPath, Size, Mtime, Atime, Ctime, Btime, ContentPreview, Hashes
          FROM WithPreview
        })

column_types:
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: Btime
    type: timestamp
  - name: OSPath
    type: path