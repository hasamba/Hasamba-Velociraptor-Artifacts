name: Custom.DFIR.BrowserCredentialDatabaseAccess
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Hunt for access to browser credential databases on Windows endpoints.
  
  This artifact enumerates Chrome, Edge, and Firefox credential database files,
  collects file metadata and hashes, and correlates recent handle access from
  running processes to help identify suspicious collection of saved credentials.
reference:
  - https://attack.mitre.org/techniques/T1555.003/
type: CLIENT
parameters:
  - name: TargetUsersGlob
    type: glob
    default: "C:/Users/*"
  - name: BrowserRegex
    type: regex
    default: "(?i)(Chrome|Edge|Firefox|Login Data|key4\\.db|logins\\.json|cookies|places\\.sqlite)"
  - name: ProcessRegex
    type: regex
    default: "(?i)."
  - name: UploadFiles
    type: bool
    default: false
sources:
  - name: BrowserCredentialFiles
    description: Enumerate browser credential databases and related files.
    query: |
      LET ChromeFiles <= SELECT OSPath, Size, Mtime, Btime, Ctime, Atime
        FROM glob(globs=TargetUsersGlob + "/AppData/Local/Google/Chrome/User Data/*/{Login Data,Login Data For Account,Cookies,Web Data,History}")
      LET EdgeFiles <= SELECT OSPath, Size, Mtime, Btime, Ctime, Atime
        FROM glob(globs=TargetUsersGlob + "/AppData/Local/Microsoft/Edge/User Data/*/{Login Data,Login Data For Account,Cookies,Web Data,History}")
      LET FirefoxFiles <= SELECT OSPath, Size, Mtime, Btime, Ctime, Atime
        FROM glob(globs=[
          TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/logins.json",
          TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/key4.db",
          TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/cookies.sqlite",
          TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/places.sqlite"
        ])
      LET AllFiles <= SELECT * FROM chain(a=ChromeFiles, b=EdgeFiles, c=FirefoxFiles)
      SELECT
        OSPath,
        Size,
        Mtime,
        Btime,
        Ctime,
        Atime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM AllFiles
      WHERE OSPath =~ BrowserRegex
  - name: SuspectProcessesWithOpenHandles
    description: Identify running processes with open handles to browser credential databases.
    query: |
      LET BrowserTargets <= SELECT OSPath
        FROM glob(globs=[
          TargetUsersGlob + "/AppData/Local/Google/Chrome/User Data/*/{Login Data,Login Data For Account,Cookies,Web Data,History}",
          TargetUsersGlob + "/AppData/Local/Microsoft/Edge/User Data/*/{Login Data,Login Data For Account,Cookies,Web Data,History}",
          TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/logins.json",
          TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/key4.db",
          TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/cookies.sqlite",
          TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/places.sqlite"
        ])
        WHERE OSPath =~ BrowserRegex
      LET OpenHandles <= SELECT ProcessName, Pid, Name, Type
        FROM handles()
        WHERE Type =~ "(?i)File" AND Name =~ BrowserRegex
      SELECT * FROM foreach(
        row=OpenHandles,
        query={
          SELECT
            Pid,
            Ppid,
            Name AS ProcessName,
            Exe,
            CommandLine,
            Username,
            OpenHandles.Name AS HandlePath,
            OpenHandles.Type AS HandleType
          FROM pslist(pid=OpenHandles.Pid)
          WHERE Name =~ ProcessRegex AND OpenHandles.Name IN BrowserTargets.OSPath
        })
  - name: OptionalUploads
    description: Upload matched browser credential files when requested.
    query: |
      SELECT * FROM if(
        condition=UploadFiles,
        then={
          SELECT OSPath, upload(file=OSPath) AS Upload
          FROM glob(globs=[
            TargetUsersGlob + "/AppData/Local/Google/Chrome/User Data/*/{Login Data,Login Data For Account,Cookies,Web Data,History}",
            TargetUsersGlob + "/AppData/Local/Microsoft/Edge/User Data/*/{Login Data,Login Data For Account,Cookies,Web Data,History}",
            TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/logins.json",
            TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/key4.db",
            TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/cookies.sqlite",
            TargetUsersGlob + "/AppData/Roaming/Mozilla/Firefox/Profiles/*/places.sqlite"
          ])
          WHERE OSPath =~ BrowserRegex
        },
        else={
          SELECT "uploads disabled" AS Status FROM scope()
        })
column_types:
  - name: OSPath
    type: path
  - name: Mtime
    type: timestamp
  - name: Btime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Hashes
    type: hashes
  - name: HandlePath
    type: path