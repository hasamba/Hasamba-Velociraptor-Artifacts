name: Custom.DFIR.ShadowCopyDeletionDetection
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect shadow copy deletion commands (vssadmin delete shadows, wmic
  shadowcopy delete, Win32_ShadowCopy removal) in Windows process logs.

  Inhibit System Recovery (T1490) is a hallmark ransomware pre-encryption
  step. Attackers wipe Volume Shadow Copies using native tooling:
    - vssadmin delete shadows /all /quiet
    - wmic shadowcopy delete (classic WMIC process invocation)
    - PowerShell Get-WmiObject Win32_ShadowCopy piped to Remove-WmiObject
  This artifact hunts that evidence in Windows process creation telemetry:
  Sysmon EventID 1 (Microsoft-Windows-Sysmon/Operational) and the Windows
  Security EventID 4688 (process auditing). Events are only surfaced when
  the process command line matches the FilterRegex signature. Note: 4688
  only carries CommandLine when "Audit Process Creation" with command line
  logging is enabled on the endpoint; Sysmon is the preferred sensor.

reference:
  - https://attack.mitre.org/techniques/T1490/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    description: Glob for the event log files to examine.
    default: C:/Windows/System32/winevt/Logs/*.evtx

  - name: LogFilterRegex
    type: regex
    description: Only examine event logs whose path matches this regex.
    default: '(?i)Sysmon|Security'

  - name: FilterRegex
    type: regex
    description: Match process command lines indicating shadow copy deletion.
    default: '(?i)vssadmin\s+delete\s+shadow|wmic\s+.*shadowcopy\s+delete|Win32_ShadowCopy.*(Remove-WmiObject|Remove-CimInstance|\$\.Delete)'

sources:
  - name: SysmonProcessCreation
    description: Sysmon EventID 1 process creations matching the shadow deletion signature.
    query: |
      LET SysmonPaths <= SELECT OSPath, Mtime
        FROM glob(globs=TargetGlob)
        WHERE OSPath =~ LogFilterRegex AND OSPath =~ "Sysmon"

      LET SysmonEvents <= SELECT * FROM foreach(
        row=SysmonPaths,
        query={
          SELECT timestamp(string=System.TimeCreated.SystemTime) AS EventTime,
                 System.Computer AS Hostname,
                 OSPath AS LogPath,
                 EventData.Image AS Image,
                 EventData.CommandLine AS CommandLine,
                 EventData.ParentImage AS ParentImage,
                 EventData.ParentCommandLine AS ParentCommandLine,
                 EventData.User AS User,
                 EventData.Hashes AS Hashes
          FROM parse_evtx(filename=OSPath)
          WHERE System.EventID.Value = 1
        })

      SELECT EventTime, Hostname, Image, CommandLine,
             ParentImage, ParentCommandLine, User, Hashes, LogPath
      FROM SysmonEvents
      WHERE CommandLine =~ FilterRegex

  - name: Security4688ProcessCreation
    description: Security EventID 4688 process creations matching the shadow deletion signature.
    query: |
      LET SecPaths <= SELECT OSPath, Mtime
        FROM glob(globs=TargetGlob)
        WHERE OSPath =~ LogFilterRegex AND OSPath =~ "Security"

      LET SecEvents <= SELECT * FROM foreach(
        row=SecPaths,
        query={
          SELECT timestamp(string=System.TimeCreated.SystemTime) AS EventTime,
                 System.Computer AS Hostname,
                 OSPath AS LogPath,
                 EventData.NewProcessName AS ProcessPath,
                 EventData.CommandLine AS CommandLine,
                 EventData.SubjectDomainName AS UserDomain,
                 EventData.SubjectUserName AS User
          FROM parse_evtx(filename=OSPath)
          WHERE System.EventID.Value = 4688
        })

      SELECT EventTime, Hostname, ProcessPath, CommandLine,
             UserDomain, User, LogPath
      FROM SecEvents
      WHERE CommandLine =~ FilterRegex

column_types:
  - name: EventTime
    type: timestamp
  - name: LogPath
    type: path
  - name: OSPath
    type: path
  - name: Image
    type: path
  - name: ProcessPath
    type: path
  - name: ParentImage
    type: path
  - name: Hashes
    type: long