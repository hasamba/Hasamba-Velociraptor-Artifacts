name: Custom.DFIR.ShadowCopyDeletionDetection
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects shadow copy deletion commands via wmic and vssadmin in process logs.
  
  Adversaries may delete volume shadow copies to prevent recovery of encrypted files,
  commonly observed in ransomware operations (MITRE ATT&CK T1490 - Inhibit System Recovery).
  This artifact monitors process creation events for known destructive commands targeting
  VSS snapshots and shadow storage.

reference:
  - https://attack.mitre.org/techniques/T1490/

type: CLIENT

parameters:
  - name: ProcessRegex
    type: regex
    default: "(?i)(vssadmin\\.exe.*delete|wmic\\.exe.*shadowcopy.*delete|wmic\\.exe.*shadowcopy.*set.*context|vssadmin\\.exe.*delete shadows|vssadmin\\.exe.*resize shadowstorage)"
  - name: UploadLogs
    type: bool
    default: "false"
    description: Upload full EVTX files for offline analysis.

sources:
  - name: ProcessEvents
    description: |
      Scans Security EVTX for process creation events (Event ID 4688) matching
      shadow copy deletion command patterns.
    query: |
      LET SecurityLogs <= SELECT OSPath FROM glob(
        globs="C:/Windows/System32/winevt/Logs/Security.evtx")

      LET ParsedEvents <= SELECT * FROM foreach(
        row=SecurityLogs,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            System.EventID.Value AS EventID,
            EventData.SubjectUserName AS SubjectUserName,
            EventData.SubjectDomainName AS SubjectDomainName,
            EventData.NewProcessName AS NewProcessName,
            EventData.CommandLine AS CommandLine,
            EventData.ParentProcessName AS ParentProcessName,
            OSPath AS EvtxPath
          FROM parse_evtx(filename=OSPath)
          WHERE System.EventID.Value = 4688
            AND EventData.CommandLine =~ ProcessRegex
        })

      SELECT * FROM if(
        condition=UploadLogs,
        then={
          SELECT *,
            upload(file=EvtxPath) AS EvtxUpload
          FROM ParsedEvents
        },
        else={
          SELECT * FROM ParsedEvents
        })

  - name: CommandLineAudit
    description: |
      Scans PowerShell operational log and Terminal Services log for additional
      shadow copy deletion commands including WMI-based and PowerShell variants.
    query: |
      LET EvtxGlobs <= SELECT OSPath FROM glob(
        globs=[
          "C:/Windows/System32/winevt/Logs/Microsoft-Windows-PowerShell%4Operational.evtx",
          "C:/Windows/System32/winevt/Logs/Microsoft-Windows-TerminalServices-LocalSessionManager%4Operational.evtx"
        ])

      LET ParsedAll <= SELECT * FROM foreach(
        row=EvtxGlobs,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            System.EventID.Value AS EventID,
            EventData AS EventData,
            Message AS Message,
            OSPath AS EvtxPath
          FROM parse_evtx(filename=OSPath)
          WHERE Message =~ ProcessRegex
             OR (EventData.CommandLine =~ ProcessRegex)
        })

      SELECT * FROM ParsedAll

  - name: LiveProcessCheck
    description: |
      Checks currently running processes for active shadow copy deletion commands.
      Catches in-progress attacks that haven't yet completed.
    query: |
      SELECT
        Pid,
        Ppid,
        Name,
        Exe,
        CommandLine,
        Username,
        timestamp(epoch=CreateTime) AS CreateTime
      FROM pslist()
      WHERE CommandLine =~ ProcessRegex

column_types:
  - name: EventTime
    type: timestamp
  - name: CreateTime
    type: timestamp
  - name: EvtxPath
    type: path
  - name: EvtxUpload
    type: path