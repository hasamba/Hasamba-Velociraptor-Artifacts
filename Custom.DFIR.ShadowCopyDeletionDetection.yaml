name: Custom.DFIR.ShadowCopyDeletionDetection
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect shadow copy deletion commands (wmic shadowcopy delete, vssadmin delete shadows)
  in Windows process execution logs (Security 4688, Sysmon 1).

  Attackers delete Volume Shadow Copies to prevent recovery (MITRE ATT&CK T1490 -
  Inhibit System Recovery). This artifact hunts for the classic deletion command
  patterns in process creation events across all EVTX logs.

reference:
  - https://attack.mitre.org/techniques/T1490/

type: CLIENT

parameters:
  - name: EvtxGlob
    type: glob
    default: "C:/Windows/System32/winevt/Logs/*.evtx"
  - name: FilterRegex
    type: regex
    default: "(?i)(shadowcopy|shadow\\s+copy|delete\\s+shadows|vssadmin|win32_shadowcopy)"

sources:
  - name: Results
    description: Shadow copy deletion command lines from process execution events
    query: |
      LET EvtxFiles <= SELECT OSPath FROM glob(globs=EvtxGlob)

      SELECT
        timestamp(epoch=EventTime) AS EventTime,
        Computer,
        EventID,
        CommandLine,
        ParentImage,
        Image
      FROM foreach(
        row=EvtxFiles,
        query={
          SELECT
            System.TimeCreated.SystemTime AS EventTime,
            System.Computer AS Computer,
            System.EventID.Value AS EventID,
            EventData.CommandLine AS CommandLine,
            EventData.ParentImage AS ParentImage,
            EventData.Image AS Image
          FROM parse_evtx(filename=OSPath)
          WHERE
            System.EventID.Value IN (1, 4688)
            AND (CommandLine =~ FilterRegex OR EventData =~ FilterRegex)
        })

column_types:
  - name: EventTime
    type: timestamp
  - name: Image
    type: path
  - name: ParentImage
    type: path
