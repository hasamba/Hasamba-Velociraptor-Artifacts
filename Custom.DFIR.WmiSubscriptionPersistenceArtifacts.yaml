name: Custom.DFIR.WmiSubscriptionPersistenceArtifacts
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect WMI permanent event subscription artifacts in MOF files and registry-backed WBEM configuration.
  
  This hunts for common WMI persistence constructs such as event filters, consumers, and filter-to-consumer bindings in Windows WBEM MOF files, plus autorecover and related WMI registry locations that can preserve or reference those files.

reference:
  - https://attack.mitre.org/techniques/T1546.003/

type: CLIENT

parameters:
  - name: MofGlob
    type: glob
    default: "C:/Windows/System32/wbem/**/*.mof"
  - name: FilterRegex
    type: regex
    default: "."
  - name: ContentRegex
    type: regex
    default: "__EventFilter|CommandLineEventConsumer|ActiveScriptEventConsumer|LogFileEventConsumer|NTEventLogEventConsumer|__FilterToConsumerBinding|Win32_Process|powershell|cmd\\.exe"
  - name: RegistryRegex
    type: regex
    default: "."

sources:
  - name: MofFiles
    description: Suspicious WBEM MOF files containing WMI persistence classes or commands
    query: |
      LET MofFiles <= SELECT OSPath, Size, Mtime FROM glob(globs=MofGlob)
      LET MofDetails <= SELECT
        OSPath,
        Size,
        Mtime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hash,
        read_file(filename=OSPath, length=131072) AS Content
      FROM MofFiles
      SELECT
        OSPath,
        Size,
        Mtime,
        Hash.MD5 AS MD5,
        Hash.SHA256 AS SHA256,
        Content
      FROM MofDetails
      WHERE OSPath =~ FilterRegex
        AND Content =~ ContentRegex

  - name: WbemRegistry
    description: Registry entries under WBEM CIMOM that can reference autorecover MOFs or related WMI configuration
    query: |
      LET WbemRegistry <= SELECT OSPath, Name, Data, Mtime FROM glob(
        globs=[
          "HKEY_LOCAL_MACHINE/SOFTWARE/Microsoft/WBEM/CIMOM/Autorecover MOFs/*",
          "HKEY_LOCAL_MACHINE/SOFTWARE/Microsoft/WBEM/CIMOM/*"
        ],
        accessor="registry"
      )
      SELECT
        OSPath,
        Name,
        Data,
        Mtime
      FROM WbemRegistry
      WHERE OSPath =~ RegistryRegex
        OR Name =~ ContentRegex
        OR Data =~ ContentRegex

column_types:
  - name: OSPath
    type: path
  - name: Mtime
    type: timestamp
  - name: SHA256
    type: hash
