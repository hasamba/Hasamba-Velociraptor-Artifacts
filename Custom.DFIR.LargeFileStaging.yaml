name: Custom.DFIR.LargeFileStaging
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects large files staged in temporary and user-writable directories,
  a common precursor to exfiltration (MITRE ATT&CK T1074.001 - Local Data
  Staging). Adversaries frequently collect documents, archives, and disk
  images into temp/user folders before compressing and exfiltrating them.

  The artifact enumerates files above a configurable size threshold in
  temp, downloads, desktop, and documents locations, filters them by
  filename regex, restricts results to recently modified files to surface
  fresh staging activity, and hashes every hit (MD5 + SHA256). Windows is
  the primary platform; Unix globs are included so the artifact runs
  cross-platform - globs for paths that do not exist on a given OS simply
  return no rows.

  Triage guidance: large recent archives or disc images inside Temp
  directories, especially with staging-like names, justify immediate
  follow-up with collection tooling and network telemetry review.
reference:
  - https://attack.mitre.org/techniques/T1074.001/
type: CLIENT

parameters:
  - name: TargetGlobs
    type: glob
    default: |
      [
        "C:/Users/*/Downloads/**",
        "C:/Users/*/Desktop/**",
        "C:/Users/*/Documents/**",
        "C:/Users/*/AppData/Local/Temp/**",
        "C:/Users/*/AppData/Roaming/**",
        "C:/Windows/Temp/**",
        "C:/ProgramData/Temp/**",
        "/tmp/**",
        "/var/tmp/**",
        "/home/*/Downloads/**",
        "/home/*/Desktop/**",
        "/home/*/Documents/**"
      ]
  - name: SizeThresholdBytes
    type: int
    default: "104857600"
  - name: AgeFilterDays
    type: int
    default: "7"
  - name: FilterRegex
    type: regex
    default: "."
  - name: ExcludeRegex
    type: regex
    default: |
      (?i)(/Cache/|/Code Cache/|/GPUCache/|/node_modules/|/\.venv/|/\.git/|/Crashpad/|/D3DSCache/)

sources:
  - name: StagedFiles
    description: |
      Large recent files in temp and user directories with MD5/SHA256 hashes.
    query: |
      LET CandidateFiles = SELECT OSPath, Size, Mtime, Btime
        FROM glob(globs=TargetGlobs)
        WHERE Size > SizeThresholdBytes
          AND OSPath =~ FilterRegex
          AND if(condition=ExcludeRegex,
                 then= NOT (OSPath =~ ExcludeRegex),
                 else= TRUE)
          AND Mtime > timestamp(epoch=now() - AgeFilterDays * 86400)

      LET HashedFiles = SELECT *,
          hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
        FROM CandidateFiles

      SELECT
        OSPath AS Path,
        Size AS SizeBytes,
        Mtime AS Modified,
        Btime AS Created,
        Hashes.MD5 AS MD5,
        Hashes.SHA256 AS SHA256,
        if(condition=Path =~ "(?i)temp|tmp", then="temp_dir",
           else=if(condition=Path =~ "(?i)downloads", then="downloads",
             else=if(condition=Path =~ "(?i)desktop", then="desktop",
               else="user_dir"))) AS LocationHint
      FROM HashedFiles
      ORDER BY SizeBytes DESC

  - name: StagingSummary
    description: |
      Aggregate staging activity per parent directory to spot collection folders.
    query: |
      LET CandidateFiles = SELECT OSPath, Size, Mtime, Btime
        FROM glob(globs=TargetGlobs)
        WHERE Size > SizeThresholdBytes
          AND OSPath =~ FilterRegex
          AND if(condition=ExcludeRegex,
                 then= NOT (OSPath =~ ExcludeRegex),
                 else= TRUE)
          AND Mtime > timestamp(epoch=now() - AgeFilterDays * 86400)

      SELECT dirname(path=OSPath) AS ParentDirectory,
             count() AS FileCount,
             sum(item=Size) AS TotalSizeBytes
      FROM CandidateFiles
      GROUP BY ParentDirectory
      ORDER BY TotalSizeBytes DESC

column_types:
  - name: Path
    type: path
  - name: Modified
    type: timestamp
  - name: Created
    type: timestamp
  - name: MD5
    type: hash
  - name: SHA256
    type: hash