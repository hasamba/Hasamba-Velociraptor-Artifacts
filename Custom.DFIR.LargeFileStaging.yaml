name: Custom.DFIR.LargeFileStaging
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detect large files staged in temp and user directories before exfiltration.
  
  Adversaries often collect and stage data in local directories (e.g., temp folders,
  user profiles, AppData) prior to exfiltration. This artifact identifies files
  exceeding a configurable size threshold in known staging locations, helping
  analysts spot pre-exfiltration activity early.

reference:
  - https://attack.mitre.org/techniques/T1074.001/

type: CLIENT

parameters:
  - name: SizeThresholdMB
    type: int
    default: "10"
    description: Minimum file size in MB to flag as suspicious staging.
  - name: TempGlobs
    type: csv
    default: |
      Glob
      C:/Windows/Temp/**/*
      C:/Users/*/AppData/Local/Temp/**/*
      C:/Users/*/Downloads/**/*
      C:/Users/*/Desktop/**/*
      /tmp/**/*
      /var/tmp/**/*
      /home/*/.cache/**/*
      /home/*/Downloads/**/*
  - name: SuspiciousExtensionsRegex
    type: regex
    default: "\\.(zip|rar|7z|tar|gz|bz2|xz|cab|iso|dmg|exe|ps1|bat|cmd|psd1|vbs|vbe|doc|docx|xls|xlsx|ppt|pptx|pdf|csv|sql|bak|conf|cfg|ini|yml|yaml|json|xml)$"
    description: Regex matching file extensions commonly associated with staged data.
  - name: IgnoreRegex
    type: regex
    default: "\\.(log|tmp|lock|pid|sock)$"
    description: Regex for file extensions to ignore (reduce noise).

sources:
  - name: StagedFiles
    description: Find large files in common staging directories.
    query: |
      LET SizeBytes <= SizeThresholdMB * 1048576

      LET AllFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime,
         basename(path=OSPath) AS Name
      FROM foreach(row={
         SELECT * FROM parse_csv(filename=TempGlobs, accessor="data")
      }, query={
         SELECT OSPath, Size, Mtime, Atime, Ctime
         FROM glob(globs=Glob)
         WHERE Size > SizeBytes
            AND NOT Name =~ IgnoreRegex
      })

      SELECT OSPath, Size, Mtime, Atime, Ctime, Name,
         if(condition=Name =~ SuspiciousExtensionsRegex,
            then="Suspicious Extension",
            else="Large File") AS MatchReason,
         hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM AllFiles
      WHERE OSPath =~ "."

  - name: StagedFileSummary
    description: Summary statistics of staging activity per directory.
    query: |
      LET SizeBytes <= SizeThresholdMB * 1048576

      LET AllFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime,
         basename(path=OSPath) AS Name,
         dirname(path=OSPath) AS Directory
      FROM foreach(row={
         SELECT * FROM parse_csv(filename=TempGlobs, accessor="data")
      }, query={
         SELECT OSPath, Size, Mtime, Atime, Ctime
         FROM glob(globs=Glob)
         WHERE Size > SizeBytes
            AND NOT Name =~ IgnoreRegex
      })

      SELECT Directory,
         count() AS FileCount,
         sum(item=Size) AS TotalSize,
         min(item=Mtime) AS OldestFile,
         max(item=Mtime) AS NewestFile
      FROM AllFiles
      WHERE OSPath =~ "."
      GROUP BY Directory

column_types:
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: OldestFile
    type: timestamp
  - name: NewestFile
    type: timestamp
  - name: OSPath
    type: path