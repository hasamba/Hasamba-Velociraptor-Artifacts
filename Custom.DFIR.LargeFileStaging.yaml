name: Custom.DFIR.LargeFileStaging
author: Yaniv Radunsky @ tenroot & Hohit (AI)
description: |
  Detects large files staged in temporary and user directories that may indicate
  collection and staging activity prior to exfiltration (MITRE ATT&CK T1074.001).

  Adversaries often collect and stage large files in temp directories, user
  profiles, or other writable locations before compressing and exfiltrating them.
  This artifact scans common staging paths for files exceeding a size threshold,
  flags recently modified files, and computes hashes for identification.

reference:
  - https://attack.mitre.org/techniques/T1074/001/

type: CLIENT

parameters:
  - name: MinSizeMB
    type: int
    default: 50
    description: Minimum file size in MB to flag as staged
  - name: RecentDays
    type: int
    default: 7
    description: Only show files modified within this many days
  - name: TempGlob
    type: glob
    default: "C:/Windows/Temp/**"
    description: Windows system temp directory glob
  - name: UserTempGlob
    type: glob
    default: "C:/Users/*/AppData/Local/Temp/**"
    description: Per-user temp directory glob
  - name: UserProfileGlob
    type: glob
    default: "C:/Users/*/Downloads/**"
    description: User Downloads directory glob
  - name: StagingRegex
    type: regex
    default: "(?i)\\.(zip|rar|7z|tar|gz|iso|img|vhd|dmp|csv|pst|ost|db|sqlite)$"
    description: Regex to match suspicious staging file extensions

sources:
  - name: TempDirStaging
    description: Scans Windows system and user temp directories for large staged files
    query: |
      LET MinBytes = MinSizeMB * 1024 * 1024
      LET Cutoff = timestamp(epoch=now() - RecentDays * 86400)

      LET TempFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime
        FROM glob(globs=TempGlob)
        WHERE NOT IsDir AND Size > MinBytes

      LET UserTempFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime
        FROM glob(globs=UserTempGlob)
        WHERE NOT IsDir AND Size > MinBytes

      LET AllTempFiles <= SELECT * FROM chain(
        a={ SELECT * FROM TempFiles },
        b={ SELECT * FROM UserTempFiles }
      )

      SELECT
        OSPath,
        Size,
        Mtime,
        Atime,
        Ctime,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM AllTempFiles
      WHERE Mtime > Cutoff
      ORDER BY Size DESC

  - name: UserDownloadsStaging
    description: Scans user Downloads directories for large archived files matching staging patterns
    query: |
      LET MinBytes = MinSizeMB * 1024 * 1024
      LET Cutoff = timestamp(epoch=now() - RecentDays * 86400)

      LET DownloadFiles <= SELECT OSPath, Size, Mtime, Atime, Ctime
        FROM glob(globs=UserProfileGlob)
        WHERE NOT IsDir AND Size > MinBytes

      SELECT
        OSPath,
        Size,
        Mtime,
        Atime,
        Ctime,
        OSPath =~ StagingRegex AS MatchesStagingPattern,
        hash(path=OSPath, hashselect="MD5,SHA256") AS Hashes
      FROM DownloadFiles
      WHERE Mtime > Cutoff
      ORDER BY Size DESC

column_types:
  - name: OSPath
    type: path
  - name: Mtime
    type: timestamp
  - name: Atime
    type: timestamp
  - name: Ctime
    type: timestamp
  - name: Size
    type: number