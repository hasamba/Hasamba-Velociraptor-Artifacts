name: Custom.DFIR.HuntLocalPasswdShadow

author: Yaniv Radunsky @ tenroot & Hohit (AI)

description: |
  Hunt for suspicious modifications to important Linux files, specifically /etc/passwd and /etc/shadow.
  
  This artifact aims to identify possibly malicious changes to user credentials in Linux.

reference:
  - https://attack.mitre.org/techniques/T1136.001/

type: CLIENT

parameters:
  - name: TargetGlob
    type: glob
    default: "/etc/passwd,/etc/shadow"
  - name: FilterRegex
    type: regex
    default: ".*"

sources:
  - name: ModificationResults
    description: Detect modifications to /etc/passwd and /etc/shadow.
    query: |
      LET Files <= SELECT OSPath FROM glob(globs=TargetGlob)
      SELECT OSPath FROM Files WHERE OSPath =~ FilterRegex

column_types:
  - name: Mtime
    type: timestamp